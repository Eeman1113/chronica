<style>
:root{
  --ink:#171210; --ink2:#1e1915; --ink3:#262019; --line:#3a322a;
  --par:#cfc4a6; --dim:#8d846c; --faint:#5c5546;
  --crim:#e0455a; --olive:#9a9455; --water:#6e8ca0; --stone:#9b8f96; --gold:#c2a05a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--par);font:13px/1.5 "IBM Plex Mono",Menlo,Consolas,monospace;overflow:hidden}
#map{position:fixed;inset:0;display:block;cursor:grab;background:var(--ink)}
#map.drag{cursor:grabbing}
button{font:inherit;color:var(--par);background:var(--ink3);border:1px solid var(--line);padding:3px 9px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--dim);color:#efe6cd}
button:focus-visible{outline:2px solid var(--crim);outline-offset:1px}
button.on{background:var(--crim);border-color:var(--crim);color:#fff}
input,select,textarea{font:inherit;color:var(--par);background:var(--ink);border:1px solid var(--line);padding:4px 7px;border-radius:2px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#topbar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:14px;
  padding:0 12px;background:rgba(23,18,16,.92);border-bottom:1px solid var(--line);z-index:20;backdrop-filter:blur(3px)}
#brand{font-family:Cinzel,serif;font-weight:700;font-size:16px;letter-spacing:.22em;color:#e8ddbd;white-space:nowrap}
#brand .wn{font-family:"IBM Plex Mono";font-weight:400;font-size:11px;letter-spacing:.05em;color:var(--dim);margin-left:10px}
#clock{white-space:nowrap;color:var(--par)}
#clock .season{color:var(--olive)}#clock .wx{color:var(--water);margin-left:8px}
#topbar .sp{flex:1}
#speeds{display:flex;gap:3px}
#speeds button{min-width:34px;padding:3px 5px}
#pop{color:var(--dim);white-space:nowrap}
#pop b{color:var(--par)}
#menu{display:flex;gap:5px}
.tbtn{padding:3px 7px}

#side{position:fixed;top:44px;right:0;bottom:0;width:360px;background:rgba(26,21,17,.94);border-left:1px solid var(--line);
  display:flex;flex-direction:column;z-index:15;transform:translateX(0);transition:transform .18s}
#side.hidden{transform:translateX(100%)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;padding:8px 2px;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-radius:0}
#tabs button:last-child{border-right:0}
#tabs button.on{color:#efe6cd;background:var(--ink3);box-shadow:inset 0 -2px 0 var(--crim)}
#panelbody{flex:1;overflow-y:auto;padding:12px 14px 24px}
#panelbody h2{font-size:14px;font-weight:600;color:#efe6cd;margin:2px 0 6px;text-wrap:balance}
#panelbody h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 5px;border-bottom:1px solid var(--line);padding-bottom:3px}
#panelbody .sub{color:var(--dim);font-size:12px}
#panelbody .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-size:12px}
#panelbody .kv .k{color:var(--faint)}
#panelbody .kv .v{color:var(--par);font-variant-numeric:tabular-nums}
.lnk{color:#d8c88f;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.lnk:hover{color:#f4e6b6}
.chip{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:9px;font-size:11px;color:var(--dim);margin:1px 2px 1px 0}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.bar{height:6px;background:var(--ink);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--olive)}
.evline{padding:3px 0;border-bottom:1px solid #241e18;font-size:12px;line-height:1.45}
.evline .y{color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.evline.jump{cursor:pointer}.evline.jump:hover{background:#221c16}
.ev-war{color:#d98a80}.ev-battle{color:#d98a80}.ev-found{color:#a9c08a}.ev-politics{color:#d8c88f}
.ev-faith{color:#b9a2d6}.ev-calamity{color:#e0455a}.ev-tech{color:#8fc0c0}.ev-life{color:#b8ad93}.ev-misc{color:#9c9384}
.bio{font-size:12px;color:#b8ad93;padding-left:4px}
.bio div{padding:1px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.filters button{font-size:10px;padding:1px 7px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.filters button.on{background:var(--ink3);color:#efe6cd;border-color:var(--dim)}
#histsearch{width:100%;margin:4px 0}
.statnum{font-size:22px;font-weight:600;color:#efe6cd;font-variant-numeric:tabular-nums}
.statlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
canvas.chart{width:100%;border:1px solid var(--line);border-radius:2px;background:#12100c;margin:4px 0 10px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:2px 6px 2px 0;text-align:left;border-bottom:1px solid #241e18}
table.t th{color:var(--faint);font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
table.t td{font-variant-numeric:tabular-nums}

#ticker{position:fixed;left:12px;bottom:12px;width:430px;max-width:44vw;z-index:12;pointer-events:none;
  display:flex;flex-direction:column;gap:2px;font-size:12px}
#ticker .tl{background:rgba(23,18,16,.82);border-left:2px solid var(--line);padding:2px 8px;color:#b8ad93;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:auto;cursor:pointer;border-radius:0 2px 2px 0}
#ticker .tl:hover{color:#efe6cd}
#ticker .tl .y{color:var(--faint);margin-right:6px}

#mmwrap{position:fixed;right:372px;bottom:12px;z-index:12;background:rgba(23,18,16,.9);border:1px solid var(--line);
  border-radius:3px;padding:5px;transition:right .18s}
#mmwrap.wide{right:12px}
#minimap{display:block;image-rendering:pixelated;cursor:crosshair;border:1px solid #2a241d}
#mmcap{font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding-top:3px}
#mmroads{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--dim);
  letter-spacing:.08em;text-transform:uppercase;padding-top:2px;cursor:pointer;user-select:none}
#mmroads input{accent-color:var(--crim);width:11px;height:11px;cursor:pointer}

#toasts{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(30,24,19,.96);border:1px solid var(--line);border-left:3px solid var(--crim);padding:6px 14px;
  border-radius:2px;color:#efe6cd;font-size:12px;max-width:60vw;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:auto;cursor:pointer}
.toast.fade{opacity:0;transition:opacity .8s}

#modal{position:fixed;inset:0;background:rgba(10,8,6,.72);z-index:40;display:flex;align-items:center;justify-content:center}
#modal.hidden,.hidden{display:none!important}
#modalbox{background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:20px 22px;width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:0 12px 50px rgba(0,0,0,.6)}
#modalbox h2{font-family:Cinzel,serif;letter-spacing:.12em;font-size:16px;color:#e8ddbd;margin-bottom:12px}
#modalbox label{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 3px}
#modalbox .row{display:flex;gap:8px;align-items:center}
#modalbox textarea{width:100%;height:130px;font-size:11px}
#modalbox .keys{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12px}
#modalbox .keys .k{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
#modalbox .note{color:var(--dim);font-size:12px;margin-top:8px}

#tl{position:fixed;inset:0;background:rgba(10,8,6,.93);z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#tlCv{border:1px solid var(--line);border-radius:3px;image-rendering:pixelated;max-width:92vw;max-height:80vh}
#tlBar{display:flex;align-items:center;gap:10px;width:min(720px,90vw)}
#tlBar input{flex:1;accent-color:var(--crim)}
#tlY{font-variant-numeric:tabular-nums;color:var(--par);min-width:52px}
#genoverlay{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#genoverlay h1{font-family:Cinzel,serif;font-size:34px;letter-spacing:.3em;color:#e8ddbd;font-weight:700;text-indent:.3em}
#genoverlay .gsub{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#genbar{width:320px;height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#100d0a}
#genbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#6e5a3a,var(--gold))}
#genstage{color:var(--faint);font-size:12px;min-height:18px}

#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:11;color:var(--faint);font-size:11px;
  background:rgba(23,18,16,.75);padding:2px 12px;border-radius:10px;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .toast.fade{transition:none} #side{transition:none} }
@media (max-width:900px){ #side{width:300px} #mmwrap{right:312px} #brand .wn{display:none} #ticker{width:300px} }
</style>

<script>
'use strict';
/* ============================================================= *
 *  CHRONICA — an emergent ASCII civilization simulation
 * ============================================================= */

/* ---------- tiny utils ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(1); // world rng, reseeded per world
const rnd=()=>R();
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const rf=(a,b)=>a+R()*(b-a);
const pick=arr=>arr[Math.floor(R()*arr.length)];
const chance=p=>R()<p;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

/* value-noise + fbm */
function makeNoise(seed){
  const perm=new Uint8Array(512);const p=new Uint8Array(256);
  const rr=mulberry32(seed);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rr()*(i+1));const t=p[i];p[i]=p[j];p[j]=t}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  function g(ix,iy){return perm[(ix&255)+perm[iy&255]]/255}
  function n2(x,y){
    const ix=Math.floor(x),iy=Math.floor(y);
    let fx=x-ix,fy=y-iy;
    fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
    const a=g(ix,iy),b=g(ix+1,iy),c=g(ix,iy+1),d=g(ix+1,iy+1);
    return lerp(lerp(a,b,fx),lerp(c,d,fx),fy);
  }
  return function fbm(x,y,oct,scale){
    let v=0,amp=1,f=1/scale,tot=0;
    for(let o=0;o<oct;o++){v+=n2(x*f,y*f)*amp;tot+=amp;amp*=0.5;f*=2}
    return v/tot;
  };
}

/* binary heap for A* */
function Heap(){this.a=[]}
Heap.prototype.push=function(n){const a=this.a;a.push(n);let i=a.length-1;
  while(i>0){const p=(i-1)>>1;if(a[p].f<=a[i].f)break;const t=a[p];a[p]=a[i];a[i]=t;i=p}};
Heap.prototype.pop=function(){const a=this.a;const top=a[0];const last=a.pop();
  if(a.length){a[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let s=i;
    if(l<a.length&&a[l].f<a[s].f)s=l;if(r<a.length&&a[r].f<a[s].f)s=r;
    if(s===i)break;const t=a[s];a[s]=a[i];a[i]=t;i=s}}
  return top};

/* base64 pack for typed arrays (save/load) */
function b64FromBuf(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;
  for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));
  return btoa(s)}
function bufFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}

/* ---------- constants ---------- */
const DAYS_Y=360, DAYS_S=90;
const SEASONS=['Spring','Summer','Autumn','Winter'];
const DX8=[1,-1,0,0,1,1,-1,-1], DY8=[0,0,1,-1,1,-1,1,-1];

const B={DEEP:0,OCEAN:1,BEACH:2,GRASS:3,SHRUB:4,FOREST:5,TAIGA:6,DESERT:7,TUNDRA:8,SNOW:9,MOUNT:10,PEAK:11,SWAMP:12,LAKE:13};
/* fg colors: [spring,summer,autumn,winter] */
const BIOME_DEF=[];
function bd(id,name,glyphs,fg,bg,cost,mini){BIOME_DEF[id]={name,glyphs,fg,bg,cost,mini}}
bd(B.DEEP ,'Deep Ocean',['≈','≈','~'],['#3b5162','#3b5162','#3b5162','#36495a'],'#10161b',-1,'#152029');

bd(B.TAIGA,'Taiga',     ['↑','↑','Λ'],['#6f7d55','#6f7d55','#6a7857','#8e99a2'],'#12100c',1.7,'#2a3024');
bd(B.DESERT,'Desert',   ['·','~','.'],['#a5915f','#ab9560','#a5915f','#a5915f'],'#1a1510',1.35,'#453b25');
bd(B.TUNDRA,'Tundra',   ['·',',','.'],['#8e937f','#8e937f','#8a8e7a','#b9c0c7'],'#14130f',1.3,'#33342c');
bd(B.SNOW ,'Snowfield', ['·','∙','.'],['#c9d2d8','#c9d2d8','#c9d2d8','#d5dde2'],'#191c1f',1.8,'#3f464c');
bd(B.MOUNT,'Mountains', ['▒','▲','▒'],['#93868d','#93868d','#8f828a','#9aa1ac'],'#171317',3.8,'#4a4048');

bd(B.SWAMP,'Marsh',     ['"','~','τ'],['#5f7a5e','#657f5e','#6d7a52','#647079'],'#11150f',2.6,'#26301f');

const BUILD={NONE:0,HOUSE:1,FARM:2,MARKET:3,TEMPLE:4,KEEP:5,WALL:6};
const BUILD_DEF=[null,
 {g:'⌂',fg:'#c2b6a3',name:'House'},

const RUIN_G=['⌂','□','#','·'];

const RES={NONE:0,BERRY:1,ORE:2,FISHERY:3};
const RES_DEF=[null,{g:'%',fg:'#a05a6e',name:'Berry thickets'},{g:'*',fg:'#b8ad93',name:'Ore veins'},{g:'∾',fg:'#7fa3bd',name:'Rich fishery'}];

const PROF_DEF={
 child:{name:'Child',c:'#b8ad93'},

/* ---------- name generation: a language is grown for every world ----------
   Nothing below draws on fixed name lists. Each world seeds phonologies

const NG_ONSETS=['b','br','c','ch','d','dr','f','fr','g','gh','gl','gr','h','j','k','kh','kr','l','m','n','p','r','s','sh','sk','st','t','th','tr','v','vr','w','y','z','zh'];
const NG_CODAS=['','','b','d','g','k','l','m','n','r','s','t','th','sh','nd','rk','st','rn','lm','ss','x'];
const NG_VOWELS=['a','a','a','e','e','e','i','i','i','o','o','o','u','u','ae','ai','au','ea','ei','ia','io','oa','y'];
function makePhon(rr){
  const take=(pool,n)=>{const a=[...pool];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
    return a.slice(0,n)};
  return {
    on:take(NG_ONSETS,4+Math.floor(rr()*6)),
    co:take(NG_CODAS,4+Math.floor(rr()*5)),
    vo:take(NG_VOWELS,3+Math.floor(rr()*4))
  };
}
function wordFrom(ph,minS,maxS,rr){
  rr=rr||R;
  const n=minS+Math.floor(rr()*(maxS-minS+1));
  let w='';
  for(let s=0;s<n;s++){
    if(!(s>0&&rr()<0.25))w+=ph.on[Math.floor(rr()*ph.on.length)];
    w+=ph.vo[Math.floor(rr()*ph.vo.length)];
    if(s===n-1||rr()<0.16)w+=ph.co[Math.floor(rr()*ph.co.length)];
  }
  return w.charAt(0).toUpperCase()+w.slice(1);
}
let CULTURES=[],NAMER=null;
function makeCultures(seed){
  const rr=mulberry32(seed^0x5EEDFACE);
  NAMER={world:makePhon(rr),beast:makePhon(rr)};
  CULTURES=[];
  const ADJ_SUF=['ic','an','ish','i','ese','ar'];
  const FEM_POOL=['a','ia','is','eth','ei','ara','u','ien','yn'];
  for(let c=0;c<5;c++){
    const ph=makePhon(rr);
    const settSuf=[];
    for(let i=0,n=2+Math.floor(rr()*3);i<n;i++)settSuf.push(wordFrom(ph,1,1,rr).toLowerCase());
    const fem=[];
    for(let i=0,n=2+Math.floor(rr()*3);i<n;i++)fem.push(FEM_POOL[Math.floor(rr()*FEM_POOL.length)]);
    CULTURES.push({id:c,ph,settSuf,fem,adj:wordFrom(ph,1,2,rr)+ADJ_SUF[Math.floor(rr()*ADJ_SUF.length)]});
  }
}

}

<script>
'use strict';
/* ============ WORLD STATE ============ */

const idx=(x,y)=>y*world.W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<world.W&&y<world.H;
const isWater=b=>b===B.DEEP||b===B.OCEAN||b===B.LAKE;
const passCost=i=>{
  const b=world.biome[i];
  const def=BIOME_DEF[b];
  if(def.cost<0)return -1;
  let c=def.cost;
  if(world.river[i])c=world.road[i]>=ROAD_T?0.7:6;   // rivers block unless bridged
  else if(world.road[i]>=ROAD_T)c=0.55;
  return c;
};
const passable=i=>passCost(i)>0;

function curYear(){return Math.floor(sim.day/DAYS_Y)}
function curSeason(){return Math.floor((sim.day%DAYS_Y)/DAYS_S)}
function dateStr(d){const y=Math.floor(d/DAYS_Y),dd=d%DAYS_Y;return 'Y'+y+' '+SEASONS[Math.floor(dd/DAYS_S)]+' '+(dd%DAYS_S+1)}

/* ============ EVENTS / HISTORY ============ */
function logEvent(type,text,x,y,ids,meta){
  // events are data: unique id, optional actor/victim, and causal links
  const ev={id:sim.evSeq++,d:sim.day,type,text,x:(x===undefined?-1:x),y:(y===undefined?-1:y),ids:ids||null};
  if(meta){
    if(meta.actor)ev.actor=meta.actor;
    if(meta.victim)ev.victim=meta.victim;
    if(meta.why)ev.why=meta.why; // the true numeric reasons behind a decision
    if(meta.cause){
      if(typeof meta.cause==='string')ev.causeTxt=meta.cause;
      else if(meta.cause.id!==undefined){
        ev.causeId=meta.cause.id;
        meta.cause.cons=meta.cause.cons||[];
        meta.cause.cons.push(ev.id);
        if(meta.cause.cons.length>8)meta.cause.cons.shift();
      }
    }
  }
  sim.events.push(ev);
  if(sim.evMap)sim.evMap.set(ev.id,ev);
  if(sim.events.length>5200){ // prune oldest minor events
    const keep=[];let dropped=0;
    for(const e of sim.events){
      if(dropped<800&&(e.type==='life'||e.type==='misc')){dropped++;continue}
      keep.push(e);
    }
    sim.events=keep.slice(-4800);
    rebuildEvMap();
  }
  ui.tick(ev);
  return ev;
}
function rebuildEvMap(){sim.evMap=new Map();for(const e of sim.events)sim.evMap.set(e.id,e)}
function getEv(id){return sim.evMap?sim.evMap.get(id):null}

    born:o.born!==undefined?o.born:sim.day, fac:o.fac, home:o.home, prof:o.prof||'laborer',
    x:o.x,y:o.y,rx:o.x,ry:o.y,path:null,pi:0,mission:null,hunger:0,dist:0,

/* ============ WORLD GENERATION ============ */
function generateWorld(seedStr,W,H,onStage){
  const seed=hashStr(seedStr);
  R=mulberry32(seed);
  makeCultures(seed); // grow this world's languages before anything is named
  const nE=makeNoise(seed^0xA1),nM=makeNoise(seed^0xB2),nT=makeNoise(seed^0xC3),nD=makeNoise(seed^0xD4);
  world={seedStr,seed,W,H,name:worldName(),
    elev:new Float32Array(W*H),moist:new Float32Array(W*H),
    biome:new Uint8Array(W*H),river:new Uint8Array(W*H),road:new Uint8Array(W*H),
    building:new Uint8Array(W*H),resource:new Uint8Array(W*H),variant:new Uint8Array(W*H),
    cut:new Uint8Array(W*H),
    settleId:new Int16Array(W*H).fill(-1),terrId:new Int16Array(W*H).fill(-1)};
  onStage&&onStage('raising continents…');
  const cx=W/2,cy=H/2;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;
    // distorted radial mask → one big landmass + islands
    const wx=x+nD(x,y,3,60)*46-23, wy=y+nD(x+999,y,3,60)*46-23;
    const dx=(wx-cx)/(W*0.52),dy=(wy-cy)/(H*0.52);
    const d=Math.sqrt(dx*dx+dy*dy);
    let e=nE(x,y,5,64)*1.25-0.32-Math.pow(d,2.6)*0.95;
    e+=nE(x*3+77,y*3,4,30)*0.16-0.08;
    world.elev[i]=e;
    world.moist[i]=nM(x,y,4,52);
    world.variant[i]=Math.floor(R()*4);
  }
  onStage&&onStage('carving rivers…');
  // rivers: walk downhill from this continent's own highlands, whatever their height
  const sampE=[];
  for(let t=0;t<4000;t++){const si=ri(0,W*H-1);if(world.elev[si]>0.02)sampE.push(world.elev[si])}
  sampE.sort((a,b)=>a-b);
  const srcT=sampE.length?Math.min(0.34,sampE[Math.floor(sampE.length*0.85)]):0.2;
  // gather every qualifying wet-highland source, then let each walker run to the sea;
  // a walker's trail is committed only when it finishes, so it merges with elder rivers, never itself
  const srcs=[];
  for(let i=0;i<W*H;i++)if(world.elev[i]>=srcT&&world.moist[i]>0.40)srcs.push(i);
  shuffle(srcs);
  const nRiv=Math.min(srcs.length,Math.floor(W*H/2600)+6);
  for(let r=0;r<nRiv;r++){
    let px=srcs[r]%W,py=(srcs[r]/W)|0,steps=0;
    const trail=[];
    while(steps++<500){
      const ii=py*W+px;
      if(world.elev[ii]<=0.005)break;   // reached the sea
      if(world.river[ii])break;         // joined an elder river
      trail.push(ii);
      let bx=px,by=py,be=1e9;
      for(let k=0;k<8;k++){
        const qx=px+DX8[k],qy=py+DY8[k];
        if(!inb(qx,qy))continue;
        const qi=qy*W+qx;
        if(trail.length>1&&qi===trail[trail.length-2])continue; // no doubling back
        const ee=world.elev[qi]+rnd()*0.012;
        if(ee<be){be=ee;bx=qx;by=qy}
      }
      if(bx===px&&by===py){world.elev[ii]=-0.01;break} // trapped water pools into a pond
      px=bx;py=by;
    }
    for(const ti of trail)world.river[ti]=1;
  }
  onStage&&onStage('painting the wilds…');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,e=world.elev[i],m=world.moist[i];
    const lat=Math.abs(y-H/2)/(H/2);
    const t=1-lat*1.15-Math.max(0,e)*0.85+nT(x,y,3,40)*0.3-0.05;
    let b;
    if(e<-0.14)b=B.DEEP;
    else if(e<0.005)b=B.OCEAN;
    else if(e<0.03)b=t<0.2?B.TUNDRA:B.BEACH;
    else if(e>0.62)b=t<0.1?B.PEAK:(e>0.74?B.PEAK:B.MOUNT);
    else if(e>0.50)b=B.MOUNT;
    else if(t<0.08)b=B.SNOW;
    else if(t<0.24)b=m>0.5?B.TAIGA:B.TUNDRA;
    else if(t>0.75&&m<0.36)b=B.DESERT;
    else if(m<0.34)b=B.SHRUB;
    else if(m>0.72&&e<0.09)b=B.SWAMP;
    else if(m>0.55)b=B.FOREST;
    else if(m>0.46&&chance(0.35))b=B.FOREST;
    else b=B.GRASS;
    world.biome[i]=b;
    if(isWater(b)||b===B.PEAK)world.river[i]=0;
  }
  // lakes: shallow water not touching ocean (flood fill from map edge ocean)
  const seen=new Uint8Array(W*H);const q=[];
  for(let x=0;x<W;x++){q.push(x,(H-1)*W+x)}
  for(let y=0;y<H;y++){q.push(y*W,y*W+W-1)}
  while(q.length){const i0=q.pop();if(seen[i0])continue;const b0=world.biome[i0];
    if(!isWater(b0))continue;seen[i0]=1;
    const x0=i0%W,y0=(i0/W)|0;
    for(let k=0;k<4;k++){const qx=x0+DX8[k],qy=y0+DY8[k];if(inb(qx,qy)&&!seen[qy*W+qx])q.push(qy*W+qx)}}
  for(let i=0;i<W*H;i++)if(isWater(world.biome[i])&&!seen[i])world.biome[i]=B.LAKE;
  // resources
  onStage&&onStage('seeding resources…');
  for(let i=0;i<W*H;i++){
    const b=world.biome[i];
    if((b===B.GRASS||b===B.SHRUB)&&chance(0.012))world.resource[i]=RES.BERRY;
    else if((b===B.MOUNT||b===B.PEAK)&&chance(0.35))world.resource[i]=RES.ORE;
    else if(b===B.OCEAN&&chance(0.012))world.resource[i]=RES.FISHERY;
  }
  // ore lies where old rock breaks the surface: every world's high country holds veins, geography decides who lives near them
  let oreN=0;for(let i=0;i<W*H;i++)if(world.resource[i]===RES.ORE)oreN++;
  const wantOre=Math.max(16,Math.round(W*H/1400));
  if(oreN<wantOre){
    const cand=[];
    for(let i=0;i<W*H;i++)if(!isWater(world.biome[i])&&world.biome[i]!==B.BEACH&&!world.resource[i])cand.push(i);
    cand.sort((a,b)=>world.elev[b]-world.elev[a]);
    const pool=Math.min(cand.length,1500);
    let guard=0;
    while(oreN<wantOre&&guard++<400){
      const i=cand[Math.floor(Math.pow(rnd(),2)*pool)];
      if(world.resource[i]===RES.ORE)continue;
      world.resource[i]=RES.ORE;oreN++;
      const x=i%W,y=(i/W)|0;
      for(const[dx,dy]of[[1,0],[0,1],[1,1],[-1,0]]){
        if(!chance(0.5))continue;
        if(!inb(x+dx,y+dy))continue;
        const j=idx(x+dx,y+dy);
        if(!isWater(world.biome[j])&&!world.resource[j]){world.resource[j]=RES.ORE;oreN++}
      }
    }
  }
  return world;
}

/* ============ PATHFINDING ============ */
function findPath(sx,sy,tx,ty,maxIter){
  maxIter=maxIter||3000;
  const W=world.W;
  const start=sy*W+sx,goal=ty*W+tx;
  if(start===goal)return [];
  if(!passable(goal))return null;
  const open=new Heap();
  const came=new Map(),gs=new Map();
  gs.set(start,0);
  open.push({i:start,f:0});
  let iter=0;
  while(open.a.length&&iter++<maxIter){
    const cur=open.pop();
    if(cur.i===goal){
      const path=[];let c=goal;
      while(c!==start){path.push(c);c=came.get(c)}
      path.reverse();return path;
    }
    const cx=cur.i%W,cy=(cur.i/W)|0,g0=gs.get(cur.i);
    for(let k=0;k<8;k++){
      const nx=cx+DX8[k],ny=cy+DY8[k];
      if(!inb(nx,ny))continue;
      const ni=ny*W+nx;
      const pc=passCost(ni);
      if(pc<0)continue;
      const g=g0+pc*(k<4?1:1.41);
      if(g<(gs.get(ni)??1e9)){
        gs.set(ni,g);came.set(ni,cur.i);
        const h=Math.max(Math.abs(nx-tx),Math.abs(ny-ty));
        open.push({i:ni,f:g+h});
      }
    }
  }
  return null;
}
/* cheap greedy stroll path for short trips */
function greedyPath(sx,sy,tx,ty,maxLen){
  const path=[];let x=sx,y=sy;
  for(let s=0;s<(maxLen||40);s++){
    if(x===tx&&y===ty)break;
    let bk=-1,bd=1e9;
    for(let k=0;k<8;k++){
      const nx=x+DX8[k],ny=y+DY8[k];
      if(!inb(nx,ny)||!passable(ny*world.W+nx))continue;
      const d=Math.max(Math.abs(nx-tx),Math.abs(ny-ty))+rnd()*0.4;
      if(d<bd){bd=d;bk=k}
    }
    if(bk<0)break;
    x+=DX8[bk];y+=DY8[bk];
    path.push(y*world.W+x);
    if(x===tx&&y===ty)break;
  }
  return path.length?path:null;
}

/* ============ SETTLEMENTS ============ */
function siteScore(x,y){
  const i=idx(x,y);
  const b=world.biome[i];
  if(b!==B.GRASS&&b!==B.SHRUB&&b!==B.FOREST&&b!==B.BEACH)return -1;
  if(world.settleId[i]>=0)return -1;
  let water=0,wood=0,fert=0,mount=0,ore=0;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const qx=x+dx,qy=y+dy;if(!inb(qx,qy))continue;
    const qi=qy*world.W+qx,qb=world.biome[qi];
    if(world.river[qi]||qb===B.LAKE||qb===B.OCEAN)water=1;
    if(qb===B.FOREST||qb===B.TAIGA)wood++;
    if(qb===B.GRASS)fert++;
    if(qb===B.MOUNT)mount++;
  }
  // bright veins in the rock pull settlers a little further out than good soil alone would
  for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){
    const qx=x+dx,qy=y+dy;if(!inb(qx,qy))continue;
    if(world.resource[qy*world.W+qx]===RES.ORE)ore++;
  }
  if(!fert)return -1;
  let s=fert*1.4+Math.min(wood,8)*0.8+water*14+Math.min(mount,3)*1.2+Math.min(ore,3)*6;
  // spacing
  for(const st of sim.settlements){if(st.razed)continue;
    const d=Math.max(Math.abs(st.x-x),Math.abs(st.y-y));
    if(d<14)return -1;
    if(d<26)s-=(26-d)*1.5;
  }
  return s;
}
function foundSettlement(x,y,fac,founderIds,nameOpt,why){
  const f=sim.factions[fac];
  let nm=nameOpt;
  if(!nm){for(let t=0;t<10;t++){nm=settName(f.culture);if(!sim.settlements.some(s=>s.nm===nm))break}}
  const st={id:sim.settlements.length,nm,x,y,fac,founded:sim.day,
    tiles:[],houses:0,farms:0,market:0,temple:0,keep:0,walls:0,rad:5,canals:[],hasCanal:false,
    stock:{wood:90,stone:0},religion:f.relig,famine:0,plague:0,plagueT:0,
    razed:false,log:[],lastCaravan:sim.day,conqDay:-9999,why:why||null};
  sim.settlements.push(st);
  if(typeof initEconSt==='function')initEconSt(st);
  // claim a blob of tiles
  const rad=st.rad;
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    const qx=x+dx,qy=y+dy;
    if(!inb(qx,qy)||dx*dx+dy*dy>rad*rad+2)continue;
    const qi=qy*world.W+qx;
    if(world.settleId[qi]<0&&!isWater(world.biome[qi])&&world.biome[qi]!==B.PEAK){
      world.settleId[qi]=st.id;st.tiles.push(qi);
    }
  }
  buildStruct(st,BUILD.HOUSE);buildStruct(st,BUILD.HOUSE);buildStruct(st,BUILD.HOUSE);
  buildStruct(st,BUILD.FARM);buildStruct(st,BUILD.FARM);buildStruct(st,BUILD.FARM);buildStruct(st,BUILD.FARM);
  if(founderIds)for(const pid of founderIds){const p=sim.people.get(pid);if(p){p.home=st.id;p.x=x;p.y=y;p.rx=x;p.ry=y}}
  terrainDirty=true;minimapDirty=true;
  return st;
}
function buildStruct(st,type){
  // pick a free claimed tile near center, spiral out
  const cands=[];
  const W=world.W;
  const near=(i,test)=>{ // count matching neighbours
    const x=i%W,y=(i/W)|0;let n=0;
    for(let k=0;k<8;k++){const qx=x+DX8[k],qy=y+DY8[k];
      if(inb(qx,qy)&&test(qy*W+qx))n++}
    return n;
  };
  for(const i of st.tiles){
    if(world.building[i]||world.river[i])continue;
    const x=i%W,y=(i/W)|0;
    const b=world.biome[i];
    if(isWater(b)||b===B.MOUNT||b===B.PEAK)continue;
    const dist=Math.max(Math.abs(x-st.x),Math.abs(y-st.y));
    let d;
    if(type===BUILD.FARM){
      if(b!==B.GRASS&&b!==B.SHRUB)continue;
      // fields belt the outskirts and clump into contiguous farmland
      d=(st.rad-dist)*1.2-near(i,q=>world.building[q]===BUILD.FARM)*1.6;
    }else if(type===BUILD.HOUSE){
      // houses hug the center, then sprawl along roads and existing houses
      d=dist-(near(i,q=>world.road[q]>=ROAD_T)?2.5:0)-near(i,q=>world.building[q]===BUILD.HOUSE)*0.5;
    }else if(type===BUILD.WALL){
      d=-dist;
    }else{
      d=dist;
    }
    cands.push({i,d});
  }
  if(!cands.length)return false;
  cands.sort((a,b)=>a.d-b.d);
  const i=cands[0].i;
  world.building[i]=type;
  const bb=world.biome[i]; // raising a structure clears the trees on its tile
  if(bb===B.FOREST){world.biome[i]=B.GRASS;world.cut[i]=1}
  else if(bb===B.TAIGA){world.biome[i]=B.TUNDRA;world.cut[i]=1}
  if(type===BUILD.HOUSE)st.houses++;else if(type===BUILD.FARM)st.farms++;
  else if(type===BUILD.MARKET)st.market++;else if(type===BUILD.TEMPLE)st.temple++;
  else if(type===BUILD.KEEP)st.keep++;else if(type===BUILD.WALL)st.walls++;
  terrainDirty=true;
  return true;
}
function expandSettlement(st){
  // towns physically outgrow their founding ring as people arrive
  const targetRad=clamp(5+Math.floor((st.popC||0)/22),5,12);
  if(targetRad<=(st.rad||5))return;
  st.rad=(st.rad||5)+1;
  const r=st.rad,W=world.W;
  let claimed=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const qx=st.x+dx,qy=st.y+dy;
    if(!inb(qx,qy)||dx*dx+dy*dy>r*r+2)continue;
    const qi=qy*W+qx;
    if(world.settleId[qi]>=0)continue;
    const b=world.biome[qi];
    if(isWater(b)||b===B.PEAK)continue;
    let touch=false; // growth stays connected to the town body
    for(let k=0;k<8;k++){const tx=qx+DX8[k],ty=qy+DY8[k];
      if(inb(tx,ty)&&world.settleId[ty*W+tx]===st.id){touch=true;break}}
    if(!touch)continue;
    world.settleId[qi]=st.id;st.tiles.push(qi);claimed++;
  }
  if(claimed)terrainDirty=true;
}
function settPop(st){let n=0;for(const p of sim.people.values())if(p.home===st.id&&!p.inArmy)n++;return n}
function settPopAll(st){let n=0;for(const p of sim.people.values())if(p.home===st.id)n++;return n}
function settSize(st){const n=st.popC||0;return n>=110?'City':n>=60?'Town':n>=25?'Village':'Hamlet'}

/* ============ FACTIONS ============ */
function newFaction(culture,nameOpt){
  const f={id:sim.factions.length,nm:nameOpt||facCoreName(culture),color:FAC_COLORS[sim.factions.length%FAC_COLORS.length],
    culture,capital:-1,leader:0,relig:-1,rel:{},wars:{},dead:false,dyn:''};
  sim.factions.push(f);
  if(typeof initEconFac==='function')initEconFac(f);
  return f;
}
function facTitle(f){
  const n=sim.settlements.filter(s=>s.fac===f.id&&!s.razed).length;
  if(n<=1)return 'Clan of '+f.nm;
  if(n===2)return 'Chiefdom of '+f.nm;
  if(n<=4)return 'Kingdom of '+f.nm;
  return 'Empire of '+f.nm;
}
function leaderTitle(f){
  const n=sim.settlements.filter(s=>s.fac===f.id&&!s.razed).length;
  return n<=1?'Chief':n===2?'High Chief':n<=4?'King':'Emperor';
}
function facPop(f){let n=0;for(const p of sim.people.values())if(p.fac===f.id)n++;return n}
function relKey(a,b){return a<b?a+'_'+b:b+'_'+a}
function getRel(a,b){return sim.relations[relKey(a,b)]??0}
function setRel(a,b,v){sim.relations[relKey(a,b)]=clamp(v,-100,100)}

/* ============ INITIAL POPULATION ============ */
function seedCivilizations(nFac){
  // find good sites
  const sites=[];
  for(let t=0;t<9000&&sites.length<nFac*6;t++){
    const x=ri(6,world.W-7),y=ri(6,world.H-7);
    const s=siteScore(x,y);
    if(s>16)sites.push({x,y,s});
  }
  sites.sort((a,b)=>b.s-a.s);
  const used=[];
  let made=0;
  for(const site of sites){
    if(made>=nFac)break;
    let ok=true;
    const minD=made<3?30:22;
    for(const u of used){if(Math.max(Math.abs(u.x-site.x),Math.abs(u.y-site.y))<minD)ok=false}
    if(!ok)continue;
    used.push(site);
    const cul=made%CULTURES.length;
    const f=newFaction(cul);
    const st=foundSettlement(site.x,site.y,f.id,null,undefined,'raised at the dawn of the age by the first '+CULTURES[cul].adj+' people');
    f.capital=st.id;
    // founding families
    const n=ri(12,16);
    const men=[],women=[];
    for(let i=0;i<n;i++){
      const sex=i<n/2?'m':'f';
      const age=ri(16,40)*DAYS_Y+ri(0,359);
      const p=newPerson({cul,sex,born:sim.day-age,fac:f.id,home:st.id,x:site.x,y:site.y,prof:'laborer'});
      (sex==='m'?men:women).push(p);
    }
    // marry some founders
    for(let i=0;i<Math.min(men.length,women.length)-1;i++){
      if(chance(0.7)){men[i].spouse=women[i].id;women[i].spouse=men[i].id;women[i].sur=men[i].sur}
    }
    // a few children
    for(let i=0;i<ri(3,5);i++){
      const mo=pick(women),fa=sim.people.get(mo.spouse)||pick(men);
      const kid=newPerson({cul,born:sim.day-ri(1,14)*DAYS_Y,fac:f.id,home:st.id,x:site.x,y:site.y,prof:'child',fa:fa.id,mo:mo.id,sur:fa.sur});
      fa.kids.push(kid.id);mo.kids.push(kid.id);
    }
    // leader: highest charisma founder
    let lead=men[0]||women[0];
    for(const p of men.concat(women))if(p.cha>lead.cha)lead=p;
    f.leader=lead.id;lead.prof='leader';lead.notable=true;f.dyn=lead.sur;
    bio(lead,'Became first '+leaderTitle(f)+' of the '+facTitle(f));
    logEvent('found','The '+facTitle(f)+' is founded at '+st.nm+' under '+leaderTitle(f)+' '+fullName(lead)+'.',site.x,site.y,{fac:f.id,sett:st.id,p:lead.id});
    made++;
  }
  // initial relations
  for(let a=0;a<sim.factions.length;a++)for(let b=a+1;b<sim.factions.length;b++){
    const fa=sim.factions[a],fb=sim.factions[b];
    const sa=sim.settlements[fa.capital],sb=sim.settlements[fb.capital];
    const d=Math.max(Math.abs(sa.x-sb.x),Math.abs(sa.y-sb.y));
    setRel(a,b,clamp(-30+d*0.35+ri(-15,15),-60,20));
  }
  assignProfessions();
}
function seedAnimals(){
  sim.animals=[];
  for(let s=0;s<SPECIES.length;s++){
    const sp=SPECIES[s];
    const n=Math.floor(sp.cap*0.7);
    let tries=0;
    for(let i=0;i<n&&tries<4000;){
      tries++;
      const x=ri(1,world.W-2),y=ri(1,world.H-2);
      const b=world.biome[idx(x,y)];
      const ok=sp.river?world.river[idx(x,y)]===1:sp.biomes.includes(b);
      if(ok){
        const a={id:sim.nextId++,sp:s,x,y,rx:x,ry:y,age:ri(0,1200),path:null,pi:0,hp:1};
        if(sp.g0)a.genes=mutateGenes(sp.g0); // species temperament as heritable priors
        sim.animals.push(a);
        i++;
      }
    }
  }
}

/* territory recompute (BFS from settlements, limited radius) */
function recomputeTerritory(){
  world.terrId.fill(-1);
  const q=[];
  for(const st of sim.settlements){
    if(st.razed)continue;
    const rad=st.popC>=60?14:st.popC>=25?11:8;
    st._rad=rad;
    q.push({x:st.x,y:st.y,d:0,st:st.id,rad});
    world.terrId[idx(st.x,st.y)]=st.id;
  }
  let head=0;
  while(head<q.length){
    const c=q[head++];
    if(c.d>=c.rad)continue;
    for(let k=0;k<4;k++){
      const nx=c.x+DX8[k],ny=c.y+DY8[k];
      if(!inb(nx,ny))continue;
      const i=ny*world.W+nx;
      if(world.terrId[i]>=0)continue;
      const b=world.biome[i];
      if(b===B.DEEP||b===B.OCEAN||b===B.PEAK)continue;
      world.terrId[i]=c.st;
      q.push({x:nx,y:ny,d:c.d+1,st:c.st,rad:c.rad});
    }
  }
  minimapDirty=true;terrainDirty=true;
}

/* ============ NEW SIM ============ */
function newSim(){
  sim={day:0,nextId:1,people:new Map(),souls:new Map(),animals:[],armies:[],caravans:[],migrants:[],
    settlements:[],factions:[],religions:[],relations:{},events:[],evSeq:1,evMap:new Map(),fires:{},
    ships:[],relics:[],eras:[],books:[],snaps:[],beast:null,corpses:[],mon:{},currencies:[],
    weather:{type:'clear',t:0},drought:false,
    stats:{yr:[],pop:[],wild:[],setts:[],fac:{}},
    pathQueue:[]};
}

/* ============================================================
   WORM MIND — a real nervous system for every beast.
   The complete C. elegans hermaphrodite connectome
   (Cook et al. 2019, via the OpenWorm project): 300 neurons,
   ~5,800 chemical + electrical connections, run as a spiking

const WORM={ready:false,n:0};
function wormInit(){
  if(WORM.ready)return;
  const names=WORM_NAMES,n=names.length;
  const buf=new Uint8Array(bufFromB64(WORM_EDGES_B64));
  const m=buf.length/5;

  for(let i=0;i<m;i++){
    preA[i]=buf[i*5]|(buf[i*5+1]<<8);
    postA[i]=buf[i*5+2]|(buf[i*5+3]<<8);

  const gaba=new Uint8Array(n);for(const g of WORM_GABA)gaba[g]=1;

  const order=[...Array(m).keys()].sort((a,b)=>preA[a]-preA[b]);

  const outStart=new Int32Array(n+1);
  for(let k=0;k<m;k++){
    const e=order[k];

    const sign=(!gapA[e]&&gaba[preA[e]])?-1:1; // GABA inhibits
    w[k]=sign*Math.sqrt(wA[e])*scale;          // sqrt: many-synapse pairs saturate
  }
  for(let k=0;k<m;k++)outStart[pre[k]+1]++;
  for(let i=0;i<n;i++)outStart[i+1]+=outStart[i];

  const pb=new Uint8Array(bufFromB64(WORM_POS_B64));

  for(let i=0;i<n;i++){ax[i]=(pb[i*4]|(pb[i*4+1]<<8))/1000;ay[i]=(pb[i*4+2]|(pb[i*4+3]<<8))/1000}
  const grp=re=>{const a=[];for(let i=0;i<n;i++)if(re.test(names[i]))a.push(i);return a};
  WORM.n=n;WORM.names=names;WORM.post=post;WORM.w=w;WORM.outStart=outStart;

    food:grp(/^(AWA|AWC|ASE)/),        // chemosensation: food
    hunger:grp(/^(ASI|ASK)/),          // internal state drive
    fwd:grp(/^(AVB|PVC)/),             // forward command interneurons
    rev:grp(/^(AVA|AVD|AVE)/),         // backward/escape command interneurons
    fwdM:grp(/^(VB|DB)\d/),            // forward motor classes

  if(tot>4){const gi=(tot-4)*W_GINH;for(let i=0;i<n;i++)v[i]-=gi}
  for(const i of WORM.g.fwd)nf+=spk[i];
  for(const i of WORM.g.rev)nr+=spk[i];
  for(const i of WORM.g.turn)nt+=spk[i];
  for(const i of WORM.g.fwdM)nfm+=spk[i];
  for(const i of WORM.g.revM)nrm+=spk[i];
  // leak + floor
  for(let i=0;i<n;i++){v[i]*=W_DECAY;if(v[i]<W_VMIN)v[i]=W_VMIN}
  // rate estimates (exponential average of command + motor pools)
  br.fwd=br.fwd*0.8+(nf/WORM.g.fwd.length+nfm/WORM.g.fwdM.length)*0.5*0.2;
  br.rev=br.rev*0.8+(nr/WORM.g.rev.length+nrm/WORM.g.revM.length)*0.5*0.2;
  br.turn=br.turn*0.8+(nt/WORM.g.turn.length)*0.2;
  // affect, read off the network: arousal = overall firing, fear = threat drive + escape dominance
  br.aro=br.aro*0.88+(tot/n)*0.12;
  br.fear=br.fear*0.88+Math.min(1,inp.threat*0.8+(br.rev>br.fwd?br.rev*0.6:0))*0.12;
  br.age++;
}
/* drive an animal one decision from its neural state; returns {dx,dy,moved} */
function wormLocomotion(a,br,threatDx,threatDy,foodDx,foodDy){
  const escape=(threatDx||threatDy)&&br.rev>br.fwd*1.02&&br.rev>0.08;
  let dx=0,dy=0,mode;
  if(escape){
    dx=-Math.sign(threatDx);dy=-Math.sign(threatDy);mode='escape'; // reversal: flee the stimulus
  }else if(br.fwd>0.025&&(foodDx||foodDy)&&chance(0.8)){
    dx=Math.sign(foodDx);dy=Math.sign(foodDy);mode='seek';         // forward drive toward food
  }else if(br.fwd+br.rev>0.015){
    const k=ri(0,7);dx=DX8[k];dy=DY8[k];mode='roam';               // roaming set by arousal
  }else return null;                                               // quiescent
  if(mode!=='escape'&&br.turn>0.05&&chance(0.5)){const k=ri(0,7);dx=DX8[k];dy=DY8[k]} // pirouette
  return {dx,dy,burst:escape?2:1,mode};
}

<script>
'use strict';
/* ============ THE SEA ============ */
const seaPassable=i=>{const b=world.biome[i];return b===B.OCEAN||b===B.DEEP};
function coastWaterNear(x,y,r){
  r=r||8;
  for(let d=1;d<=r;d++)for(let dy=-d;dy<=d;dy++)for(let dx=-d;dx<=d;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==d)continue;
    const qx=x+dx,qy=y+dy;
    if(inb(qx,qy)&&seaPassable(idx(qx,qy)))return{x:qx,y:qy};
  }
  return null;
}
function landNearWater(x,y){
  for(let k=0;k<8;k++){const qx=x+DX8[k],qy=y+DY8[k];
    if(inb(qx,qy)&&passable(idx(qx,qy)))return{x:qx,y:qy}}
  return null;
}
function findSeaPath(sx,sy,tx,ty,maxIter){
  maxIter=maxIter||6000;
  const W=world.W,start=sy*W+sx,goal=ty*W+tx;
  if(start===goal)return[];
  if(!seaPassable(goal))return null;
  const open=new Heap(),came=new Map(),gs=new Map();
  gs.set(start,0);open.push({i:start,f:0});
  let iter=0;
  while(open.a.length&&iter++<maxIter){
    const cur=open.pop();
    if(cur.i===goal){const path=[];let c=goal;
      while(c!==start){path.push(c);c=came.get(c)}
      path.reverse();return path}
    const cx=cur.i%W,cy=(cur.i/W)|0,g0=gs.get(cur.i);
    for(let k=0;k<8;k++){
      const nx=cx+DX8[k],ny=cy+DY8[k];
      if(!inb(nx,ny))continue;
      const ni=ny*W+nx;
      if(!seaPassable(ni))continue;
      const g=g0+(k<4?1:1.41);
      if(g<(gs.get(ni)??1e9)){gs.set(ni,g);came.set(ni,cur.i);
        open.push({i:ni,f:g+Math.max(Math.abs(nx-tx),Math.abs(ny-ty))})}
    }
  }
  return null;
}
function settHarbor(st){
  if(st._harborD===sim.day)return st._harbor;
  st._harborD=sim.day;st._harbor=false;
  for(const i of st.tiles){
    const x=i%world.W,y=(i/world.W)|0;
    for(let k=0;k<4;k++){const qx=x+DX8[k],qy=y+DY8[k];
      if(inb(qx,qy)&&world.biome[idx(qx,qy)]===B.OCEAN){st._harbor=true;return true}}
  }
  return false;
}
function newShip(o){const s=Object.assign({id:sim.nextId++,rx:o.x,ry:o.y,pi:0,dead:false,age:0},o);sim.ships.push(s);return s}
function updateShips(){
  for(const s of sim.ships){
    if(s.dead)continue;
    s.age++;
    const home=sim.settlements[s.from];
    if(s.kind==='fisher'){
      if(!home||home.razed||!home.popC){s.dead=true;continue}
      // drift the nearby sea, feed the town
      if(chance(0.6)){const k=ri(0,7),nx=s.x+DX8[k],ny=s.y+DY8[k];
        if(inb(nx,ny)&&seaPassable(idx(nx,ny))&&Math.abs(nx-home.x)<10&&Math.abs(ny-home.y)<10){s.x=nx;s.y=ny}}
      if(home.inv)home.inv[GX.fish]+=1.5;
      continue;
    }
    if(!s.path||s.pi>=s.path.length){shipArrive(s);continue}
    for(let m=0;m<2;m++){
      if(!s.path||s.pi>=s.path.length)break;
      const i=s.path[s.pi++];
      s.x=i%world.W;s.y=(i/world.W)|0;
    }
  }
  sim.ships=sim.ships.filter(s=>!s.dead);
}
function shipArrive(s){
  s.dead=true;
  if(s.kind==='trade'){
    const dest=sim.settlements[s.to],src=sim.settlements[s.from];
    if(dest&&!dest.razed){
      econArrive(s,dest,src);
      if(src&&!src.razed&&typeof hearNews==='function'){hearNews(dest,src);hearNews(src,dest)}
      if(src&&dest.fac!==src.fac)setRel(dest.fac,src.fac,getRel(dest.fac,src.fac)+2);
      if(s.relig>=0&&dest.religion<0&&chance(0.3)){dest.religion=s.relig;
        logEvent('faith',sim.religions[s.relig].nm+' arrives by sea at '+dest.nm+'.',dest.x,dest.y,{sett:dest.id})}
      if(s.plague&&!dest.plague&&chance(0.35))startPlague(dest,'brought ashore by a trade ship from '+(src?src.nm:'over the sea'));
    }
    if(src)launchTradeFlagClear(src.id);
  }else if(s.kind==='settle'){
    const land=landNearWater(s.x,s.y);
    if(land&&siteScore(s.dx,s.dy)>0){
      const st=foundSettlement(s.dx,s.dy,s.fac,s.members,undefined,s.why);
      logEvent('found','Settlers cross the sea to found '+st.nm+' for the '+facTitle(sim.factions[s.fac])+'.',st.x,st.y,{sett:st.id,fac:s.fac});
      toast('⛵ '+st.nm+' founded across the sea.',st.x,st.y);
      const homeS=sim.settlements[s.from];
      if(homeS&&typeof hearNews==='function'){hearNews(st,homeS);hearNews(homeS,st)}
    }else{
      const homeSt=sim.settlements.find(x=>x.fac===s.fac&&!x.razed);
      if(homeSt)for(const pid of s.members){const p=sim.people.get(pid);if(p){p.home=homeSt.id;p.x=homeSt.x;p.y=homeSt.y}}
    }
  }else if(s.kind==='war'){
    const land=landNearWater(s.x,s.y);
    const t=sim.settlements[s.target];
    if(land&&t&&!t.razed&&areAtWar(s.fac,t.fac)){
      sim.armies.push({id:sim.nextId++,fac:s.fac,x:land.x,y:land.y,rx:land.x,ry:land.y,members:s.members,
        str:s.members.length,target:s.target,home:s.from,path:null,pi:0,state:'march',gen:s.gen,fought:false,siegeT:0});
      logEvent('war','The host of the '+facTitle(sim.factions[s.fac])+' lands on the shores near '+t.nm+'.',land.x,land.y,{fac:s.fac});
    }else{
      for(const pid of s.members){const p=sim.people.get(pid);if(p){p.inArmy=0}}
    }
  }
}
function monthlySea(){
  for(const st of sim.settlements){
    if(st.razed||!st.popC||!settHarbor(st))continue;
    // fishing boats
    const nF=sim.ships.filter(s=>!s.dead&&s.kind==='fisher'&&s.from===st.id).length;
    if(nF<Math.min(2,Math.ceil(st.popC/25))){
      const w=coastWaterNear(st.x,st.y,8);
      if(w)newShip({kind:'fisher',fac:st.fac,from:st.id,x:w.x,y:w.y});
    }
    // trade ships now sail only when an arbitrage profit clears the voyage (tradeMonthly in the economy module)
  }
}
function trySeaMigration(st){
  if(!settHarbor(st))return;
  const a=coastWaterNear(st.x,st.y,8);
  if(!a)return;
  // seek a coastal site anywhere, islands very much included
  let best=null,bs=10,bw=null;
  for(let t=0;t<50;t++){
    const x=ri(4,world.W-5),y=ri(4,world.H-5);
    const sc=siteScore(x,y);
    if(sc<=bs)continue;
    const w=coastWaterNear(x,y,5);
    if(!w)continue;
    best={x,y};bs=sc;bw=w;
  }
  if(!best)return;
  const path=findSeaPath(a.x,a.y,bw.x,bw.y,8000);
  if(!path)return;
  const members=[];
  const fams=[];
  for(const p of sim.people.values()){
    if(p.home!==st.id||p.inArmy)continue;
    const age=(sim.day-p.born)/DAYS_Y;
    if(age>=16&&age<50&&p.prof!=='leader')fams.push(p);
  }
  shuffle(fams);
  for(const p of fams){if(members.length>=10)break;members.push(p.id)}
  if(members.length<6)return;
  for(const pid of members){const p=sim.people.get(pid);if(p){p.home=-1;p.path=null;p.mission=null;p.x=a.x;p.y=a.y}}
  newShip({kind:'settle',fac:st.fac,from:st.id,x:a.x,y:a.y,path,members,dx:best.x,dy:best.y,
    why:'founded from across the sea by settlers of '+st.nm+(st.famine>50?', driven out by famine':', seeking room to grow')});
  logEvent('misc','A settler ship sails from '+st.nm+' in search of new shores.',st.x,st.y,{sett:st.id});
}
function armyToSea(a,tx,ty){
  const t=sim.settlements[a.target];
  if(!t)return false;
  const w1=coastWaterNear(a.x,a.y,6),w2=coastWaterNear(t.x,t.y,6);
  if(!w1||!w2)return false;
  const path=findSeaPath(w1.x,w1.y,w2.x,w2.y,8000);
  if(!path)return false;
  newShip({kind:'war',fac:a.fac,from:a.home,x:w1.x,y:w1.y,path,members:a.members,target:a.target,gen:a.gen});
  logEvent('war','The host of the '+facTitle(sim.factions[a.fac])+' takes to the sea.',a.x,a.y,{fac:a.fac});
  a.members=[];a.dead=true;
  return true;
}

/* ============ THE GREAT BEAST ============ */
const BEAST_EPI=['the Devourer','the Night Terror','the Unkillable','Old Hunger','the Shadow','the Hollow-Eyed'];
function beastName(a){
  const base=wordFrom(NAMER.beast,2,2);
  if(chance(0.5))return base+' '+pick(BEAST_EPI);
  return base+' of the '+BIOME_DEF[world.biome[idx(a.x,a.y)]].name;
}
function spawnGreatBeast(){
  if(sim.beast&&sim.animals.some(a=>a.id===sim.beast.id))return;
  let x,y;
  for(let t=0;t<300;t++){
    x=ri(4,world.W-5);y=ri(4,world.H-5);
    const b=world.biome[idx(x,y)];
    if((b===B.FOREST||b===B.TAIGA||b===B.MOUNT)&&world.terrId[idx(x,y)]<0)break;
  }
  const a={id:sim.nextId++,sp:7,x,y,rx:x,ry:y,age:0,path:null,pi:0,hp:14};
  sim.animals.push(a);
  sim.beast={id:a.id,nm:beastName(a),born:sim.day,kills:0};
  sim.beast.evId=logEvent('calamity','A great beast stirs: '+sim.beast.nm+' now stalks the wilds of '+world.name+'.',x,y).id;
  toast('Ω '+sim.beast.nm+' has awoken.',x,y);
}
function updateBeast(a){
  if(!sim.beast)sim.beast={id:a.id,nm:'the Nameless Terror',born:sim.day,kills:0};
  // a weakened world is beneath its notice: it roams the deep wilds
  if(sim.people.size<120){
    if(chance(0.4)){const k=ri(0,7),nx=a.x+DX8[k],ny=a.y+DY8[k];
      if(inb(nx,ny)&&passable(idx(nx,ny))&&world.terrId[idx(nx,ny)]<0){a.x=nx;a.y=ny}}
    return;
  }
  // drifts toward the nearest settlement, kills what it finds
  let tgt=null,bd=1e9;
  for(const st of sim.settlements){if(st.razed||!st.popC)continue;
    const d=Math.max(Math.abs(st.x-a.x),Math.abs(st.y-a.y));
    if(d<bd){bd=d;tgt=st}}
  if(tgt&&chance(0.5)){
    const nx=a.x+Math.sign(tgt.x-a.x),ny=a.y+Math.sign(tgt.y-a.y);
    if(inb(nx,ny)&&passable(idx(nx,ny))){a.x=nx;a.y=ny}
  }else if(chance(0.4)){
    const k=ri(0,7),nx=a.x+DX8[k],ny=a.y+DY8[k];
    if(inb(nx,ny)&&passable(idx(nx,ny))){a.x=nx;a.y=ny}
  }
  if(tgt&&bd<=4&&chance(0.008)){
    const v=randomResident(tgt);
    if(v){killPerson(v,'was taken in the night by '+sim.beast.nm);
      sim.beast.kills++;
      if(sim.beast.kills%4===1)logEvent('calamity',sim.beast.nm+' preys upon '+tgt.nm+' — '+sim.beast.kills+' souls taken.',tgt.x,tgt.y,{sett:tgt.id},{cause:getEv(sim.beast.evId)})}
    // glutted, it always melts back into the wilds
    for(let t=0;t<20;t++){
      const wx=clamp(a.x+ri(-30,30),2,world.W-3),wy=clamp(a.y+ri(-30,30),2,world.H-3);
      if(passable(idx(wx,wy))&&world.terrId[idx(wx,wy)]<0){a.x=wx;a.y=wy;break}
    }
  }
  // it eats the wildlife too
  if(chance(0.1)){const prey=nearestPreyAnimal(a.x,a.y,3);if(prey)removeAnimal(prey)}
}
function fightBeast(p,a){
  if(!sim.beast)sim.beast={id:a.id,nm:'the Nameless Terror',born:sim.day,kills:0};
  // a renowned or brave hunter may wound it; most die trying
  if(rnd()<0.10+p.brav*0.25+Math.min(0.25,p.dist*0.02)){
    a.hp--;
    addDist(p,2,'Wounded '+sim.beast.nm+' in battle');
    if(a.hp<=0){
      removeAnimal(a);
      addDist(p,10,'Slew '+sim.beast.nm);
      createRelic('skull','Skull of '+sim.beast.nm.split(' ')[0],p.id);
      logEvent('life',fullName(p)+' has slain '+sim.beast.nm+'! The world breathes again.',a.x,a.y,{p:p.id},{actor:p.id,cause:getEv(sim.beast.evId)});
      toast('⚔ '+fullName(p)+' slew '+sim.beast.nm+'!',a.x,a.y);
      sim.beast.slain=sim.day;sim.beast.slayer=p.id;
    }
    return true;
  }
  return false;
}

/* ============ RELICS ============ */
const RELIC_T={sword:'⚔',crown:'♕',idol:'☨',skull:'Ω'};
function createRelic(type,nmOpt,holderPid){
  let nm=nmOpt;
  if(!nm){ // named in the language of the culture that made it
    const p0=getP(holderPid);
    const cul=p0&&sim.factions[p0.fac]?sim.factions[p0.fac].culture:0;
    nm=wordFrom(CULTURES[cul].ph,2,2);
  }
  const r={id:sim.relics.length,type,nm,holder:holderPid,log:[]};
  sim.relics.push(r);
  const p=getP(holderPid);
  r.log.push({d:sim.day,t:(type==='skull'?'Taken as a trophy by ':'Made for ')+(p?p.nm+' '+p.sur:'an unknown hand')});
  if(p&&!p.dead){const lp=sim.people.get(holderPid);if(lp){(lp.relics=lp.relics||[]).push(r.id);lp.notable=true}}
  return r;
}
function passRelics(p){
  if(!p.relics||!p.relics.length)return;
  for(const rid of p.relics){
    const r=sim.relics[rid];if(!r)continue;
    // pass to a living child, else spouse, else it rests in the home town
    let heir=null;
    for(const kid of p.kids){const k=sim.people.get(kid);if(k&&!k.dead){heir=k;break}}
    if(!heir&&p.spouse){const s2=sim.people.get(p.spouse);if(s2&&!s2.dead)heir=s2}
    if(heir){
      r.holder=heir.id;(heir.relics=heir.relics||[]).push(rid);heir.notable=true;
      r.log.push({d:sim.day,t:'Passed to '+heir.nm+' '+heir.sur+' on the death of '+p.nm});
    }else{
      const st=sim.settlements[p.home];
      r.holder=-1;r.sett=p.home;
      r.log.push({d:sim.day,t:'Laid to rest in '+(st?st.nm:'a forgotten place')});
    }
  }
  p.relics=[];
}
function lootRelics(st,winnerFac){
  for(const r of sim.relics){
    let held=null;
    if(r.holder>=0){const h=sim.people.get(r.holder);if(h&&h.home===st.id)held=h}
    if(r.sett===st.id||held){
      const f=sim.factions[winnerFac];
      const lead=sim.people.get(f.leader);
      if(held){const ix=held.relics?held.relics.indexOf(r.id):-1;if(ix>=0)held.relics.splice(ix,1)}
      if(lead){r.holder=lead.id;r.sett=undefined;(lead.relics=lead.relics||[]).push(r.id);
        r.log.push({d:sim.day,t:'Looted in the fall of '+st.nm+', claimed by '+lead.nm+' '+lead.sur})}
      else{r.sett=undefined;r.holder=-2;r.log.push({d:sim.day,t:'Lost in the sack of '+st.nm})}
    }
  }
}

/* ============ ERAS ============ */
function classifyYears(fromD,toD){
  let war=0,cal=0,found=0,tech2=0,total=0;
  for(const e of sim.events){
    if(e.d<fromD||e.d>toD)continue;total++;
    if(e.type==='war'||e.type==='battle')war++;
    else if(e.type==='calamity')cal++;
    else if(e.type==='found')found++;
    else if(e.type==='tech')tech2++;
  }
  if(war>=6&&war>=cal)return 'war';
  if(cal>=8&&cal>war)return 'dark';
  if(found>=4)return 'growth';
  if(tech2>=3)return 'wonder';
  return 'peace';
}
const ERA_NAMES={
  war:['Years of Blood','The Age of Spears','The Burning March','The Long War'],
  dark:['The Burning Years','The Hungry Years','The Age of Ash','The Dying Time'],
  growth:['The Age of Founding','The Great Spreading','The Wandering Years'],
  wonder:['The Age of Wonders','The Bright Years','The Age of Craft'],
  peace:['The Long Peace','The Quiet Years','The Green Age','The Still Age']};
function updateEras(){
  const y=curYear();
  if(!sim.eras.length){sim.eras.push({from:0,type:null,nm:null});return}
  const cur=sim.eras[sim.eras.length-1];
  if(y-cur.from<10)return;
  const cls=classifyYears((y-10)*DAYS_Y,sim.day);
  if(cur.type===null){cur.type=cls;cur.nm=pick(ERA_NAMES[cls]);return}
  if(cls!==cur.type){
    cur.to=y;
    const next={from:y,type:cls,nm:pick(ERA_NAMES[cls])};
    // avoid repeating the exact name
    while(next.nm===cur.nm)next.nm=pick(ERA_NAMES[cls]);
    sim.eras.push(next);
    logEvent('misc','Thus ended '+cur.nm+' (Y'+cur.from+'–Y'+y+'); the chroniclers name these days '+next.nm+'.');
    { // the close of an era is what makes a scribe reach for the pen, in every mode
      const lit=sim.factions.find(f=>!f.dead&&facKnows(f,'writing'));
      if(lit)makeBook(lit,cur.nm);
    }
  }
}

/* ============ BOOKS ============ */
function makeBook(f,eraNm){
  const y=curYear();
  const evs=sim.events.filter(e=>e.d>sim.day-DAYS_Y*30&&e.type!=='life'&&e.type!=='misc'&&(!e.ids||e.ids.fac===undefined||e.ids.fac===f.id||areAtWar!==undefined)).slice(-40);
  shuffle(evs);
  const chosen=evs.slice(0,ri(5,7)).sort((a,b)=>a.d-b.d);
  if(chosen.length<3)return;
  const era=sim.eras.length?sim.eras[sim.eras.length-1]:null;
  const lead=sim.people.get(f.leader);
  const title=pick(['The Chronicle of ','The Saga of ','The Annals of ','The Book of '])+
    (eraNm||pick([f.nm,(lead?('the Reign of '+lead.nm):f.nm),(era&&era.nm?era.nm:f.nm)]));
  let text='Set down by the scribes of the '+facTitle(f)+' in the year '+y+'.\n\n';
  for(const e of chosen)text+='In the year '+Math.floor(e.d/DAYS_Y)+', '+e.text.charAt(0).toLowerCase()+e.text.slice(1)+'\n';
  text+='\nMay those who come after remember.';
  sim.books.push({id:sim.books.length,title,fac:f.id,d:sim.day,text});
  if(sim.books.length>40)sim.books.shift();
  logEvent('tech','The scribes of the '+facTitle(f)+' complete "'+title+'".',-1,-1,{fac:f.id});
}

/* ============ TIMELAPSE ============ */
function snapTerritory(){
  const W=world.W,H=world.H,hw=W>>1,hh=H>>1;
  const raw=new Uint8Array(hw*hh);
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){
    const t=world.terrId[(y*2)*W+(x*2)];
    let v=255;
    if(t>=0){const st=sim.settlements[t];if(st&&!st.razed)v=st.fac%250}
    raw[y*hw+x]=v;
  }
  // run-length encode
  const rle=[];
  let run=1;
  for(let i=1;i<=raw.length;i++){
    if(i<raw.length&&raw[i]===raw[i-1]&&run<255)run++;
    else{rle.push(run,raw[i-1]);run=1}
  }
  sim.snaps.push({y:curYear(),d:Uint8Array.from(rle)});
  if(sim.snaps.length>420)sim.snaps.shift();
}
function decodeSnap(snap,hw,hh){
  const out=new Uint8Array(hw*hh);
  let o=0;
  for(let i=0;i<snap.d.length;i+=2){
    const n=snap.d[i],v=snap.d[i+1];
    out.fill(v,o,o+n);o+=n;
  }
  return out;
}

/* ============ YEARLY EXTRAS ============ */
function yearlyExtras(){
  updateEras();
  snapTerritory();
  // legends are never spawned in any mode: a man-eater earns its name kill by kill (noteAnimalKill)
  if(sim.beast&&sim.beast.slain)sim.beast=null; // room for the next terror to earn its name
  // relics are forged only from real means: craft, treasury, and a patron
  proYearlyRelics();
  // evolution stats (worm worlds: circuit gains; classic: instinct genes)
  {
    const pi=world.brains?2:0,fi=world.brains?3:1;
    let sp2=0,np=0,sf=0,nf=0;
    for(const a of sim.animals){
      if(!a.genes)continue;
      const g=a.genes;
      if(SPECIES[a.sp].pred){sf+=g[fi];nf++}else{sp2+=g[pi];np++}
    }
    const s=sim.stats;
    if(!s.evoPrey)s.evoPrey=[];
    if(!s.evoPred)s.evoPred=[];
    while(s.evoPrey.length<s.yr.length-1)s.evoPrey.push(1);
    while(s.evoPred.length<s.yr.length-1)s.evoPred.push(1);
    s.evoPrey.push(np?sp2/np:1);s.evoPred.push(nf?sf/nf:1);
    if(s.evoPrey.length>1200){s.evoPrey.shift();s.evoPred.shift()}
  }
}

<script>
'use strict';
/* ============================================================
   PRO MODE — zero scheduled drama.
   Every event below is the output of a mechanism reading real
   state: grievance graphs, resource shortages, body counts,
   grief, and stress. No "chance(p) → history happens" rolls.
   ============================================================ */

/* ---------- social graph: friendships ---------- */
function befriend(a,b){
  if(!a||!b||a.id===b.id)return;
  a.frs=a.frs||[];b.frs=b.frs||[];
  if(a.frs.includes(b.id)||a.frs.length>=6||b.frs.length>=6)return;
  a.frs.push(b.id);b.frs.push(a.id);
}
function proQuarterlySocial(){
  // bonds form where lives actually overlap: same town, shared work, shared halls
  for(const st of sim.settlements){
    if(st.razed||!st.popC)continue;
    const res=[];
    for(const p of sim.people.values())if(p.home===st.id&&!p.inArmy&&(sim.day-p.born)/DAYS_Y>=14)res.push(p);
    if(res.length<3)continue;
    const nBonds=Math.max(1,Math.round(res.length/8));
    for(let i=0;i<nBonds;i++){
      const a=pick(res);
      // meeting pools: co-profession, or anyone if the town has a market or temple
      const pool=res.filter(q=>q.id!==a.id&&(q.prof===a.prof||st.market||st.temple));
      if(pool.length)befriend(a,pick(pool));
    }
  }
}

/* ---------- grievance: measured, not rolled ---------- */
function grievanceOf(p,f){
  let g=0;
  if(p.grudge===f.id)g+=3;
  g+=(p.lost||0)*1.5;                       // kin taken by violence, plague, famine
  const st=sim.settlements[p.home];
  if(st&&st.famine>30)g+=2;
  if(st&&sim.day-st.conqDay<DAYS_Y*15)g+=1.5;
  if(st&&st.religion>=0&&f.relig>=0&&st.religion!==f.relig)g+=1;
  return g;
}

/* ---------- plots: rebellion recruited one conversation at a time ---------- */
function proMonthlyPlots(){
  for(const st of sim.settlements){
    if(st.razed||st.popC<12)continue;
    const f=sim.factions[st.fac];
    if(!f||f.dead||f.capital===st.id)continue;
    // find or advance the local plot
    let plotter=null;
    for(const p of sim.people.values()){
      if(p.home!==st.id||p.inArmy)continue;
      if(p.plot){plotter=p;break}
    }
    if(!plotter){
      // a plot begins only inside a person: high ambition meeting high grievance
      let best=null,bg=0;
      for(const p of sim.people.values()){
        if(p.home!==st.id||p.inArmy||p.prof==='leader'||p.prof==='child')continue;
        const g=grievanceOf(p,f)*(0.4+p.amb);
        if(g>bg){bg=g;best=p}
      }
      if(best&&bg>=4.5){
        best.plot={fol:[],since:sim.day};
        bio(best,'Began speaking against the '+facTitle(f)+' in shadowed corners');
      }
      continue;
    }
    // recruitment: the plotter works their real friendships, and friends of friends
    const plot=plotter.plot;
    plot.fol=plot.fol.filter(id=>{const q=sim.people.get(id);return q&&!q.dead&&q.home===st.id});
    const reach=new Set(plotter.frs||[]);
    for(const fid of(plotter.frs||[])){const q=sim.people.get(fid);
      if(q&&q.frs)for(const ff of q.frs)reach.add(ff)}
    for(const cid of reach){
      if(plot.fol.length>=40)break;
      if(cid===plotter.id||plot.fol.includes(cid))continue;
      const c=sim.people.get(cid);
      if(!c||c.dead||c.home!==st.id||c.inArmy||c.prof==='leader')continue;
      // a friend joins when their own measured grievance outweighs their caution
      if(grievanceOf(c,f)+plotter.cha*2>3.5+c.brav)plot.fol.push(cid);
    }
    // exposure: garrison strength is real soldiers present
    let garrison=0;
    for(const p of sim.people.values())if(p.home===st.id&&p.prof==='soldier'&&!p.inArmy)garrison++;
    if(plot.fol.length>=Math.max(5,garrison*2.5)){
      delete plotter.plot;
      splitFaction(f,st,plotter,'Uprising');
      logEvent('politics','The uprising in '+st.nm+' was years in the making: '+plot.fol.length+
        ' souls, bound by grief and grudge, answered '+fullName(plotter)+'.',st.x,st.y,{sett:st.id,p:plotter.id});
    }else if(plot.fol.length>=8&&sim.day-(st.lastPlotLog||-1e9)>DAYS_Y*3){
      st.lastPlotLog=sim.day;
      logEvent('politics','Whispers in '+st.nm+': discontent gathers around '+fullName(plotter)+'.',st.x,st.y,{sett:st.id,p:plotter.id});
    }else if(sim.day-plot.since>DAYS_Y*12){
      delete plotter.plot; // the moment passed
    }
  }
}

/* ---------- casus belli: wars fought over real shortages ---------- */
function realmNeeds(f){
  let ore=false,food=0,setts=0,pop2=0;
  for(const st of sim.settlements){
    if(st.razed||st.fac!==f.id)continue;
    setts++;pop2+=st.popC||0;
    food+=st.famine;
    if(!ore)for(const i of st.tiles){
      const x=i%world.W,y=(i/world.W)|0;
      for(let dy=-6;dy<=6&&!ore;dy++)for(let dx=-6;dx<=6;dx++){
        const qx=x+dx,qy=y+dy;
        if(inb(qx,qy)&&world.resource[idx(qx,qy)]===RES.ORE)ore=true;
      }
      break; // sampling the capital-ish tile is enough
    }
  }
  return {ore,hungry:setts?food/setts>15:false,crowded:setts?pop2/setts>55:false,pop:pop2,setts};
}
function proYearlyWars(live){
  for(const f of live){
    if(Object.keys(f.wars).length)continue;           // one war at a time
    const lead=sim.people.get(f.leader);
    if(!lead)continue;
    const needs=realmNeeds(f);
    const wants=[];
    if(!needs.ore)wants.push('ore');
    if(needs.hungry)wants.push('grain');
    if(needs.crowded)wants.push('land');
    const vengeful=lead.grudge!==undefined&&sim.factions[lead.grudge]&&!sim.factions[lead.grudge].dead;
    if(!wants.length&&!vengeful)continue;             // content realms keep the peace
    if(lead.amb+lead.brav<0.9)continue;               // timid rulers endure shortage
    // choose the target that actually has what is lacking, and can plausibly be beaten,
    // judged on what this court has actually HEARD, not on the world's true ledgers
    let target=null,reason='',tPopK=0;
    for(const o of live){
      if(o.id===f.id)continue;
      const oN=realmNeeds(o);
      const oPopK=typeof knownFacPop==='function'?knownFacPop(f,o.id):oN.pop;
      if(oPopK>needs.pop*1.25)continue;               // no hopeless wars, by their own reckoning
      if(getRel(f.id,o.id)>25)continue;               // not against fast friends
      if(vengeful&&o.id===lead.grudge){target=o;reason='in vengeance for old wounds';tPopK=oPopK;break}
      if(wants.includes('ore')&&oN.ore){target=o;reason='coveting its ore-rich hills';tPopK=oPopK;break}
      if(wants.includes('grain')&&!oN.hungry){target=o;reason='for its full granaries';tPopK=oPopK;break}
      if(wants.includes('land')&&!oN.crowded&&oN.setts){target=o;reason='hungry for its lands';tPopK=oPopK}
    }
    if(!target)continue;
    const wev=logEvent('war','The '+facTitle(f)+' declares war upon the '+facTitle(target)+', '+reason+'.',-1,-1,{fac:f.id},
      {actor:f.leader,why:{wantsOre:wants.includes('ore')?1:0,hungry:wants.includes('grain')?1:0,crowded:wants.includes('land')?1:0,
        vengeance:vengeful&&target.id===lead.grudge?1:0,rulerAmbition:+lead.amb.toFixed(2),
        ownPop:needs.pop,targetPopAsHeard:Math.round(tPopK)}});
    toast('⚔ The '+facTitle(f)+' marches on the '+facTitle(target)+' — '+reason+'.');
    declareWar(f,target,'sil');
    f.wars[target.id].reason=reason;
    f.wars[target.id].ev=wev;
  }
}

/* ---------- legends grown from real body counts ---------- */
function noteAnimalKill(a){
  a.kills=(a.kills||0)+1;
  if(!a.legend&&!sim.beast&&['Bear','Wolf','Lion','Tiger'].includes(SPECIES[a.sp].name)
     &&a.kills>=12&&a.age>1200&&(a.manKills||0)>=2){
    a.legend=true;a.hp=14;
    sim.beast={id:a.id,nm:beastName(a),born:sim.day,kills:a.manKills||0,grown:SPECIES[a.sp].name};
    sim.beast.evId=logEvent('calamity','The '+SPECIES[a.sp].name.toLowerCase()+' that has taken '+a.kills+' lives is now spoken of by name: '+sim.beast.nm+'.',a.x,a.y,undefined,
      {cause:'a body count earned kill by kill across the years'}).id;
    toast('Ω A '+SPECIES[a.sp].name.toLowerCase()+' has become '+sim.beast.nm+'.',a.x,a.y);
  }
}

/* ---------- grief: prophets and breaking points ---------- */
function proOnBereavement(p,cause){
  p.lost=(p.lost||0)+1;
  p.stress=(p.stress||0)+2+(1-p.brav);
  // revelation is born of grief meeting extraordinary piety
  if(world.pro&&p.pie>0.82&&(cause==='plague'||cause==='famine')&&p.prof!=='leader'){
    const near=sim.religions.some(r2=>{const st=sim.settlements[p.home];return st&&st.religion===r2.id});
    if(!near){
      const rel={id:sim.religions.length,nm:religionName(sim.factions[p.fac]?sim.factions[p.fac].culture:0),color:'#b9a2d6',founder:p.id,founded:sim.day};
      sim.religions.push(rel);
      const st=sim.settlements[p.home];
      if(st)st.religion=rel.id;
      p.prof='priest';p.notable=true;addDist(p,6,'In grief, received a vision and founded '+rel.nm);
      logEvent('faith','Broken by loss, '+fullName(p)+' proclaims '+rel.nm+(st?' in '+st.nm:'')+'.',st?st.x:-1,st?st.y:-1,{p:p.id},
        {actor:p.id,cause:'grief: kin taken by '+cause});
      toast('☨ '+rel.nm+' is born of grief.');
    }
  }
}
function proMonthlyStress(){
  for(const p of sim.people.values()){
    if(!p.stress)continue;
    const st=sim.settlements[p.home];
    if(st&&st.famine>30)p.stress+=0.3;
    p.stress=Math.max(0,p.stress-0.35);          // time heals, slowly
    const threshold=5+p.brav*4;
    if(p.stress>threshold){
      p.stress=1;
      // the break takes the shape of the person
      if(p.amb>0.7&&st){
        bio(p,'Snapped under grief and rage');
        p.grudge=p.grudge??st.fac;
      }else if(p.brav<0.3&&st){
        p.home=-1;p.mission=null;p.path=null;    // walks into the wilds
        logEvent('life',fullName(p)+', hollowed by loss, walked out of '+st.nm+' into the wilds and did not look back.',st.x,st.y,{p:p.id});
        p.notable=true;
      }else if(st&&st.popC>3){
        const v=randomResident(st);
        if(v&&v.id!==p.id&&chance(0.5)){
          killPerson(v,'was killed when '+fullName(p)+' broke under their griefs');
          bio(p,'Killed '+fullName(v)+' in a fit of madness');p.notable=true;
          logEvent('life','Madness in '+st.nm+': '+fullName(p)+', long tormented, turned on '+fullName(v)+'.',st.x,st.y,{p:p.id});
        }else bio(p,'Suffered a breakdown');
      }
    }
  }
}

/* ---------- relics: forged from real means ---------- */
function proYearlyRelics(){
  if(sim.relics.length>=9)return;
  for(const st of sim.settlements){
    if(st.razed||st.popC<25)continue;
    const f=sim.factions[st.fac];
    if(!facKnows(f,'smelting')||st.stock.stone<30||(st.wealth||0)<60)continue;
    // a patron of real renown, with real wealth behind them
    let patron=null;
    for(const p of sim.people.values())if(p.home===st.id&&p.dist>=4&&!(p.relics&&p.relics.length)){patron=p;break}
    if(!patron)continue;
    st.wealth-=50;st.stock.stone-=20;
    const r=createRelic('sword',undefined,patron.id);
    logEvent('life','With '+st.nm+"'s wealth behind the forge, a master smith makes "+r.nm+' for '+fullName(patron)+'.',st.x,st.y,{p:patron.id});
    return; // at most one a year in all the world
  }
}

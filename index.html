<script>
'use strict';
/* ============ EMERGENT ECONOMY: goods, prices, trade, and money that must be earned ============ */

const GOODS=['grain','meat','fish','wood','stone','ore','metal','tools','salt'];
const GX={};GOODS.forEach((g,i)=>GX[g]=i);
// base: price scale; dur: durability; div: divisibility; uni: universality of demand
const GPROP=[
  {base:1.0,dur:0.35,div:0.9,uni:0.95}, // grain: everyone wants it, it rots
  {base:1.6,dur:0.10,div:0.7,uni:0.80}, // meat
  {base:1.3,dur:0.15,div:0.7,uni:0.75}, // fish
  {base:0.8,dur:0.70,div:0.5,uni:0.70}, // wood
  {base:0.9,dur:0.95,div:0.3,uni:0.40}, // stone
  {base:1.8,dur:0.90,div:0.6,uni:0.35}, // ore
  {base:3.5,dur:0.95,div:0.85,uni:0.60},// metal: durable, splits well, widely craved
  {base:5.0,dur:0.80,div:0.15,uni:0.65},// tools: dear, but who trades half a plough
  {base:2.2,dur:0.90,div:0.95,uni:0.70} // salt: keeps forever, pours by the grain
];

function invCap(st){return 400+(st.houses||0)*40}

function initEconSt(st){
  if(!st.inv){
    st.inv=new Float32Array(9);
    st.inv[GX.grain]=300;st.inv[GX.meat]=60;st.inv[GX.fish]=30;
    st.inv[GX.wood]=st.stock&&st.stock.wood?st.stock.wood:0;
    if(st.stock&&st.stock.food!==undefined){ // old save: split the granary
      st.inv[GX.grain]=st.stock.food*0.7;st.inv[GX.fish]=st.stock.food*0.15;st.inv[GX.meat]=st.stock.food*0.15;
    }
  }
  if(!st.price){st.price=new Float32Array(9);for(let g=0;g<9;g++)st.price[g]=GPROP[g].base}
  if(!st._sup)st._sup=new Float32Array(9);
  if(!st._dem)st._dem=new Float32Array(9);
  if(!st.trade)st.trade={vol:0,fr:0,gcount:new Float32Array(9),partners:{}};
  if(!st.trade.gcount)st.trade.gcount=new Float32Array(9);
  if(st.wealth===undefined)st.wealth=(st.stock&&st.stock.wealth!==undefined)?st.stock.wealth:10;
}
function initEconFac(f){f.treasury=f.treasury||0;if(f.unpaid===undefined)f.unpaid=false}

function foodTotal(st){initEconSt(st);return st.inv[GX.grain]+st.inv[GX.meat]+st.inv[GX.fish]}
function toolMult(st){return st.inv&&st.inv[GX.tools]>st.popC/20?1.2:1.0}

function econDaily(st,c,farmEff,wxMul){
  initEconSt(st);
  const inv=st.inv,sup=st._sup,dem=st._dem,wm=wxMul||1;
  // production flows into the granaries and the ledger of supply
  const grainIn=(farmEff||0)*toolMult(st);
  inv[GX.grain]+=grainIn;sup[GX.grain]+=grainIn;
  const meatIn=(c.hunter||0)*2.0*(st._gameMod||1)*wm;
  inv[GX.meat]+=meatIn;sup[GX.meat]+=meatIn;
  const fishIn=(c.fisher||0)*2.2*wm;
  inv[GX.fish]+=fishIn;sup[GX.fish]+=fishIn;
  if(st._hasOre){const o=(c.miner||0)*0.5;inv[GX.ore]+=o;sup[GX.ore]+=o}
  if(st._salty){const s=(c.laborer||0)*0.15;inv[GX.salt]+=s;sup[GX.salt]+=s}
  const hasSkill=typeof settHasSkill==='function'?settHasSkill:function(){return false};
  if((c.smith||0)>0&&hasSkill(st,'smelting')){
    // each unit of metal costs one ore and one log fed to the furnace
    const u=Math.min((c.smith||0)*1.5,inv[GX.ore],st.stock?st.stock.wood:0);
    if(u>0){inv[GX.ore]-=u;st.stock.wood-=u;inv[GX.metal]+=u;sup[GX.metal]+=u;dem[GX.ore]+=u}
    if(hasSkill(st,'ironwork')){
      const t=Math.min((c.smith||0)*0.8,inv[GX.metal]);
      if(t>0){inv[GX.metal]-=t;inv[GX.tools]+=t;sup[GX.tools]+=t;dem[GX.metal]+=t}
    }
  }
  // hungry mouths: grain first, then fish, then meat
  const need=0.85*(st.popC||0);let left=need,ate=0;
  for(const g of[GX.grain,GX.fish,GX.meat]){
    if(left<=0)break;
    const take=Math.min(left,inv[g]);
    inv[g]-=take;dem[g]+=take;ate+=take;left-=take;
  }
  // tools dull and break under many hands
  const wear=(st.popC||0)*0.004;
  inv[GX.tools]=Math.max(0,inv[GX.tools]-wear);dem[GX.tools]+=wear;
  // spoilage: grain moulds slowly, meat quickly, unless salted down
  inv[GX.grain]*=0.996;
  let meatDecay=0.015;
  if(inv[GX.salt]>=(st.popC||0)*0.05){meatDecay=0.0075;inv[GX.salt]=Math.max(0,inv[GX.salt]-(st.popC||0)*0.002)}
  inv[GX.meat]*=(1-meatDecay);
  const cap=invCap(st);
  for(let g=0;g<9;g++)if(inv[g]>cap)inv[g]=cap;
  return {short:left>0.01,ate};
}

function econMonthly(st){
  initEconSt(st);
  for(let g=0;g<9;g++){
    const base=GPROP[g].base;
    let target=base*Math.pow((st._dem[g]+1)/(st._sup[g]+1),0.7);
    target=clamp(target,0.2*base,8*base);
    st.price[g]=st.price[g]*0.7+target*0.3;
    st._sup[g]*=0.5;st._dem[g]*=0.5;
  }
  st.trade.vol*=0.985;st.trade.fr*=0.985;
  for(let g=0;g<9;g++)st.trade.gcount[g]*=0.985;
}

// how much of a good the town itself will want this month, kept off the trade wagons
function monthlyNeed(st,g){
  const pop=st.popC||0;
  if(g===GX.grain)return pop*0.85*30*0.6;
  if(g===GX.fish)return pop*0.85*30*0.2;
  if(g===GX.meat)return pop*0.85*30*0.2;
  if(g===GX.tools)return pop/20+2;
  if(g===GX.ore)return pop*0.1;
  if(g===GX.salt)return pop*1.5;
  return 0;
}

function econPartnersOf(st){
  if(typeof knownPartners==='function')return knownPartners(st);
  const out=[];
  for(const o of sim.settlements){
    if(o.razed||o.id===st.id)continue;
    if(Math.max(Math.abs(o.x-st.x),Math.abs(o.y-st.y))<=40)out.push({st:o,prices:o.price||null,ageDays:0});
  }
  return out;
}

function tradeMonthly(){
  for(const st of sim.settlements){
    if(st.razed||!st.market||st.popC<18)continue;
    initEconSt(st);
    if(st._car)continue; // the wagon is still on the road
    const partners=econPartnersOf(st);
    let best=null;
    for(const pr of partners){
      const dest=pr.st;
      if(!dest||dest.razed||dest.id===st.id)continue;
      if(areAtWar(st.fac,dest.fac))continue;
      initEconSt(dest);
      const prices=pr.prices||dest.price;
      const dist=Math.max(Math.abs(dest.x-st.x),Math.abs(dest.y-st.y));
      for(let g=0;g<9;g++){
        if(g===GX.wood||g===GX.stone)continue; // building stores belong to other hands
        const surplus=Math.max(0,st.inv[g]-monthlyNeed(st,g));
        if(surplus<1)continue;
        const unit=(prices[g]-st.price[g])-dist*0.004;
        if(unit<=0)continue;
        const qty=Math.min(surplus,40);
        const exp=unit*qty;
        if(exp>3&&(!best||exp>best.exp+rnd()*0.01))best={dest,g,qty,exp};
      }
    }
    if(!best)continue;
    const dest=best.dest;
    const path=findPath(st.x,st.y,dest.x,dest.y,5000);
    if(path){
      st.inv[best.g]-=best.qty;st._car=true;
      sim.caravans.push({id:sim.nextId++,from:st.id,to:dest.id,fac:st.fac,x:st.x,y:st.y,rx:st.x,ry:st.y,
        path,pi:0,relig:st.religion,plague:st.plague?1:0,cargo:{g:best.g,qty:best.qty},dead:false});
    }else if(settHarbor(st)&&settHarbor(dest)){
      const a=coastWaterNear(st.x,st.y,8),b=coastWaterNear(dest.x,dest.y,8);
      if(a&&b){
        const sp=findSeaPath(a.x,a.y,b.x,b.y,7000);
        if(sp){
          st.inv[best.g]-=best.qty;st._car=true;
          sim.ships.push({id:sim.nextId++,kind:'trade',fac:st.fac,from:st.id,to:dest.id,x:a.x,y:a.y,rx:a.x,ry:a.y,
            path:sp,pi:0,dead:false,age:0,relig:st.religion,plague:st.plague?1:0,cargo:{g:best.g,qty:best.qty}});
        }
      }
    }
  }
}

function launchTradeFlagClear(fromId){
  const st=sim.settlements[fromId];
  if(st)st._car=false;
}

/* ---------- money state ---------- */
function monOf(facId){
  if(!sim.mon)sim.mon={};
  if(!sim.currencies)sim.currencies=[];
  if(!sim.mon[facId])sim.mon[facId]={stage:'none',medium:-1,curId:-1,since:sim.day};
  return sim.mon[facId];
}
function facCurrency(facId){
  const m=monOf(facId);
  return (m.curId>=0&&sim.currencies[m.curId])?sim.currencies[m.curId]:null;
}
function curPenalty(facId){
  const m=monOf(facId);
  if(m.stage!=='coin')return 1;
  const cur=facCurrency(facId);
  return cur&&cur.purity>0.05?1/cur.purity:2;
}

/* ---------- exchange: the moment goods change hands ---------- */
function econArrive(c,dest,src){
  if(!dest||dest.razed)return;
  initEconSt(dest);
  if(src){initEconSt(src);src._car=false}
  if(!c.cargo){ // an old style caravan, only rumors and a little coin
    dest.wealth+=2;
    if(src&&typeof hearNews==='function')hearNews(dest,src);
    return;
  }
  const g=c.cargo.g,qty=c.cargo.qty;
  const cap=invCap(dest);
  dest.inv[g]=Math.min(cap,dest.inv[g]+qty);
  dest._sup[g]+=qty;
  const mB=monOf(dest.fac);
  const pen=curPenalty(dest.fac);
  let value=qty*dest.price[g]*pen;
  if(mB.stage==='coin'){
    const cur=facCurrency(dest.fac);
    const pay=Math.min(value,Math.max(0,dest.wealth));
    dest.wealth-=pay;
    if(src)src.wealth+=pay;
    if(pay<value-0.01){dest.trade.fr++;value=pay} // an empty purse cuts the deal short
    if(cur&&cur.purity<0.75){dest.trade.fr++;if(src)src.trade.fr++} // the debased coin is eyed with distrust
  }else if(mB.stage==='commodity'&&mB.medium>=0){
    const m=mB.medium;
    let units=dest.price[m]>0?value/dest.price[m]:0;
    if(dest.inv[m]<units){ // they lack the very stuff that counts as money here
      units=dest.inv[m];dest.trade.fr++;
      value=units*dest.price[m];
    }
    dest.inv[m]-=units;dest._dem[m]+=units;
    if(src){src.inv[m]=Math.min(invCap(src),src.inv[m]+units);src._sup[m]+=units;
      dest.trade.gcount[m]+=units;src.trade.gcount[m]+=units}
  }else{
    // pure barter: a return good the seller actually wants, or a distressed half deal
    let rg=-1,rs=0;
    if(src)for(let k=0;k<9;k++){
      if(k===g||k===GX.wood||k===GX.stone)continue;
      const surplus=dest.inv[k]-monthlyNeed(dest,k);
      if(surplus>1&&src.price[k]>1.2*GPROP[k].base){
        const s=src.price[k]/GPROP[k].base;
        if(s>rs){rs=s;rg=k}
      }
    }
    if(rg>=0){
      let units=dest.price[rg]>0?value/dest.price[rg]:0;
      units=Math.min(units,Math.max(0,dest.inv[rg]-monthlyNeed(dest,rg)));
      dest.inv[rg]-=units;dest._dem[rg]+=units;
      src.inv[rg]=Math.min(invCap(src),src.inv[rg]+units);src._sup[rg]+=units;
      dest.trade.gcount[rg]+=units;src.trade.gcount[rg]+=units;
    }else{
      // no wants matched: the wagoners take half worth and grumble
      dest.trade.fr++;if(src)src.trade.fr++;
      value*=0.5;
    }
  }
  dest.trade.vol+=value;dest.trade.gcount[g]+=qty;
  if(src){src.trade.vol+=value;src.trade.gcount[g]+=qty;
    dest.trade.partners[src.id]=sim.day;src.trade.partners[dest.id]=sim.day}
  if(src&&typeof hearNews==='function')hearNews(dest,src);
}

/* ---------- the money state machine: every step earned, never rolled ---------- */
function moneyYearly(){
  if(!sim.mon)sim.mon={};
  if(!sim.currencies)sim.currencies=[];
  // orphaned coinage fades once its realm has fallen
  for(const cur of sim.currencies){
    if(cur.dead)continue;
    const iss=sim.factions[cur.issuer];
    if(iss&&iss.dead){
      if(!cur.orphan){cur.orphan=true;
        logEvent('politics','With the fall of the '+facTitle(iss)+', the '+cur.nm+' is metal and memory only.',-1,-1,{fac:iss.id},
          {cause:'the realm that struck it is no more'});
      }
      cur.purity-=0.1;
      if(cur.purity<=0.05){cur.purity=0.05;cur.dead=true}
    }
  }
  let hiStage=0;
  for(const f of sim.factions){
    if(f.dead)continue;
    initEconFac(f);
    const m=monOf(f.id);
    // measure the realm's markets, ledger by ledger
    let vol=0,fr=0;const gc=new Float32Array(9);
    for(const st of sim.settlements){
      if(st.razed||st.fac!==f.id)continue;
      initEconSt(st);
      vol+=st.trade.vol;fr+=st.trade.fr;
      for(let g=0;g<9;g++)gc[g]+=st.trade.gcount[g];
    }
    const cap=sim.settlements[f.capital];
    const cx=cap?cap.x:-1,cy=cap?cap.y:-1;
    const frRate=fr/(vol+1);
    if(m.stage==='coin'){
      const cur=facCurrency(f.id);
      if(!cur||cur.dead||cur.purity<0.5||vol<150){
        m.stage='commodity';m.since=sim.day;
        const why={tradeVolume:Math.round(vol),purity:cur?Math.round(cur.purity*100):0};
        const cause=(!cur||cur.dead||vol<150)?'the mint fell silent':'none would take the debased coin';
        logEvent('politics','In the '+facTitle(f)+', the '+(cur?cur.nm:'coin')+' passes from hand to hand no longer; folk weigh out '+(m.medium>=0?GOODS[m.medium]:'goods')+' once more.',cx,cy,{fac:f.id},{why,cause});
      }
    }else if(m.stage==='commodity'){
      if(vol<60){
        m.stage='barter';m.since=sim.day;
        logEvent('politics','Trade has withered in the '+facTitle(f)+'; '+GOODS[m.medium>=0?m.medium:GX.grain]+' is money no more, and folk fall back to plain swapping.',cx,cy,{fac:f.id},
          {why:{tradeVolume:Math.round(vol)},cause:'the markets emptied'});
      }else if(vol>=900&&typeof facKnows==='function'&&facKnows(f,'minting')&&f.treasury>=60&&(sim.day-m.since)>=5*DAYS_Y){
        const yrsOn=Math.round((sim.day-m.since)/DAYS_Y);
        const nm=wordFrom(CULTURES[f.culture].ph,2,2);
        const cur={id:sim.currencies.length,nm,issuer:f.id,metal:'silver',purity:1.0,born:sim.day,dead:false};
        sim.currencies.push(cur);
        f.treasury-=60;
        m.stage='coin';m.curId=cur.id;m.since=sim.day;
        const ev=logEvent('politics','The '+facTitle(f)+' strikes its first coin, the '+nm+'.',cx,cy,{fac:f.id},
          {actor:f.leader,why:{tradeVolume:Math.round(vol),treasurySpent:60,yearsOnCommodity:yrsOn},cause:'a mint, a full treasury, and trade too heavy for sacks of '+GOODS[m.medium>=0?m.medium:GX.grain]});
        toast('The '+facTitle(f)+' strikes its first coin, the '+nm+'.',cx,cy);
        void ev;
      }
    }else if(m.stage==='barter'){
      if((vol>=300&&fr>=20&&frRate>=0.02)||fr>=150){
        let bm=GX.grain,bs=-1;
        for(let g=0;g<9;g++){
          const s=gc[g]*GPROP[g].dur*GPROP[g].div*GPROP[g].uni;
          if(s>bs+rnd()*0.001){bs=s;bm=g}
        }
        m.stage='commodity';m.medium=bm;m.since=sim.day;
        logEvent('tech','In the markets of the '+facTitle(f)+', '+GOODS[bm]+' has become money: '+Math.round(fr)+' exchanges found no matching wants this generation.',cx,cy,{fac:f.id},
          {why:{tradeVolume:Math.round(vol),frictions:Math.round(fr),frictionRate:Math.round(frRate*100)/100},cause:'too many wagons turned home half laden'});
      }
    }else{ // none
      if(vol>0){
        m.stage='barter';m.since=sim.day;
        logEvent('tech','The folk of the '+facTitle(f)+' begin to barter, goods answering goods between the settlements.',cx,cy,{fac:f.id},
          {why:{tradeVolume:Math.round(vol*100)/100},cause:'the first laden wagon arrived'});
      }
    }
    const sn=m.stage==='coin'?3:m.stage==='commodity'?2:m.stage==='barter'?1:0;
    if(sn>hiStage)hiStage=sn;
  }
  // high water mark of monetization, aligned to the yearly series
  const s=sim.stats;
  if(!s.mon)s.mon=[];
  while(s.mon.length<s.yr.length-1)s.mon.push(0);
  if(s.mon.length<s.yr.length)s.mon.push(hiStage);else s.mon[s.mon.length-1]=hiStage;
  while(s.mon.length>s.yr.length)s.mon.shift();
}

/* ---------- fiscal: the crown must pay its way ---------- */
function fiscalMonthly(f){
  if(f.dead)return;
  initEconFac(f);
  const m=monOf(f.id);
  if(m.stage==='coin'){
    for(const st of sim.settlements){
      if(st.razed||st.fac!==f.id)continue;
      initEconSt(st);
      if(st.wealth>20){const take=0.05*st.wealth;st.wealth-=take;f.treasury+=take}
      if(st.market)f.treasury+=2;
    }
    let soldiers=0;
    for(const p of sim.people.values())if(p.fac===f.id&&p.prof==='soldier')soldiers++;
    f.treasury-=soldiers*0.5;
    f.unpaid=f.treasury<0;
  }else{
    // tribute in kind trickles into the stores
    for(const st of sim.settlements)if(!st.razed&&st.fac===f.id)f.treasury+=0.5;
    f.unpaid=false;
  }
}

function maybeDebase(f){
  if(f.dead)return;
  if(f._lastDeb!==undefined&&sim.day-f._lastDeb<2*DAYS_Y)return; // even a desperate crown waits to see what the last clipping bought
  const m=monOf(f.id);
  if(m.stage!=='coin')return;
  if(Object.keys(f.wars).length===0)return;
  let soldiers=0;
  for(const p of sim.people.values())if(p.fac===f.id&&p.prof==='soldier')soldiers++;
  const wagesNeeded=soldiers*0.5*3;
  if(f.treasury>=wagesNeeded)return;
  const leader=getP(f.leader);
  if(!leader||leader.amb<=0.6)return;
  const cur=facCurrency(f.id);
  if(!cur||cur.dead||cur.purity<=0.3)return;
  const lost=Math.min(rf(0.10,0.22),cur.purity-0.3);
  if(lost<=0)return;
  f._lastDeb=sim.day;
  cur.purity-=lost;
  f.treasury+=300*lost;
  let warEv,warYears=0;
  for(const k of Object.keys(f.wars)){const w=f.wars[k];if(w.ev&&!warEv)warEv=w.ev;
    warYears=Math.max(warYears,Math.round((sim.day-(w.since||sim.day))/DAYS_Y))}
  const cap=sim.settlements[f.capital];
  logEvent('politics',leaderTitle(f)+' '+fullName(leader)+' orders the '+cur.nm+' debased to pay for the war.',
    cap?cap.x:-1,cap?cap.y:-1,{fac:f.id},
    {actor:leader.id,why:{treasury:Math.round(f.treasury),wagesNeeded:Math.round(wagesNeeded),warYears},
     cause:warEv||'an empty treasury in wartime'});
  toast('The '+cur.nm+' is debased; the mint waters the silver.',cap?cap.x:-1,cap?cap.y:-1);
}

/* ---------- panels ---------- */
function moneyPanel(f){
  const m=monOf(f.id);
  initEconFac(f);
  let h='<div>money: <b>'+(m.stage==='none'?'no trade yet':m.stage)+'</b></div>';
  if(m.stage==='commodity'&&m.medium>=0)h+='<div>medium: '+GOODS[m.medium]+'</div>';
  if(m.stage==='coin'){
    const cur=facCurrency(f.id);
    if(cur)h+='<div>currency: the '+cur.nm+', fineness '+Math.round(cur.purity*100)+' percent, struck by the '+facTitle(sim.factions[cur.issuer])+'</div>';
  }
  h+='<div>treasury: '+Math.round(f.treasury)+(f.unpaid?' <span style="color:#c66">(the soldiers go unpaid)</span>':'')+'</div>';
  const cap=sim.settlements[f.capital];
  if(cap&&cap.price){
    h+='<div>capital prices: ';
    h+=[GX.grain,GX.metal,GX.tools,GX.salt].map(g=>GOODS[g]+' '+(Math.round(cap.price[g]*10)/10)).join(' · ');
    h+='</div>';
  }
  return h;
}

function invPanel(st){
  initEconSt(st);
  const rows=[];
  for(let g=0;g<9;g++)if(st.inv[g]>=1)rows.push({g,v:st.inv[g]});
  rows.sort((a,b)=>b.v-a.v);
  let h='<div>goods: '+(rows.length?rows.slice(0,5).map(r=>GOODS[r.g]+' '+Math.round(r.v)).join(', '):'the stores stand bare')+'</div>';
  h+='<div>prices: grain '+(Math.round(st.price[GX.grain]*10)/10)+', tools '+(Math.round(st.price[GX.tools]*10)/10)+'</div>';
  return h;
}

/* ---------- save compat ---------- */
function econSerSt(st){
  if(!st.inv)return null;
  return {inv:Array.from(st.inv),price:Array.from(st.price),
    trade:{vol:st.trade.vol,fr:st.trade.fr,gcount:Array.from(st.trade.gcount),partners:st.trade.partners}};
}
function econDeserSt(st,data){
  if(!data){ // old save: split whatever food the granary held
    st.inv=undefined;st.price=undefined;st._sup=undefined;st._dem=undefined;st.trade=undefined;
    initEconSt(st);
    return;
  }
  st.inv=new Float32Array(data.inv);
  st.price=new Float32Array(data.price);
  st._sup=new Float32Array(9);st._dem=new Float32Array(9);
  st.trade={vol:data.trade.vol||0,fr:data.trade.fr||0,gcount:new Float32Array(data.trade.gcount),partners:data.trade.partners||{}};
  initEconSt(st);
}
</script>
<script>
'use strict';
/* ============ SOCIETY: knowledge in people, memory, debt, stewards, imperfect news, contested crowns, forking tongues ============ */

/* ---------- 1) knowledge lives in skulls, not in faction ledgers ---------- */
const KNOW={
 smelting:  {req:[],geo:'ore',  note:'coaxing bright metal from broken stone'},
 ironwork:  {req:['smelting'],geo:null,  note:'beating iron into edges that hold'},
 masonry:   {req:[],geo:null,  note:'raising walls of dressed stone that outlive their builders'},
 wheel:     {req:[],geo:null,  note:'setting burdens rolling upon the wheel'},
 waterwheel:{req:[],geo:'river',note:'setting the river itself to turn the millstone'},
 irrigation:{req:[],geo:'river',note:'leading water by channel to thirsting fields'},
 writing:   {req:[],geo:null,  note:'fixing speech in marks that do not forget'},
 minting:   {req:['smelting'],geo:null,  note:'striking coin that all men trust alike'},
 shipwright:{req:[],geo:'coast',note:'building hulls fit for the open sea'}
};
function knows(p,k){return !!(p.skills&&p.skills.indexOf(k)>=0)}
function teach(p,k){
  p.skills=p.skills||[];
  if(p.skills.indexOf(k)>=0)return;
  p.skills.push(k);
  if(p.skills.length>=2)p.notable=true;
  const f=sim.factions[p.fac];
  if(f&&f._kn)f._kn.add(k);
}
function settHasSkill(st,k){
  if(st._skD!==sim.day){
    st._skD=sim.day;st._skC={};
    for(const p of sim.people.values())
      if(p.home===st.id&&p.skills)for(const s of p.skills)st._skC[s]=1;
  }
  return !!st._skC[k];
}
function rebuildFacKn(f){
  f._kn=new Set();
  for(const p of sim.people.values())
    if(p.fac===f.id&&p.skills)for(const s of p.skills)f._kn.add(s);
  return f._kn;
}
function facKnows(f,k){
  if(!f._kn)rebuildFacKn(f);
  return f._kn.has(k);
}
function facKnownList(f){
  const cnt={};
  for(const p of sim.people.values())
    if(p.fac===f.id&&p.skills)for(const s of p.skills)cnt[s]=(cnt[s]||0)+1;
  const out=[];for(const k in cnt)out.push({k,n:cnt[k]});
  return out;
}
/* settlement geography snapshot, cached about a season */
function settGeo(st){
  if(st._geoD!==undefined&&sim.day-st._geoD<90)return st._geo;
  st._geoD=sim.day;
  const g={ore:false,river:false,coast:false,hot:Math.abs(st.y-world.H/2)/(world.H/2)<0.35};
  for(let dy=-8;dy<=8&&!g.ore;dy++)for(let dx=-8;dx<=8;dx++){
    const x=st.x+dx,y=st.y+dy;
    if(inb(x,y)&&world.resource[idx(x,y)]===RES.ORE){g.ore=true;break}
  }
  for(let dy=-4;dy<=4&&!g.river;dy++)for(let dx=-4;dx<=4;dx++){
    const x=st.x+dx,y=st.y+dy;
    if(!inb(x,y))continue;
    const i=idx(x,y);
    if(world.river[i]===1||world.biome[i]===B.LAKE){g.river=true;break}
  }
  for(let dy=-3;dy<=3&&!g.coast;dy++)for(let dx=-3;dx<=3;dx++){
    const x=st.x+dx,y=st.y+dy;
    if(!inb(x,y))continue;
    const b=world.biome[idx(x,y)];
    if(b===B.OCEAN||b===B.DEEP){g.coast=true;break}
  }
  st._geo=g;return g;
}
function residentsByHome(){
  const m=new Map();
  for(const p of sim.people.values()){
    if(p.home<0)continue;
    let a=m.get(p.home);if(!a){a=[];m.set(p.home,a)}
    a.push(p);
  }
  return m;
}
function topOfProf(res,pred){
  let best=null;
  for(const p of res){
    if(p.inArmy||(sim.day-p.born)<14*DAYS_Y)continue;
    if(!pred(p))continue;
    if(!best||p.dist>best.dist)best=p;
  }
  return best;
}
/* timing jitter only: pressure decides THAT a discovery ripens, this decides WHEN */
function discRipe(p){return chance(0.2+0.1*((p.skills&&p.skills.length)||0)+clamp(p.dist,0,10)*0.02)}
function discReqOk(f,k){
  for(const r of KNOW[k].req)if(!facKnows(f,r))return false;
  return true;
}
function discFire(p,st,f,k,why){
  teach(p,k);
  addDist(p,3,'Mastered '+k+', '+KNOW[k].note);
  logEvent('tech',fullName(p)+' of '+st.nm+' masters '+k+', '+KNOW[k].note+'.',
    st.x,st.y,{p:p.id,sett:st.id,fac:st.fac},{actor:p.id,why});
}
function knowledgeMonthly(){
  const gx=(typeof GX!=='undefined')?GX:null;
  const byHome=residentsByHome();
  for(const st of sim.settlements){
    if(st.razed||st.popC<10)continue;
    const f=sim.factions[st.fac];
    if(!f||f.dead)continue;
    const res=byHome.get(st.id)||[];
    const geo=settGeo(st);
    const inv=st.inv||null;
    const knOwn=k=>facKnows(f,k)||settHasSkill(st,k); // a craft alive in the town counts, whatever the ledgers of the realm say
    /* --- discovery: one first per settlement per month, must be new to the whole faction --- */
    let done=false;
    const atWar=Object.keys(f.wars).length>0;
    const facSetts=sim.settlements.filter(s=>s.fac===f.id&&!s.razed).length;
    /* smelting: ore piles up in a mining town and no one knows what fire can do with it */
    if(!done&&geo.ore&&gx&&inv&&inv[gx.ore]>25&&!knOwn('smelting')&&discReqOk(f,'smelting')){
      const p=topOfProf(res,q=>q.prof==='miner');
      if(p&&discRipe(p)){discFire(p,st,f,'smelting',{orePiled:+inv[gx.ore].toFixed(1),oreVeins:1});done=true}
    }
    /* ironwork: a smelter under war pressure or tool hunger, with metal flowing */
    if(!done&&gx&&inv&&inv[gx.metal]>10&&!knOwn('ironwork')&&discReqOk(f,'ironwork')){
      const toolShort=inv[gx.tools]<st.popC/40;
      if(atWar||toolShort){
        const p=topOfProf(res,q=>knows(q,'smelting'));
        if(p&&discRipe(p))
          {discFire(p,st,f,'ironwork',{metal:+inv[gx.metal].toFixed(1),war:atWar?1:0,toolShort:toolShort?1:0});done=true}
      }
    }
    /* irrigation: a farmer beside a river watching the town starve */
    if(!done&&geo.river&&st.famine>30&&!knOwn('irrigation')){
      const p=topOfProf(res,q=>q.prof==='farmer');
      if(p&&discRipe(p)){discFire(p,st,f,'irrigation',{famine:+st.famine.toFixed(1),river:1});done=true}
    }
    /* masonry: stone piled high in a town grown past timber */
    if(!done&&st.stock&&st.stock.stone>40&&st.popC>=30&&!knOwn('masonry')){
      const p=topOfProf(res,q=>q.prof==='woodcutter'||q.prof==='miner');
      if(p&&discRipe(p)){discFire(p,st,f,'masonry',{stonePiled:+st.stock.stone.toFixed(0),pop:st.popC});done=true}
    }
    /* wheel: heavy trade over beaten roads */
    if(!done&&st.trade&&st.trade.vol>120&&!knOwn('wheel')){
      let road=false;
      for(const i of st.tiles)if(world.road[i]>=14){road=true;break}
      if(road){
        const p=topOfProf(res,q=>q.prof==='trader');
        if(p&&discRipe(p)){discFire(p,st,f,'wheel',{tradeVol:+st.trade.vol.toFixed(0),roads:1});done=true}
      }
    }
    /* waterwheel: grain strain beside running water; another road to the same millstone as the wheel */
    if(!done&&geo.river&&st.popC>45&&!knOwn('waterwheel')){
      const p=topOfProf(res,q=>q.prof==='farmer'||q.prof==='woodcutter');
      if(p&&discRipe(p)){discFire(p,st,f,'waterwheel',{pop:st.popC,river:1});done=true}
    }
    /* writing: records outgrow memory in a town of market and temple */
    if(!done&&st.popC>=50&&st.market&&st.temple&&!knOwn('writing')){
      const recPress=(st.trade&&st.trade.vol>150)||facSetts>=4;
      if(recPress){
        const p=topOfProf(res,q=>q.prof==='priest'||q.prof==='trader');
        if(p&&discRipe(p))
          {discFire(p,st,f,'writing',{tradeVol:st.trade?+st.trade.vol.toFixed(0):0,settlements:facSetts});done=true}
      }
    }
    /* minting: a smelter where metal already serves as money, or the treasury groans uncounted */
    if(!done&&!knOwn('minting')&&discReqOk(f,'minting')){
      const mo=(typeof sim.mon!=='undefined'&&sim.mon)?sim.mon[f.id]:null;
      const moneyPress=(mo&&mo.stage==='commodity'&&mo.medium===gx.metal)||((f.treasury||0)>80);
      if(moneyPress){
        const p=topOfProf(res,q=>knows(q,'smelting'));
        if(p&&discRipe(p))
          {discFire(p,st,f,'minting',{treasury:+(f.treasury||0).toFixed(0),commodityMetal:(mo&&mo.stage==='commodity')?1:0});done=true}
      }
    }
    /* shipwright: a harbor fisher watching trade strain at the water's edge */
    if(!done&&geo.coast&&settHarbor(st)&&st.trade&&st.trade.vol>80&&!knOwn('shipwright')){
      const p=topOfProf(res,q=>q.prof==='fisher');
      if(p&&discRipe(p)){discFire(p,st,f,'shipwright',{tradeVol:+st.trade.vol.toFixed(0),harbor:1});done=true}
    }
    /* --- teaching: craft passes hand to hand, one apprentice per master --- */
    for(const p of res){
      if(!p._app)continue;
      const m=sim.people.get(p._app.m);
      if(!m||m.home!==st.id||!knows(m,p._app.k)||knows(p,p._app.k)){
        if(m&&m._stu===p.id)m._stu=0;
        delete p._app;continue;
      }
      p._app.days+=30;
      if(p._app.days>=720){
        teach(p,p._app.k);
        bio(p,'Learned '+p._app.k+' at the side of '+fullName(m));
        bio(m,'Passed the craft of '+p._app.k+' to '+fullName(p));
        m._stu=0;delete p._app;
      }
    }
    // a craft needs only so many hands in one town; masters stop teaching when the guild is full
    const knCnt={};
    for(const q of res)if(q.skills)for(const s of q.skills)knCnt[s]=(knCnt[s]||0)+1;
    const guildCap=Math.max(2,Math.ceil((st.popC||0)/30));
    for(const m of res){
      if(!m.skills||!m.skills.length||m.inArmy)continue;
      if(m._stu&&sim.people.get(m._stu))continue;
      m._stu=0;
      for(const k of m.skills){
        if((knCnt[k]||0)>=guildCap)continue;
        let stud=null;
        for(const q of res){
          if(q.id===m.id||q._app||q.inArmy||q.prof!==m.prof)continue;
          if((sim.day-q.born)<14*DAYS_Y||knows(q,k))continue;
          stud=q;break;
        }
        if(stud){stud._app={k,days:0,m:m.id};m._stu=stud.id;break}
      }
    }
  }
}
function knowledgeYearly(){
  for(const f of sim.factions){
    if(f.dead)continue;
    const prev=f._knPrev||[];
    rebuildFacKn(f);
    const cap=sim.settlements[f.capital];
    for(const k of prev)if(!f._kn.has(k)){
      logEvent('tech','The last master of '+k+' in the '+facTitle(f)+' has died; the craft is lost.',
        cap?cap.x:-1,cap?cap.y:-1,{fac:f.id},
        {cause:'no apprentice outlived the master',why:{livingKnowers:0,craft:k}});
    }
    f._knPrev=Array.from(f._kn);
  }
}

/* ---------- 2) memory: what a life saw, dimming with the years ---------- */
function remember(p,kind,imp,facId,pid){
  p.mem=p.mem||[];
  const m={d:sim.day,k:kind,imp,fac:facId};
  if(pid!==undefined)m.p=pid;
  p.mem.push(m);
  p.mem.sort((a,b)=>b.imp-a.imp);
  if(p.mem.length>8)p.mem.length=8;
}
function witnessSettlement(st,kind,imp,facId){
  for(const p of sim.people.values())
    if(p.home===st.id&&!p.inArmy)remember(p,kind,imp*rf(0.7,1.1),facId);
}
function memoryYearly(){
  for(const p of sim.people.values()){
    if(!p.mem)continue;
    for(const m of p.mem)m.imp*=0.97;
    p.mem=p.mem.filter(m=>m.imp>=0.05);
  }
}
/* the tale a child is told keeps the enemy but loses the names */
function inheritMemories(p){
  for(const par of[sim.people.get(p.fa),sim.people.get(p.mo)]){
    if(!par||!par.mem)continue;
    for(let i=0;i<2&&i<par.mem.length;i++){
      const m=par.mem[i];
      remember(p,'told-'+m.k,m.imp*0.6,m.fac);
    }
  }
}
/* grievance rebuilt on memory, loss, hunger, conquest, faith, and pressed debts */
function grievance2(p,f){
  let g=0;
  if(p.grudge===f.id)g+=3;
  if(p.mem)for(const m of p.mem)if(m.fac===f.id)g+=m.imp*2.5;
  g+=(p.lost||0)*1.0;
  const st=sim.settlements[p.home];
  if(st&&st.famine>30)g+=2;
  if(st&&sim.day-st.conqDay<DAYS_Y*15)g+=1.5;
  if(st&&st.religion>=0&&f.relig>=0&&st.religion!==f.relig)g+=1;
  for(const e of edgesOf(p,'cred'))if(e.bad)g+=1.5;
  return g;
}

/* ---------- 3) typed bonds: friend, comrade, creditor, rival ---------- */
function edgesOf(p,t){
  if(!p.frs)p.frs=[];
  for(let i=0;i<p.frs.length;i++)
    if(typeof p.frs[i]==='number')p.frs[i]={id:p.frs[i],t:'friend',s:1};
  return t?p.frs.filter(e=>e.t===t):p.frs;
}
function edgeAdd(p,q,t,s){
  if(!p||!q||p.id===q.id)return null;
  const add=(a,b)=>{
    const es=edgesOf(a);
    for(const e of es)if(e.id===b.id&&e.t===t){e.s=clamp(Math.max(e.s,s)+0.25,0,3);return e}
    if(es.length>=10){
      let wi=0;for(let i=1;i<es.length;i++)if(es[i].s<es[wi].s)wi=i;
      if(es[wi].s>=s)return null;
      es.splice(wi,1);
    }
    const ne={id:b.id,t,s};es.push(ne);return ne;
  };
  const mine=add(p,q);
  if(mine)add(q,p);
  return mine;
}
function closeCompanions(p,n){
  const out=[];
  for(const e of edgesOf(p)){
    const q=sim.people.get(e.id);
    if(q&&q.home===p.home)out.push({q,s:e.s});
  }
  out.sort((a,b)=>b.s-a.s);
  return out.slice(0,n).map(o=>o.q);
}
/* the slain leave debts of blood in the hearts of their friends */
function onViolentDeath(p,killerFacId){
  for(const e of edgesOf(p)){
    if(e.s<1.5||(e.t!=='friend'&&e.t!=='comrade'))continue;
    const q=sim.people.get(e.id);
    if(q)remember(q,'friend-slain',0.8,killerFacId,p.id);
  }
}

/* ---------- 4) debt: hunger borrows, plenty repays, pride presses ---------- */
function householdMonthly(st){
  if(st.razed||!st.popC)return;
  const res=[];
  for(const p of sim.people.values())
    if(p.home===st.id&&!p.inArmy&&(sim.day-p.born)>=14*DAYS_Y)res.push(p);
  if(res.length<2)return;
  if(st.famine>10){
    let lender=null;
    for(const p of res)if((p.wealth||0)>5&&(!lender||(p.wealth||0)>(lender.wealth||0)))lender=p;
    if(lender){
      let taken=0;
      for(const p of res){
        if(taken>=5)break;
        if(p.id===lender.id||(p.wealth||0)>=1)continue;
        if((lender.wealth||0)<=5)break;
        lender.wealth-=2;p.wealth=(p.wealth||0)+2;taken++;
        const e=edgeAdd(p,lender,'cred',1);
        if(e)e.amt=(e.amt||0)+2;
      }
    }
    /* pressed debts curdle into shame and grievance */
    for(const p of res)for(const e of edgesOf(p,'cred')){
      if(!e.amt||e.amt<=4||e.bad)continue;
      const l=sim.people.get(e.id);
      if(l&&l.amb>0.6){
        e.bad=true;
        remember(p,'debt-shame',0.4,st.fac);
      }
    }
  }else if(st.famine===0){
    for(const p of res){
      if((p.wealth||0)<=3)continue;
      for(const e of edgesOf(p,'cred')){
        if(!e.amt)continue;
        const l=sim.people.get(e.id);
        p.wealth-=2;e.amt-=2;
        if(l)l.wealth=(l.wealth||0)+2;
        if(e.amt<=0){
          p.frs=edgesOf(p).filter(x=>x!==e);
          if(l)l.frs=edgesOf(l).filter(x=>!(x.id===p.id&&x.t==='cred'));
          if(l)edgeAdd(p,l,'friend',0.5);
        }
        break;
      }
    }
  }
}

/* ---------- 5) stewards: long roads breed short loyalties ---------- */
function stewardsQuarterly(){
  const byHome=residentsByHome();
  const qi=Math.floor(sim.day/90);
  for(const st of sim.settlements){
    if(st.razed||st.popC<25)continue;
    const f=sim.factions[st.fac];
    if(!f||f.dead||f.capital===st.id)continue;
    const cap=sim.settlements[f.capital];
    if(!cap||cap.razed)continue;
    const res=byHome.get(st.id)||[];
    let sw=st.steward!==undefined?sim.people.get(st.steward):null;
    if(!sw||sw.home!==st.id){
      sw=null;
      for(const p of res){
        if(p.inArmy||(sim.day-p.born)<14*DAYS_Y)continue;
        if(!sw||p.dist>sw.dist)sw=p;
      }
      if(!sw)continue;
      st.steward=sw.id;
      bio(sw,'Named steward of '+st.nm+' in the crown\'s name');
    }
    if(st._rt===undefined||(st.id+qi)%4===0){
      const path=findPath(st.x,st.y,cap.x,cap.y,3500);
      st._rt=path?path.length:999;
    }
    const strain=clamp(st._rt/140,0,1);
    if(sw.loyal===undefined)sw.loyal=1;
    sw.loyal=clamp(sw.loyal+0.05-strain*0.08-(f.unpaid?0.1:0)-grievance2(sw,f)*0.02,0,1);
    /* independence fires from measured weakness, distance, and ambition, never a die */
    const centerWeak=Object.keys(f.wars).length>0||(f.treasury||0)<0||(sim.day-(f.crownDay||0)<DAYS_Y*2);
    let gar=0;for(const p of res)if(p.prof==='soldier'&&!p.inArmy)gar++;
    const power=st.popC+(st.wealth||0)*0.3+gar*2;
    const capPower=cap.popC*1.5;
    if(sw.loyal<0.25&&centerWeak&&power>capPower*0.5&&sw.amb>0.5){
      logEvent('politics','The steward of '+st.nm+' renounces the crown; the road to '+cap.nm+' is long and the wages come late.',
        st.x,st.y,{p:sw.id,sett:st.id,fac:f.id},
        {actor:sw.id,why:{strain:+strain.toFixed(2),loyal:+sw.loyal.toFixed(2),unpaid:f.unpaid?1:0,distance:st._rt}});
      splitFaction(f,st,sw,'Secession');
    }
  }
}

/* ---------- 6) imperfect news: the world is known only as travelers tell it ---------- */
function capKnown(map){
  const ks=Object.keys(map);
  while(ks.length>16){
    let old=ks[0];
    for(const k of ks)if(map[k].d<map[old].d)old=k;
    delete map[old];ks.splice(ks.indexOf(old),1);
  }
}
function hearNews(dest,src){
  if(!dest||!src||dest.id===src.id)return;
  dest.known=dest.known||{};
  dest.known[src.id]={d:sim.day,pop:src.popC,prices:src.price?Array.from(src.price):null};
  /* gossip hop: the traveler repeats every stale tale he carries */
  if(src.known)for(const k in src.known){
    if(+k===dest.id)continue;
    if(!dest.known[k]||dest.known[k].d<src.known[k].d)
      dest.known[k]={d:src.known[k].d,pop:src.known[k].pop,prices:src.known[k].prices};
  }
  capKnown(dest.known);
  const df=sim.factions[dest.fac],sf=sim.factions[src.fac];
  if(df&&sf&&df.id!==sf.id){
    df.known=df.known||{};
    df.known[sf.id]={d:sim.day,pop:src.popC,
      wars:Object.keys(sf.wars).map(Number),
      leaderDead:!sim.people.get(sf.leader)};
    capKnown(df.known);
  }
  /* contact: shared roads keep tongues from drifting apart */
  if(src.fac===dest.fac||cultureOf(src)===cultureOf(dest))
    dest.contact=(dest.contact||0)+1;
}
function knownPartners(st){
  const out=[];const seen={};
  st.known=st.known||{};
  for(const k in st.known){
    const o=sim.settlements[+k];
    if(!o||o.razed)continue;
    seen[k]=1;
    out.push({st:o,prices:st.known[k].prices,ageDays:sim.day-st.known[k].d});
  }
  /* line of local sight: near neighbors are always known, and known fresh */
  for(const o of sim.settlements){
    if(o.razed||o.id===st.id||seen[o.id])continue;
    if(Math.max(Math.abs(o.x-st.x),Math.abs(o.y-st.y))<=25)
      out.push({st:o,prices:o.price?Array.from(o.price):null,ageDays:0});
  }
  return out;
}
function knownFacPop(f,gId){
  const g=sim.factions[gId];
  if(!g)return 0;
  if(f.known&&f.known[gId])return f.known[gId].pop*3;
  return facPop(g)*rf(0.6,1.5);
}

/* ---------- 7) contested succession: crowns are claimed, not inherited quietly ---------- */
function succession2(f,old,causeEv){
  if(!old)return false;
  const claim=new Map();
  const put=(p,legit)=>{
    if(!p||p.dead||p.fac!==f.id||(sim.day-p.born)<14*DAYS_Y)return;
    const c=claim.get(p.id);
    if(!c||c.legit<legit)claim.set(p.id,{p,legit});
  };
  for(const kid of(old.kids||[]))put(sim.people.get(kid),3);
  for(const par of[sim.people.get(old.fa),sim.people.get(old.mo)])
    if(par)for(const kid of(par.kids||[]))if(kid!==old.id)put(sim.people.get(kid),2);
  put(sim.people.get(old.spouse),1.5);
  let gen=null,stw=null;
  for(const p of sim.people.values()){
    if(p.fac!==f.id)continue;
    if(p.prof==='soldier'&&(!gen||p.dist>gen.dist))gen=p;
  }
  for(const st of sim.settlements){
    if(st.razed||st.fac!==f.id||st.steward===undefined)continue;
    const p=sim.people.get(st.steward);
    if(p&&p.fac===f.id&&(!stw||p.dist>stw.dist))stw=p;
  }
  put(gen,0.5);put(stw,0.5);
  if(!claim.size)return false;
  /* one pass over the realm: who stands behind whom */
  const surT={},edgeT={};
  for(const p of sim.people.values()){
    if(p.fac!==f.id)continue;
    surT[p.sur]=(surT[p.sur]||0)+1;
    if(p.frs&&p.frs.length){
      let be=null;
      for(const e of edgesOf(p))if(!be||e.s>be.s)be=e;
      if(be)edgeT[be.id]=(edgeT[be.id]||0)+1;
    }
  }
  const rows=[];
  for(const c of claim.values()){
    const sup=(surT[c.p.sur]||0)+(edgeT[c.p.id]||0);
    rows.push({p:c.p,legit:c.legit,sup,
      score:c.legit*8+c.p.dist*1.5+(c.p.wealth||0)*0.1+c.p.amb*6+sup});
  }
  rows.sort((a,b)=>b.score-a.score);
  const w=rows[0];
  f.leader=w.p.id;w.p.prof='leader';w.p.notable=true;
  f.crownDay=sim.day;f.dyn=w.p.sur;
  bio(w.p,'Took the crown of the '+facTitle(f));
  logEvent('politics',fullName(w.p)+' is crowned '+leaderTitle(f)+' of the '+facTitle(f)+'.',
    heirLoc(w.p).x,heirLoc(w.p).y,{p:w.p.id,fac:f.id},
    {actor:w.p.id,cause:causeEv,
     why:{legitimacy:w.legit,renown:+w.p.dist.toFixed(1),ambition:+w.p.amb.toFixed(2),supporters:w.sup}});
  /* a near rival with fire in the belly and a town at their back makes war */
  if(rows.length>1){
    const r=rows[1];
    if(r.score>=w.score*0.8&&r.p.amb>0.6){
      let sett=null;
      const home=sim.settlements[r.p.home];
      if(home&&!home.razed&&home.fac===f.id&&home.id!==f.capital)sett=home;
      else{
        const tally={};
        for(const p of sim.people.values())
          if(p.fac===f.id&&p.sur===r.p.sur&&p.home>=0)tally[p.home]=(tally[p.home]||0)+1;
        let bs=-1;
        for(const k in tally){
          const s2=sim.settlements[+k];
          if(s2&&!s2.razed&&s2.id!==f.capital&&tally[k]>bs){bs=tally[k];sett=s2}
        }
      }
      if(sett){
        logEvent('politics','The crown of the '+facTitle(f)+' is contested: '+fullName(w.p)+' and '+fullName(r.p)+' both claim it.',
          sett.x,sett.y,{fac:f.id,p:r.p.id},
          {actor:r.p.id,cause:causeEv,
           why:{winnerScore:+w.score.toFixed(1),rivalScore:+r.score.toFixed(1),rivalAmbition:+r.p.amb.toFixed(2)}});
        splitFaction(f,sett,r.p,'War of Succession');
      }
    }
  }
  return true;
}

/* ---------- 8) tongues drift apart where the roads fall silent ---------- */
function cultureOf(st){
  if(st.cul!==undefined)return st.cul;
  const f=sim.factions[st.fac];
  return f?f.culture:0;
}
function mutatePhon(ph){
  const on=ph.on.slice(),co=ph.co.slice(),vo=ph.vo.slice();
  for(let i=0;i<2;i++)on[ri(0,on.length-1)]=pick(NG_ONSETS);
  vo[ri(0,vo.length-1)]=pick(NG_VOWELS);
  return {on,co,vo};
}
function contactYearly(){
  const live=sim.settlements.filter(s=>!s.razed&&s.popC>0);
  for(const st of live){
    st.contact=(st.contact||0)*0.5;
    st.drift=(st.drift||0)+(st.contact<1?0.8:0);
    /* assimilation: a conquered tongue fades under forty years of shared markets */
    const f=sim.factions[st.fac];
    if(f&&st.cul!==undefined&&st.cul!==f.culture){
      if(st.contact>2)st._asY=(st._asY||0)+1;
      if((st._asY||0)>=40){
        st.cul=undefined;st._asY=0;
        logEvent('misc','The old tongue of '+st.nm+' falls silent; its folk now speak as the realm speaks.',
          st.x,st.y,{sett:st.id,fac:st.fac},{why:{yearsOfContact:40}});
      }
    }else st._asY=0;
  }
  /* cluster same-culture settlements by chains of nearness */
  const byCul=new Map();
  for(const st of live){
    const c=cultureOf(st);
    if(!byCul.has(c))byCul.set(c,[]);
    byCul.get(c).push(st);
  }
  for(const[culId,setts]of byCul){
    if(setts.length<2||!CULTURES[culId])continue;
    const seen=new Set(),clusters=[];
    for(const s0 of setts){
      if(seen.has(s0.id))continue;
      const cl=[s0];seen.add(s0.id);
      for(let i=0;i<cl.length;i++)for(const o of setts){
        if(seen.has(o.id))continue;
        if(Math.max(Math.abs(o.x-cl[i].x),Math.abs(o.y-cl[i].y))<=25){seen.add(o.id);cl.push(o)}
      }
      clusters.push(cl);
    }
    if(clusters.length<2)continue; // a lone cluster IS the culture; splitting means nothing
    for(const cl of clusters){
      let md=0;for(const s of cl)md+=(s.drift||0);md/=cl.length;
      if(md<12)continue;
      const oldC=CULTURES[culId];
      const nph=mutatePhon(oldC.ph);
      const suf=oldC.settSuf.slice();
      suf[ri(0,suf.length-1)]=wordFrom(nph,1,1).toLowerCase();
      const adj=wordFrom(nph,1,2)+'i';
      const nc={id:CULTURES.length,ph:nph,settSuf:suf,fem:oldC.fem.slice(),adj};
      CULTURES.push(nc);
      let big=cl[0];
      for(const s of cl){s.cul=nc.id;s.drift=0;if(s.popC>big.popC)big=s}
      logEvent('misc','The speech of '+big.nm+' has drifted into a tongue of its own; its folk are now called the '+adj+'.',
        big.x,big.y,{sett:big.id,fac:big.fac},
        {why:{yearsIsolated:Math.round(md/0.8),drift:+md.toFixed(1),towns:cl.length}});
      break; // one new tongue per culture per year is plenty
    }
  }
}

/* ---------- 9) inheritance: the dead hand passes the purse ---------- */
function onDeathInherit(p){
  const w=p.wealth||0;
  if(w<=0)return;
  const kids=[];
  for(const k of(p.kids||[])){const q=sim.people.get(k);if(q)kids.push(q)}
  if(kids.length){
    const share=w/kids.length;
    for(const q of kids)q.wealth=(q.wealth||0)+share;
  }else{
    const sp=sim.people.get(p.spouse);
    if(sp)sp.wealth=(sp.wealth||0)+w;
    else{
      const st=sim.settlements[p.home];
      if(st)st.wealth=(st.wealth||0)+w;
    }
  }
  p.wealth=0;
}

/* ---------- overrides: the old measures yield to the new ---------- */
grievanceOf=grievance2;
befriend=function(a,b){edgeAdd(a,b,'friend',1)};
</script>
<script>
'use strict';
/* ============ SIMULATION TICK ============ */
const SEASON_FARM=[0.9,1.3,1.5,0.35];
let pathBudget=0;

function tick(){
  sim.day++;
  pathBudget=6; // A* calls allowed this tick (visual trips)
  updateWeather();
  updateFires();
  updateCorpses();
  rebuildAnimalGrid();
  updateSettlements();
  updatePeople();
  updateAnimals();
  updateArmies();
  updateCaravans();
  updateMigrants();
  updateShips();
  if(sim.day%30===7)monthly();
  if(sim.day%90===3)quarterly();
  if(sim.day%DAYS_Y===180)yearly();
  if(sim.day%90===44)recomputeTerritory();
}

/* ---------- weather ---------- */
function updateWeather(){
  const w=sim.weather;
  if(--w.t<=0){
    const s=curSeason();
    const roll=rnd();
    if(s===3)w.type=roll<0.42?'snow':roll<0.6?'clear':'overcast';
    else if(s===0)w.type=roll<0.35?'rain':roll<0.5?'storm':'clear';
    else w.type=roll<(sim.drought?0.06:0.22)?'rain':roll<0.3?'storm':'clear';
    w.t=ri(3,9);
  }
  // dry-season and lightning ignitions
  let pIgn=0;
  if(sim.drought)pIgn=0.002;else if(curSeason()===1)pIgn=0.0006;
  if(w.type==='storm')pIgn+=0.003;
  if(pIgn&&rnd()<pIgn)igniteWildfire();
}
function igniteWildfire(){
  for(let t=0;t<30;t++){
    const x=ri(2,world.W-3),y=ri(2,world.H-3),i=y*world.W+x;
    const b=world.biome[i];
    if((b===B.FOREST||b===B.TAIGA)&&!sim.fires[i]){
      sim.fires[i]=ri(3,5);
      sim.fireEvId=logEvent('calamity','Wildfire breaks out in the forests near '+nearestSettName(x,y)+'.',x,y,undefined,
        {cause:sim.weather.type==='storm'?'a lightning strike in the storm':'a dry season turned the forest to tinder'}).id;
      toast('🔥 Wildfire near '+nearestSettName(x,y)+'.',x,y);
      return;
    }
  }
}
function updateFires(){
  const keys=Object.keys(sim.fires);
  sim._fireN=keys.length;
  if(!keys.length)return;
  const wet=sim.weather.type==='rain'||sim.weather.type==='snow'||sim.weather.type==='storm';
  const capReached=keys.length>350;
  for(const kS of keys){
    const i=+kS;
    sim.fires[i]-=wet?3:1;
    if(sim.fires[i]<=0){
      const b=world.biome[i];
      if(b===B.FOREST)world.biome[i]=B.GRASS;
      else if(b===B.TAIGA)world.biome[i]=B.TUNDRA;
      if(world.cut[i]!==4)world.cut[i]=3;
      world.variant[i]=Math.floor(rnd()*4);
      delete sim.fires[i];terrainDirty=true;
      continue;
    }
    if(capReached)continue;
    const x=i%world.W,y=(i/world.W)|0;
    for(let k=0;k<4;k++){
      const qx=x+DX8[k],qy=y+DY8[k];
      if(!inb(qx,qy))continue;
      const qi=qy*world.W+qx;
      if(sim.fires[qi]||world.cut[qi]===2||world.cut[qi]===3)continue;
      if(world.river[qi]||world.road[qi]>=ROAD_T)continue; // water and bare roads are firebreaks
      const qb=world.biome[qi];
      let flam=0;
      if(world.building[qi])flam=0.10;
      else if(qb===B.FOREST||qb===B.TAIGA)flam=wet?0.05:0.28;
      else if(qb===B.SHRUB)flam=wet?0.02:0.12;
      else if(qb===B.GRASS)flam=wet?0.01:0.05;
      if(flam&&rnd()<flam){
        if(world.building[qi])burnBuilding(qi);
        sim.fires[qi]=ri(2,4);
      }
    }
  }
}
function burnBuilding(i){
  const sid=world.settleId[i],type=world.building[i];
  world.building[i]=0;world.cut[i]=4;terrainDirty=true;
  if(sid<0)return;
  const st=sim.settlements[sid];
  if(!st||st.razed)return;
  if(type===BUILD.HOUSE)st.houses=Math.max(0,st.houses-1);
  else if(type===BUILD.FARM)st.farms=Math.max(0,st.farms-1);
  else if(type===BUILD.MARKET)st.market=0;
  else if(type===BUILD.TEMPLE)st.temple=0;
  else if(type===BUILD.KEEP)st.keep=0;
  else if(type===BUILD.WALL)st.walls=Math.max(0,st.walls-1);
  if(chance(0.25)){const v=randomResident(st);if(v)killPerson(v,'died in the fire at '+st.nm)}
  if(sim.day-(st.lastFireLog||-9999)>120){st.lastFireLog=sim.day;
    logEvent('calamity','Fire sweeps through '+st.nm+'.',st.x,st.y,{sett:st.id},{cause:getEv(sim.fireEvId)});
    toast('🔥 '+st.nm+' is burning.',st.x,st.y);
  }
}

/* ---------- settlements: economy ---------- */
function updateSettlements(){
  // livestock: fed herds feed the town; horses make it mounted
  const lv={};
  for(const a of sim.animals){
    if(a.dom===undefined)continue;
    const sp=SPECIES[a.sp];
    let r=lv[a.dom];
    if(!r){r={food:0,horse:0,txt:{}};lv[a.dom]=r}
    if(sp.name==='Cow')r.food+=0.8;
    else if(sp.name==='Pig')r.food+=0.6;
    else if(sp.name==='Horse')r.horse++;
    r.txt[sp.name]=(r.txt[sp.name]||0)+1;
  }
  for(const st of sim.settlements){
    const r=lv[st.id];
    st.hasHorse=!!(r&&r.horse);
    st.lvTxt=r?Object.entries(r.txt).map(([k,v])=>v+' '+k.toLowerCase()+(v>1?'s':'')).join(' · '):null;
    if(r&&!st.razed&&st.inv)st.inv[GX.meat]=Math.min(st.inv[GX.meat]+r.food,400+st.houses*40);
  }
  // pop cache + profession counts
  const cnt={};
  for(const st of sim.settlements){if(!st.razed){st.popC=0;cnt[st.id]={}}}
  for(const p of sim.people.values()){
    if(p.inArmy)continue;
    const c=cnt[p.home];if(!c)continue;
    sim.settlements[p.home].popC++;
    c[p.prof]=(c[p.prof]||0)+1;
  }
  for(const st of sim.settlements){
    if(st.razed)continue;
    if(!st.popC){ // empty village slowly returns to the weeds
      st.emptyDays=(st.emptyDays||0)+1;
      if(st.emptyDays>90&&!sim.migrants.some(m=>!m.dead&&m.from===st.id)){
        st.razed=true;
        for(const i of st.tiles){
          if(world.building[i]){world.building[i]=0;world.cut[i]=4;world.variant[i]=Math.floor(rnd()*4)}
          world.settleId[i]=-1;
        }
        const f0=sim.factions[st.fac];
        if(f0&&!f0.dead&&f0.capital===st.id){
          const alt=sim.settlements.find(s=>s.fac===f0.id&&!s.razed);
          if(alt)f0.capital=alt.id;
        }
        logEvent('misc',st.nm+' falls silent, abandoned to the weeds.',st.x,st.y,{sett:st.id});
        terrainDirty=true;minimapDirty=true;
        if(f0)checkFactionDeath(f0);
      }
      continue;
    }
    st.emptyDays=0;
    const c=cnt[st.id],f=sim.factions[st.fac];
    const s=curSeason();
    const irrig=(facKnows(f,'irrigation')?1.28:1)*(st.hasCanal?1.15:1);
    const wxMul=sim.drought?0.55:(sim.weather.type==='rain'?1.08:1);
    const farmers=c.farmer||0;
    const farmEff=Math.min(st.farms,farmers/1.2)*7.4*SEASON_FARM[s]*irrig*wxMul
      +(c.laborer||0)*0.9+st.popC*0.12; // gleaning and gardens fold into grain
    st.stock.wood+=(c.woodcutter||0)*1.1*(st._forestMod??1);
    st.stock.stone+=(c.miner||0)*0.75;
    st.stock.wood=Math.min(st.stock.wood,400);st.stock.stone=Math.min(st.stock.stone,400);
    const day=econDaily(st,c,farmEff,wxMul);
    if(day.short){
      st.famine++;
      if(st.famine>=50&&sim.day-(st.lastFamLog||-9999)>DAYS_Y*2){st.lastFamLog=sim.day;
        st.famEv=logEvent('calamity','Famine grips '+st.nm+'.',st.x,st.y,{sett:st.id},
          {cause:sim.drought?'a dry year withered the fields':'the fields could not feed so many'});
        if(typeof witnessSettlement==='function')witnessSettlement(st,'famine',0.5)}
      if(st.famine>30&&chance(0.03*Math.min(1,st.popC/40))){
        const victim=randomResident(st);if(victim)killPerson(victim,'starved in the famine at '+st.nm);
      }
    }else if(st.famine>0)st.famine=Math.max(0,st.famine-2);
    // plague progression
    if(st.plague){
      st.plagueT--;
      if(chance(0.10)&&st.popC>2){const v=randomResident(st);if(v){killPerson(v,'died of the plague in '+st.nm);st.plagueDead=(st.plagueDead||0)+1}}
      if(st.plagueT<=0){st.plague=0;
        logEvent('calamity','The plague burns out in '+st.nm+' after claiming '+(st.plagueDead||0)+' souls.',st.x,st.y,{sett:st.id},{cause:st.plagueEv});st.plagueDead=0}
    }
  }
}
function randomResident(st){
  const arr=[];for(const p of sim.people.values())if(p.home===st.id&&!p.inArmy)arr.push(p);
  return arr.length?pick(arr):null;
}

/* ---------- people ---------- */
const deadQ=[];
function updatePeople(){
  deadQ.length=0;
  for(const p of sim.people.values()){
    if(p.dead)continue;
    const ageY=(sim.day-p.born)/DAYS_Y;
    // mortality
    let mort=0.000018;
    if(ageY>50)mort+=(ageY-50)*0.000016;
    if(ageY>72)mort+=(ageY-72)*0.00012;
    const st=sim.settlements[p.home];
    if(st&&st.famine>25)mort+=0.00025;
    if(rnd()<mort){deadQ.push([p,'died at '+Math.floor(ageY)+(st?' in '+st.nm:'')]);continue}
    if(p.inArmy)continue;
    // profession transitions
    if(p.prof==='child'&&ageY>=16){p.prof='laborer';bio(p,'Came of age');
      if(typeof inheritMemories==='function')inheritMemories(p)} // the old wounds are told to the young
    else if(p.prof!=='leader'&&p.prof!=='elder'&&ageY>=66){p.prof='elder'}
    // movement
    if(p.path){
      const step=world.road[idx(p.x,p.y)]>=ROAD_T?2:1;
      for(let s=0;s<step&&p.path;s++)stepAlong(p);
    }else if(p.mission){
      resolveMission(p);
    }else{
      maybeStartTrip(p);
    }
  }
  for(const[p,why]of deadQ)killPerson(p,why);
}
function stepAlong(e){
  if(!e.path||e.pi>=e.path.length){e.path=null;e.pi=0;return}
  const i=e.path[e.pi++];
  e.x=i%world.W;e.y=(i/world.W)|0;
  if(e.pi>=e.path.length){e.path=null;e.pi=0}
}
function homeTile(p){
  // a family keeps one house: everyone of a surname walks back to the same door, not the town square
  const st=sim.settlements[p.home];
  if(!st||st.razed)return null;
  if(p.hst===p.home&&p.hx!==undefined){
    const i=idx(p.hx,p.hy);
    if(world.building[i]===BUILD.HOUSE&&world.settleId[i]===st.id)return{x:p.hx,y:p.hy};
  }
  const houses=[];
  for(const i of st.tiles)if(world.building[i]===BUILD.HOUSE)houses.push(i);
  if(!houses.length)return{x:st.x,y:st.y};
  const h=houses[(hashStr(p.sur||'')>>>0)%houses.length];
  p.hst=p.home;p.hx=h%world.W;p.hy=(h/world.W)|0;
  return{x:p.hx,y:p.hy};
}
function maybeStartTrip(p){
  const st=sim.settlements[p.home];
  if(!st||st.razed)return;
  const hm=homeTile(p)||{x:st.x,y:st.y};
  const atHome=Math.abs(p.x-hm.x)<=4&&Math.abs(p.y-hm.y)<=4;
  if(!atHome){ // walk home, to the family's own house
    const far=Math.max(Math.abs(p.x-hm.x),Math.abs(p.y-hm.y))>25;
    if(far&&pathBudget>0){pathBudget--;p.path=findPath(p.x,p.y,hm.x,hm.y,1500)}
    if(!p.path)p.path=greedyPath(p.x,p.y,hm.x,hm.y,40);
    if(!p.path){p.x=hm.x;p.y=hm.y} // hopelessly stuck → rejoin home
    p.pi=0;
    return;
  }
  if(sim.people.size>1800)return; // LOD: past this scale the walking is theatre the eye cannot follow
  if(!chance(0.12))return;
  // choose a destination by profession
  let target=null,r=10;
  const want=b=>{
    for(let t=0;t<14;t++){
      const x=clamp(p.x+ri(-r,r),1,world.W-2),y=clamp(p.y+ri(-r,r),1,world.H-2);
      const i=idx(x,y);
      if(b(i,world.biome[i]))return{x,y};
    }
    return null;
  };
  switch(p.prof){
    case 'hunter':{ // stalk real prey if any is in range, otherwise roam the wilds
      const prey=nearestAnimal(p.x,p.y,14,true);
      if(prey)target={x:prey.x,y:prey.y};
      else{r=14;target=want((i,b)=>b===B.FOREST||b===B.SHRUB||b===B.TAIGA)}
      break}
    case 'woodcutter':r=10;target=want((i,b)=>b===B.FOREST||b===B.TAIGA);break;
    case 'miner':r=12;target=want((i,b)=>b===B.MOUNT);break;
    case 'fisher':r=9;target=want((i,b)=>{if(world.river[i]||b===B.LAKE)return true;
        for(let k=0;k<4;k++){const q=idx(clamp(i%world.W+DX8[k],0,world.W-1),clamp(((i/world.W)|0)+DY8[k],0,world.H-1));if(world.biome[q]===B.OCEAN||world.biome[q]===B.LAKE)return true}return false});break;
    case 'farmer':{const farms=st.tiles.filter(i=>world.building[i]===BUILD.FARM);
      if(farms.length){const i=pick(farms);target={x:i%world.W,y:(i/world.W)|0}}break}
    default:{ // stroll inside the settlement
      const i=pick(st.tiles);target={x:i%world.W,y:(i/world.W)|0}}
  }
  if(!target)return;
  // fishers/etc. may target water — walk to nearest passable neighbor instead
  if(!passable(idx(target.x,target.y))){
    let ok=null;
    for(let k=0;k<8;k++){const nx=target.x+DX8[k],ny=target.y+DY8[k];
      if(inb(nx,ny)&&passable(idx(nx,ny))){ok={x:nx,y:ny};break}}
    if(!ok)return;target=ok;
  }
  const path=greedyPath(p.x,p.y,target.x,target.y,26);
  if(!path)return;
  p.path=path;p.pi=0;
  p.mission={type:'work',t:ri(2,5)};
}
function resolveMission(p){
  const m=p.mission;
  if(m.type==='work'){
    if(--m.t>0){
      // hunters may fell a beast while afield
      if(p.prof==='hunter'&&chance(0.25)){
        // a fresh kill left by wolves is meat for the taking
        const cc=nearestCorpse(p.x,p.y,3);
        if(cc&&corpseStage(cc)==='fresh'&&cc.mass>2){cc.mass-=2;bonus(p,'food',6)}
        const a=nearestAnimal(p.x,p.y,4,true);
        if(a){
          const sp=SPECIES[a.sp];
          if(sp.beast||a.legend){
            if(!fightBeast(p,a)&&chance(0.6)){deadQ.push([p,'was slain by '+(sim.beast?sim.beast.nm:'a great beast')]);return}
          }else if(sp.dangerous){
            const nm=sp.name.toLowerCase();
            if(rnd()<0.25+p.brav*0.4){removeAnimal(a);addDist(p,3,'Slew a great '+nm+' in the wilds');
              if(p.dist>=6&&chance(0.4))logEvent('life',fullName(p)+' of '+sim.settlements[p.home].nm+' slew a great '+nm+'.',p.x,p.y,{p:p.id},{actor:p.id});
              bonus(p,'food',16)}
            else if(chance(0.3)){a.manKills=(a.manKills||0)+1;noteAnimalKill(a);deadQ.push([p,'was killed by a '+nm+' while hunting']);return}
          }else if(sp.pred&&chance(0.6)){removeAnimal(a);addDist(p,1);bonus(p,'food',6)}
          else if(!sp.water){removeAnimal(a);bonus(p,'food',12)}
        }
      }
      return;
    }
    // work done → head home with a small bonus
    const st=sim.settlements[p.home];
    if(st&&!st.razed){
      if(p.prof==='woodcutter'){
        st.stock.wood+=3;
        // physically fell a tree on or beside the work site
        for(let k=-1;k<8;k++){
          const qx=p.x+(k<0?0:DX8[k]),qy=p.y+(k<0?0:DY8[k]);
          if(!inb(qx,qy))continue;
          const qi=qy*world.W+qx,qb=world.biome[qi];
          if((qb===B.FOREST||qb===B.TAIGA)&&!world.building[qi]){
            world.biome[qi]=qb===B.TAIGA?B.TUNDRA:B.GRASS;
            world.cut[qi]=1;world.variant[qi]=Math.floor(rnd()*4);
            st.stock.wood+=4;terrainDirty=true;break;
          }
        }
      }
      else if(p.prof==='miner')st.stock.stone+=2;
      else if(p.prof==='fisher'||p.prof==='hunter'){if(st.inv)st.inv[p.prof==='fisher'?GX.fish:GX.meat]+=3}
      p.path=greedyPath(p.x,p.y,st.x,st.y,40);
      p.pi=0;
    }
    p.mission=null;
  }else p.mission=null;
}
function bonus(p,what,n){
  const st=sim.settlements[p.home];
  if(!st||st.razed)return;
  if(what==='food'){if(st.inv)st.inv[p.prof==='fisher'?GX.fish:GX.meat]+=n}
  else st.stock[what]+=n;
}

function killPerson(p,why){
  if(p.dead)return;
  p.dead=true;
  passRelics(p);
  if(typeof onDeathInherit==='function')onDeathInherit(p);
  { // grief ripples through the family, in every mode
    const cause=why&&why.includes('plague')?'plague':why&&(why.includes('famine')||why.includes('starved'))?'famine':'other';
    for(const kid of[p.spouse,p.fa,p.mo,...(p.kids||[])]){
      if(!kid)continue;
      const q=sim.people.get(kid);
      if(q&&!q.dead)proOnBereavement(q,cause);
    }
  }
  const f=sim.factions[p.fac];
  // widow/orphan links
  if(p.spouse){const sp=sim.people.get(p.spouse);if(sp)sp.spouse=0}
  // soul record
  const soul={id:p.id,nm:p.nm,sur:p.sur,sex:p.sex,born:p.born,died:sim.day,prof:p.prof,fac:p.fac,
    fa:p.fa,mo:p.mo,spouse:p.spouse,kids:p.kids,notable:p.notable,dist:p.dist,bio:p.notable?p.bio:null,dead:true};
  sim.souls.set(p.id,soul);
  if(sim.souls.size>22000){ // prune eldest non-notables
    let n=0;
    for(const[k,v]of sim.souls){if(!v.notable){sim.souls.delete(k);if(++n>2000)break}}
  }
  sim.people.delete(p.id);
  if(sel&&sel.type==='person'&&sel.id===p.id)ui.refreshSoon();
  if(cam.follow&&cam.follow.type==='person'&&cam.follow.id===p.id){cam.follow=null;toast(fullName(p)+' has died. '+(why||''))}
  // leader succession
  if(f&&!f.dead&&f.leader===p.id){
    const dev=logEvent('politics',leaderTitle(f)+' '+fullName(p)+' of the '+facTitle(f)+' is dead — '+(why||'')+'.',p.x,p.y,{fac:f.id,p:p.id},{victim:p.id});
    succession(f,p,dev);
  }else if(p.notable){
    logEvent('life',fullName(p)+', '+(PROF_DEF[p.prof]?PROF_DEF[p.prof].name.toLowerCase():p.prof)+' of renown, '+(why||'has died')+'.',p.x,p.y,{p:p.id});
  }
}

function succession(f,old,causeEv){
  // contested succession: claims, power, and counted support decide the crown
  if(typeof succession2==='function'){
    if(!succession2(f,old,causeEv))checkFactionDeath(f);
    return;
  }
  checkFactionDeath(f);
}
function heirLoc(p){const st=sim.settlements[p.home];return st?{x:st.x,y:st.y}:{x:p.x,y:p.y}}

function splitFaction(f,sett,leader,label){
  const nf=newFaction(f.culture,facCoreName(f.culture));
  nf.relig=sett.religion; // knowledge lives in people now: whoever stands in the town carries the crafts
  sett.fac=nf.id;nf.capital=sett.id;
  nf.leader=leader.id;leader.prof='leader';leader.notable=true;leader.home=sett.id;nf.dyn=leader.sur;
  for(const p of sim.people.values())if(p.home===sett.id)p.fac=nf.id;
  setRel(f.id,nf.id,-80);
  declareWar(f,nf,label);
  bio(leader,'Rose in rebellion and founded the '+facTitle(nf));
  addDist(leader,5);
  const sev=logEvent('politics',label+': '+fullName(leader)+' raises banners over '+sett.nm+', founding the '+facTitle(nf)+'.',sett.x,sett.y,{fac:nf.id,p:leader.id,sett:sett.id},{actor:leader.id});
  if(f.wars[nf.id])f.wars[nf.id].ev=sev;
  recomputeTerritory();
}
function checkFactionDeath(f){
  if(f.dead)return;
  const setts=sim.settlements.filter(s=>s.fac===f.id&&!s.razed);
  let people=0;for(const p of sim.people.values())if(p.fac===f.id)people++;
  if(!setts.length||people===0){
    f.dead=true;
    for(const o of sim.factions)if(!o.dead){delete o.wars[f.id]}
    for(const a of sim.armies)if(a.fac===f.id)a.dead=true;
    logEvent('politics','The '+facTitle(f)+' has fallen; its name passes into legend.',-1,-1,{fac:f.id});
    toast('☠ The '+facTitle(f)+' has fallen.');
  }
}

/* ---------- animals ---------- */
function updateAnimals(){
  const dead=[];
  for(const a of sim.animals){
    a.age++;
    const sp=SPECIES[a.sp];
    if(!(sp.beast||a.legend)&&a.age>ri(3000,4600)){dead.push(a);continue}
    if(sp.water){
      if(chance(0.4)){
        if(sp.river){
          // salmon hold to the river, and run upstream when autumn comes
          const run=curSeason()===2;
          let bx=-1,by=-1,be=run?world.elev[idx(a.x,a.y)]:-1;
          for(let k=0;k<8;k++){
            const nx=a.x+DX8[k],ny=a.y+DY8[k];
            if(!inb(nx,ny)||world.river[idx(nx,ny)]!==1)continue;
            if(run){const e=world.elev[idx(nx,ny)];if(e>be){be=e;bx=nx;by=ny}}
            else if(chance(0.4)){bx=nx;by=ny}
          }
          if(bx>=0){a.x=bx;a.y=by}
        }else{
          const k=ri(0,7),nx=a.x+DX8[k],ny=a.y+DY8[k];

        if(world.brains&&sp.pred&&(parent.hun||0)>0.6)continue; // starving predators do not breed

}
/* ---- animal spatial hash: sensing without scanning the whole world ---- */
let AGRID=null,AGW=0;
const AG_C=12;
function rebuildAnimalGrid(){
  AGW=Math.ceil(world.W/AG_C);
  AGRID=new Map();
  for(const a of sim.animals){
    const k=((a.y/AG_C)|0)*AGW+((a.x/AG_C)|0);
    let arr=AGRID.get(k);
    if(!arr){arr=[];AGRID.set(k,arr)}
    arr.push(a);
  }
}
function nearAnimal(x,y,r,fn){
  if(!AGRID)rebuildAnimalGrid();
  const g0x=Math.max(0,((x-r)/AG_C)|0),g1x=((x+r)/AG_C)|0;
  const g0y=Math.max(0,((y-r)/AG_C)|0),g1y=((y+r)/AG_C)|0;
  let best=null,bd=1e9;
  for(let gy=g0y;gy<=g1y;gy++)for(let gx=g0x;gx<=g1x;gx++){
    const arr=AGRID.get(gy*AGW+gx);
    if(!arr)continue;
    for(const o of arr){
      if(!fn(o))continue;
      const d=Math.max(Math.abs(o.x-x),Math.abs(o.y-y));
      if(d<=r&&d<bd){bd=d;best=o}
    }
  }
  return best;
}
function nearestPredAnimal(x,y,r){
  return nearAnimal(x,y,r,o=>{const s=SPECIES[o.sp];return s.pred&&!s.water});
}
function nearestPreyAnimal(x,y,r){
  return nearAnimal(x,y,r,o=>{const s=SPECIES[o.sp];return !s.pred&&!s.water});
}

/* ---- carrion: the dead persist, feed the living, and rot at the season's pace ---- */
function spawnCorpse(a){
  const sp=SPECIES[a.sp];
  const c={id:sim.nextId++,sp:a.sp,x:a.x,y:a.y,d:sim.day,rot:0,
    mass:Math.max(1,(SP_MASS[sp.name]||6)-(a._bite||0)),cause:a._cause||'perished'};
  sim.corpses.push(c);
  if(sim.corpses.length>160)sim.corpses.shift();
  return c;
}
function corpseStage(c){return c.rot<6?'fresh':c.rot<14?'ripe':c.rot<25?'rotten':'bones'}
function updateCorpses(){
  if(!sim.corpses.length)return;
  const m=[1.0,1.4,1.0,0.3][curSeason()]; // heat ripens, cold preserves
  for(const c of sim.corpses)c.rot+=m;
  sim.corpses=sim.corpses.filter(c=>{
    const done=c.mass<=0||c.rot>=40;
    if(done){
      // the body feeds the ground: what rotted in place gives the most back
      const i=idx(c.x,c.y);
      const nut=c.rot>=40?Math.max(1,c.mass):1;
      world.moist[i]=Math.min(1,(world.moist[i]||0.5)+0.02*nut);
      if(world.cut[i]===5||world.cut[i]===3){world.cut[i]=0;terrainDirty=true} // grass springs back green
      if(world.biome[i]===B.SHRUB&&nut>=6){world.biome[i]=B.GRASS;terrainDirty=true} // rich ground turns to meadow
    }
    return !done;
  });
}
function nearestCorpse(x,y,r){
  let b=null,bd=1e9;
  for(const c of sim.corpses){
    if(c.mass<=0)continue;
    const d=Math.max(Math.abs(c.x-x),Math.abs(c.y-y));
    if(d<=r&&d<bd){bd=d;b=c}
  }
  return b;
}
function feedFromCorpse(a,c){
  const st=corpseStage(c);
  if(st==='bones'||c.mass<=0)return false;
  const bite=Math.min(3,c.mass);
  c.mass-=bite;
  a.hun=Math.max(0,(a.hun||0)-bite*0.25*(st==='rotten'?0.6:1));
  const tol=SP_SCAV[SPECIES[a.sp].name]||0.3;
  const risk=st==='rotten'?clamp(0.4-tol*0.25,0.05,0.4):st==='ripe'?0.04:0;
  if(chance(risk))a.sickD=ri(4,12); // carrion sickness: tolerance is a species trait
  a.act='feeding on a dead '+SPECIES[c.sp].name.toLowerCase();
  return true;
}

/* ---- instinct minds (classic mode): needs → weighed goals → action ----
   Every animal carries real needs and senses, weighs its goals each day,
   and acts on the winner. The weighing is kept as its chain of thought. */
const DEFG=new Float32Array([1,1,1,1]); // wariness, appetite, boldness, herd instinct
const isDrinkable=i=>{const b=world.biome[i];return b===B.LAKE||b===B.SWAMP||!!world.river[i]};
function findWaterNear(a,r){
  if(a.wx!==undefined&&Math.max(Math.abs(a.wx-a.x),Math.abs(a.wy-a.y))<=r+4&&isDrinkable(idx(a.wx,a.wy)))return true;
  for(let d=1;d<=r;d++){ // ring scan, nearest first
    for(let dx=-d;dx<=d;dx++)for(let dy=-d;dy<=d;dy+=(Math.abs(dx)===d?1:2*d)){
      const qx=a.x+dx,qy=a.y+dy;
      if(inb(qx,qy)&&isDrinkable(idx(qx,qy))){a.wx=qx;a.wy=qy;return true}
    }
  }
  return false;
}
function stepAnimal(a,dx,dy,fleeing){
  const nx=a.x+dx,ny=a.y+dy;
  if(!inb(nx,ny))return false;
  const i=idx(nx,ny);
  if(!passable(i))return false;
  if(world.settleId[i]>=0&&!fleeing&&world.settleId[i]!==a.dom)return false; // livestock may walk its own town
  a.x=nx;a.y=ny;
  a.fat=Math.min(1,(a.fat||0)+0.01);
  return true;
}
function instinctAnimalUpdate(a,sp,dead){
  if(a.genes&&!(a.genes instanceof Float32Array))a.genes=Float32Array.from(a.genes);
  const g=a.genes||DEFG;
  if(a.sickD){ // carrion sickness: weakened, hungrier, sometimes fatal
    a.sickD--;a.hun=Math.min(1,(a.hun||0)+0.006);
    if(chance(0.012)){a._cause='wasted away, sick from carrion';dead.push(a);return}
    if(chance(0.5)){a.act='sick from carrion';a.think='sick — resting';return}
  }
  a.hun=Math.min(1,(a.hun||0)+0.010);
  a.thr=Math.min(1,(a.thr||0)+0.004);
  a.fat=Math.min(1,(a.fat||0)+0.003);
  if(sim.weather.type==='rain'||sim.weather.type==='storm')a.thr*=0.3; // rain fills the puddles
  // domestic animals: the herd is home; a razed home makes them feral
  if(a.dom!==undefined){
    const hst=sim.settlements[a.dom];
    if(!hst||hst.razed||!hst.popC){a.dom=undefined}
    else{
      const dh=Math.max(Math.abs(hst.x-a.x),Math.abs(hst.y-a.y));
      if(dh>7){a.act='returning to the herd at '+hst.nm;

    }
  }
  // ---- senses ----
  let threat=0,tdx=0,tdy=0;

  if(!sp.pred){
    const pr=nearestPredAnimal(a.x,a.y,6);
    if(pr&&pr!==a){
      const d=Math.max(Math.abs(pr.x-a.x),Math.abs(pr.y-a.y));
      threat=clamp((1-d/7)*g[0],0,1.4);
      tdx=pr.x-a.x;tdy=pr.y-a.y;

    }

    outerF:

      const qx=a.x+dx,qy=a.y+dy;
      if(inb(qx,qy)&&sim.fires[idx(qx,qy)]){
        threat=Math.max(threat,1.3);tdx=dx||1;tdy=dy;
        a._tnm='fire';a.sense='smells smoke on the wind';
        break outerF;
      }
    }
  }
  const b0=world.biome[idx(a.x,a.y)];
  const grazeHere=!sp.pred&&(b0===B.GRASS||b0===B.SHRUB||b0===B.FOREST||b0===B.TUNDRA)&&world.cut[idx(a.x,a.y)]!==5;

    prey=nearestPreyAnimal(a.x,a.y,6);
    // a starving carnivore will turn on lesser carnivores
    if(!prey&&a.hun>0.8)prey=nearAnimal(a.x,a.y,6,o=>o!==a&&SPECIES[o.sp].pred&&!SPECIES[o.sp].water&&!SPECIES[o.sp].beast&&(sp.dangerous||SPECIES[o.sp].name==='Fox'));
    if(prey)a.sense='scents a '+SPECIES[prey.sp].name.toLowerCase()+', '+Math.max(Math.abs(prey.x-a.x),Math.abs(prey.y-a.y))+' tiles off';
  }
  // carrion on the wind: scavengers weigh the dead against the living
  let carc=null;

    carc=nearestCorpse(a.x,a.y,6);

    }

    eat:Math.pow(a.hun,1.3)*(sp.pred?(prey?1.4:0.2):1.1)*g[1],
    scav:carc?Math.pow(a.hun,1.2)*scavAff*(corpseStage(carc)==='fresh'?1.2:corpseStage(carc)==='ripe'?0.9:0.55):0,

    .map(([k,v])=>k+' '+v.toFixed(2)).join(' · ');

  switch(goal){
    case 'flee':
      a.act='fleeing'+(a._tnm?' the '+a._tnm:'');
      stepAnimal(a,-Math.sign(tdx),-Math.sign(tdy),true);
      stepAnimal(a,-Math.sign(tdx),-Math.sign(tdy),true);
      if(sp.fast)stepAnimal(a,-Math.sign(tdx),-Math.sign(tdy),true); // horses outrun almost anything
      break;
    case 'drink':
      if(findWaterNear(a,10)){
        a.noWater=false;
        if(Math.max(Math.abs(a.wx-a.x),Math.abs(a.wy-a.y))<=1){a.thr=0;a.act='drinking'}
        else{a.act='moving to water';stepAnimal(a,Math.sign(a.wx-a.x),Math.sign(a.wy-a.y),false)}
      }else{
        a.noWater=true;a.act='searching for water';
        if(a.wdir===undefined||chance(0.07))a.wdir=ri(0,7); // commit to a heading, cover real ground
        if(!stepAnimal(a,DX8[a.wdir],DY8[a.wdir],false))a.wdir=ri(0,7);
      }
      break;
    case 'eat':
      if(sp.pred){
        // rivals contest the same hunting ground
        const rival=nearAnimal(a.x,a.y,2,o=>o!==a&&SPECIES[o.sp].pred&&!SPECIES[o.sp].water&&!SPECIES[o.sp].beast);
        if(rival&&chance(0.2)){
          const pa=(sp.dangerous?2:1)*g[2],pb=(SPECIES[rival.sp].dangerous?2:1)*(rival.genes?rival.genes[2]:1);
          if(pa+rnd()>pb+rnd()){

            if(chance(0.08))dead.push(rival);
            else{rival.x+=Math.sign(rival.x-a.x)||1;rival.y+=Math.sign(rival.y-a.y)}
          }else{
            a.act='driven off by a '+SPECIES[rival.sp].name.toLowerCase();
            stepAnimal(a,Math.sign(a.x-rival.x)||1,Math.sign(a.y-rival.y),true);
            break;
          }
        }
        if(prey){
          const d=Math.max(Math.abs(prey.x-a.x),Math.abs(prey.y-a.y));
          if(d<=1&&chance(0.35)){
            // the herd shields its young
            let blocked=false;
            if(prey.age<500){
              const guard=nearAnimal(prey.x,prey.y,2,o=>o!==prey&&o!==a&&o.sp===prey.sp&&o.age>=600);
              if(guard&&(guard.genes?guard.genes[3]:1)>0.85&&chance(0.5)){
                blocked=true;a.act='driven off by the herd';
                guard.act='defending its young';
                if(chance(0.15)){dead.push(guard)} // sometimes the defender pays the price

              }
            }

            }
          }
          else{a.act='stalking prey';stepAnimal(a,Math.sign(prey.x-a.x),Math.sign(prey.y-a.y),false)}
        }else{
          // the shallows: bears above all know how to take salmon
          const sal=nearAnimal(a.x,a.y,2,o=>SPECIES[o.sp].river);
          if(sal&&chance(sp.name==='Bear'?0.5:0.15)){
            removeAnimal(sal);a.hun=Math.max(0,a.hun-0.5);
            a.act='fishing salmon from the shallows';
          }else{a.act='hunting for a trail';const k=ri(0,7);stepAnimal(a,DX8[k],DY8[k],false)}
        }
      }else if(grazeHere){
        a.hun*=0.45;a.act='grazing';
        if(chance(0.25)){world.cut[idx(a.x,a.y)]=5;terrainDirty=true} // the grass is really eaten
      }
      else{
        a.act='seeking pasture';
        let done=false;
        for(let k=0;k<8&&!done;k++){
          const qx=a.x+DX8[k],qy=a.y+DY8[k];
          if(!inb(qx,qy))continue;
          const qi=idx(qx,qy),qb=world.biome[qi];
          if((qb===B.GRASS||qb===B.SHRUB||qb===B.FOREST)&&world.cut[qi]!==5)done=stepAnimal(a,DX8[k],DY8[k],false);
        }
        if(!done){const k=ri(0,7);stepAnimal(a,DX8[k],DY8[k],false)}

    case 'scav':

      else{a.act='drawn to carrion';stepAnimal(a,Math.sign(carc.x-a.x),Math.sign(carc.y-a.y),false)}

    case 'rest':a.act='resting';a.fat=Math.max(0,a.fat-0.15);break;
    case 'herd':a.act='rejoining the herd';stepAnimal(a,Math.sign(mate.x-a.x),Math.sign(mate.y-a.y),false);break;
    default:a.act='roaming';{const k=ri(0,7);stepAnimal(a,DX8[k],DY8[k],false)}
  }
  // want kills, gently: this is what makes the needs and the genes matter
  if(a.hun>=1&&chance(0.010)){a._cause='starved';dead.push(a);return}
  if(a.thr>=1&&chance(0.004)){a._cause='died of thirst';dead.push(a);return}
}
function wormAnimalUpdate(a,sp,dead){
  a.hun=Math.min(1,(a.hun||0)+0.008);
  let threat=0,tdx=0,tdy=0,food=0,fdx=0,fdy=0;
  a.sense=null;
  if(a.dom!==undefined){ // livestock in worm worlds keeps its home-pull outside the brain
    const hst=sim.settlements[a.dom];
    if(!hst||hst.razed||!hst.popC)a.dom=undefined;
    else if(Math.max(Math.abs(hst.x-a.x),Math.abs(hst.y-a.y))>7){
      a.act='returning to the herd at '+hst.nm;
      const nx=a.x+Math.sign(hst.x-a.x),ny=a.y+Math.sign(hst.y-a.y);
      if(inb(nx,ny)&&passable(idx(nx,ny)))({x:a.x,y:a.y}={x:nx,y:ny});
      return;
    }
  }
  if(sp.pred){
    // a sated predator does not hunt
    if(a.hun>0.3){
      const prey=nearestPreyAnimal(a.x,a.y,6);
      if(prey){
        const d=Math.max(Math.abs(prey.x-a.x),Math.abs(prey.y-a.y));
        food=(1-d/8)*a.hun;fdx=prey.x-a.x;fdy=prey.y-a.y;
        a.sense='scents a '+SPECIES[prey.sp].name.toLowerCase()+', '+d+' tiles off';
        if(d<=1&&chance(0.35)){
          prey._cause='brought down by a '+sp.name.toLowerCase();prey._bite=3;
          dead.push(prey);a.hun=0;noteAnimalKill(a);
          a.act='devouring a '+SPECIES[prey.sp].name.toLowerCase();return}
      }else{
        const carc=nearestCorpse(a.x,a.y,6);
        if(carc&&corpseStage(carc)!=='bones'){
          if(Math.max(Math.abs(carc.x-a.x),Math.abs(carc.y-a.y))<=1){feedFromCorpse(a,carc);return}
          food=0.7;fdx=carc.x-a.x;fdy=carc.y-a.y;
          a.sense='smells carrion nearby';
        }
      }
    }
  }else{
    const pr=nearestPredAnimal(a.x,a.y,6);
    if(pr){
      const d=Math.max(Math.abs(pr.x-a.x),Math.abs(pr.y-a.y));
      threat=clamp(1-d/7,0,1);tdx=pr.x-a.x;tdy=pr.y-a.y;
      a._tnm=SPECIES[pr.sp].name.toLowerCase();
      a.sense='senses a '+a._tnm+', '+d+' tiles off';
    }
    const gi=idx(a.x,a.y),b=world.biome[gi];
    if((b===B.GRASS||b===B.SHRUB||b===B.FOREST)&&world.cut[gi]!==5){
      if(a.hun>0.3&&chance(0.3)){a.hun*=0.5;a.act='grazing';

  // the rest think on a rotation that widens at high simulation speed

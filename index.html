  $('#loadPaste').addEventListener('click',()=>{try{loadString($('#loadTxt').value.trim());$('#modal').classList.add('hidden');toast('World restored.')}catch(err){alertBox('That save could not be read: '+err.message)}});
});
function alertBox(msg){showModal('<h2>Hm.</h2><div class="note">'+esc(msg)+'</div><div class="btnrow" style="margin-top:10px"><button onclick="document.querySelector(\'#modal\').classList.add(\'hidden\')">Close</button></div>')}

/* ---------- boot ---------- */
function bootWorld(seedStr,W,H,histYears,brains,pro){
  booting=true;
  $('#genoverlay').style.display='flex';
  $('#ticker').innerHTML='';$('#toasts').innerHTML='';
  const bar=$('#genbar i'),stage=$('#genstage');
  const setP=(p,t)=>{bar.style.width=Math.round(p*100)+'%';if(t)stage.textContent=t};
  setP(0.02,'weaving the land…');
  setTimeout(()=>{
    newSim();
    generateWorld(seedStr,W,H,(t)=>setP(0.15,t));
    world.brains=!!brains;
    world.pro=!!pro;
    if(world.brains)wormInit();
    setP(0.35,'the first peoples arrive…');
    setTimeout(()=>{
      seedCivilizations(clamp(Math.round(W*H/6200),4,7));
      seedAnimals();
      recomputeTerritory();
      $('#worldname').textContent='· '+world.name;
      const total=histYears*DAYS_Y;
      let done=0;
      setP(0.4,histYears?'recording '+histYears+' years of history…':'opening the chronicle…');
      function chunk(){
        const t0=performance.now();
        while(done<total&&performance.now()-t0<220){tick();done++}
        setP(0.4+0.58*(total?done/total:1),'recording history… year '+Math.floor(done/DAYS_Y)+' of '+histYears);
        if(done<total)setTimeout(chunk,0);
        else finish();
      }
      function finish(){
        setP(1,'the chronicle opens.');
        // aim camera at the mightiest settlement
        let best=null;for(const st of sim.settlements)if(!st.razed&&(!best||st.popC>best.popC))best=st;
        if(best){cam.x=best.x;cam.y=best.y;cam.cell=16}
        $('#worldname').textContent='· '+world.name+(world.brains?' · worm minds':'')+(world.pro?' · pro':'');
        buildSpeedButtons();
        booting=false;
        terrainDirty=true;minimapDirty=true;
        setTimeout(()=>{$('#genoverlay').style.display='none';
          toast('Welcome to '+world.name+'. '+(histYears?histYears+' years have already passed — open the Chronicle to catch up.':'The founding age begins.'))},400);
      }
      chunk();
    },30);
  },30);
}

/* ---------- main loop ---------- */
let lastT=performance.now(),acc=0;
function frame(t){
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  if(world&&!booting){
    handleHeldKeys(dt);
    const sp=SPEEDS[speedIx];
    if(sp>0){
      acc+=dt*5*sp;
      const budget=performance.now()+(sp>=100?24:12);
      while(acc>=1&&performance.now()<budget){tick();acc-=1}
      if(acc>5*sp)acc=5*sp; // drop backlog
    }
    render(dt);
    // HUD
    const s=curSeason();
    $('#date').innerHTML='Year '+curYear()+' · Day '+(sim.day%DAYS_Y+1)+' · <span class="season">'+SEASONS[s]+'</span>'+
      '<span class="wx">'+({clear:s===3?'❄ clear':'☀ clear',rain:'☔ rain',storm:'⛈ storm',snow:'❄ snowfall',overcast:'☁ overcast'}[sim.weather.type]||'')+(sim.drought?' · drought':'')+'</span>';
    let warsN=0;
    for(const f of sim.factions)if(!f.dead)warsN+=Object.keys(f.wars).length;
    warsN=warsN/2;
    $('#pop').innerHTML='<b>'+sim.people.size+'</b> souls · <b>'+sim.factions.filter(f=>!f.dead).length+'</b> realms'+
      (warsN?' · <b style="color:var(--crim)">⚔ '+warsN+'</b> at war':'');
    ui._refresh-=dt;
    if(ui._refresh<=0){ui._refresh=0.7;ui.renderPanel(false)}
    drawWormRaster();
  }
  requestAnimationFrame(frame);
}
/* live view into a selected creature's nervous system */
function drawWormRaster(){
  if(!world||!world.brains||!sel||sel.type!=='animal')return;
  const cnv=document.getElementById('wormRaster');
  if(!cnv)return;
  const a=sim.animals.find(x=>x.id===sel.id);
  if(!a||SPECIES[a.sp].water)return;
  if(!a.brain)a.brain=wormNewBrain();
  const br=a.brain,g=cnv.getContext('2d');
  g.fillStyle='#0d0b08';g.fillRect(0,0,330,228);
  const cols=20;
  for(let i=0;i<WORM.n;i++){
    const cx=9+(i%cols)*16,cy=10+Math.floor(i/cols)*12;
    const cl=WORM.cls[i];
    if(br.spk[i]){
      g.fillStyle='#ffe1a0';g.fillRect(cx-3,cy-3,8,8);
    }else{
      const v=br.v[i];
      g.globalAlpha=clamp(0.15+Math.max(0,v)*0.85,0.12,1);
      g.fillStyle=cl==='0'?'#b8873c':cl==='1'?'#9184a0':'#6e8ca0';
      g.fillRect(cx-2,cy-2,6,6);
      g.globalAlpha=1;
    }
  }
  // drive bars from the real command circuits
  const bar=(y,label,val,color)=>{
    g.fillStyle='#5c5546';g.font='9px "IBM Plex Mono",monospace';g.textAlign='left';
    g.fillText(label,9,y+7);
    g.fillStyle='#241f18';g.fillRect(70,y,250,8);
    g.fillStyle=color;g.fillRect(70,y,clamp(val*8,0,1)*250,8);
  };
  bar(196,'FWD AVB·PVC',br.fwd,'#7f9150');
  bar(210,'ESC AVA·AVD',br.rev,'#e0455a');
  drawWormAnat(br);
}
/* top-down anatomical view: the worm's true body plan, translucent, firing in place */
let wormAnatBg=null;
function ensureWormAnatBg(){
  if(wormAnatBg)return wormAnatBg;
  const c=document.createElement('canvas');c.width=330;c.height=130;
  const g=c.getContext('2d');
  g.fillStyle='#0d0b08';g.fillRect(0,0,330,130);
  // translucent body silhouette, head at left
  g.beginPath();
  g.moveTo(6,64);
  g.bezierCurveTo(8,34,60,24,130,28);
  g.bezierCurveTo(210,32,302,44,326,64);
  g.bezierCurveTo(302,84,210,96,130,100);
  g.bezierCurveTo(60,104,8,94,6,64);
  g.closePath();
  g.fillStyle='rgba(190,180,160,0.05)';g.fill();
  g.strokeStyle='rgba(200,190,170,0.20)';g.lineWidth=1;g.stroke();
  // the strongest synaptic tracts, faint, colored by presynaptic class
  const X=i=>8+WORM.ax[i]*314,Y=i=>14+WORM.ay[i]*102;
  const edges=[];
  for(let p=0;p<WORM.n;p++)
    for(let k=WORM.outStart[p];k<WORM.outStart[p+1];k++)
      edges.push([Math.abs(WORM.w[k]),p,WORM.post[k]]);
  edges.sort((a,b)=>b[0]-a[0]);
  g.lineWidth=0.5;
  for(let e=0;e<Math.min(800,edges.length);e++){
    const p=edges[e][1],q=edges[e][2];
    const x1=X(p),y1=Y(p),x2=X(q),y2=Y(q);
    if(Math.abs(x1-x2)+Math.abs(y1-y2)<3)continue;
    const cl=WORM.cls[p];
    g.strokeStyle=cl==='0'?'rgba(184,135,60,0.055)':cl==='1'?'rgba(150,135,165,0.055)':'rgba(110,140,165,0.055)';
    g.beginPath();g.moveTo(x1,y1);
    g.quadraticCurveTo((x1+x2)/2,(y1+y2)/2-7,x2,y2);
    g.stroke();
  }
  g.fillStyle='#5c5546';g.font='9px "IBM Plex Mono",monospace';
  g.fillText('head',10,125);g.fillText('tail',302,125);
  g.fillText('nerve ring',34,12);g.fillText('ventral cord',150,12);
  wormAnatBg=c;
  return c;
}
function drawWormAnat(br){
  const ac=document.getElementById('wormAnat');
  if(!ac)return;
  const g=ac.getContext('2d');
  g.drawImage(ensureWormAnatBg(),0,0);
  for(let i=0;i<WORM.n;i++){
    const x=8+WORM.ax[i]*314,y=14+WORM.ay[i]*102;
    if(br.spk[i]){
      g.fillStyle='rgba(255,225,160,0.95)';
      g.beginPath();g.arc(x,y,2.6,0,7);g.fill();
      g.strokeStyle='rgba(255,225,160,0.33)';
      g.beginPath();g.arc(x,y,4.6,0,7);g.stroke();
    }else if(br.les&&br.les[i]){
      g.strokeStyle='#c04030';g.lineWidth=1;
      g.beginPath();g.moveTo(x-2.4,y-2.4);g.lineTo(x+2.4,y+2.4);
      g.moveTo(x+2.4,y-2.4);g.lineTo(x-2.4,y+2.4);g.stroke();
    }else{
      const cl=WORM.cls[i];
      g.globalAlpha=clamp(0.16+Math.max(0,br.v[i])*0.7,0.13,0.9);
      g.fillStyle=cl==='0'?'#b8873c':cl==='1'?'#9184a0':'#6e8ca0';
      g.beginPath();g.arc(x,y,1.6,0,7);g.fill();
      g.globalAlpha=1;
    }
  }
}
/* autosave every three minutes */
setInterval(()=>{
  if(!world||booting)return;
  try{localStorage.setItem('chronica_autosave',saveString())}catch(e){}
},180000);
/* keep the world alive when the tab is hidden or occluded (rAF paused) */
setInterval(()=>{
  if(!world||booting)return;
  const now=performance.now();
  if(now-lastT<700)return; // rAF is running, it owns the clock
  const dt=Math.min(2.5,(now-lastT)/1000);lastT=now;
  const sp=SPEEDS[speedIx];
  if(sp>0){
    acc+=dt*5*sp;
    const budget=performance.now()+120;
    while(acc>=1&&performance.now()<budget){tick();acc-=1}
    if(acc>5*sp)acc=5*sp;
  }
},400);
resize();
buildSpeedButtons();
setTimeout(()=>{const h=$('#hint');if(h){h.style.transition='opacity 1.5s';h.style.opacity='0'}},25000);
document.fonts.ready.then(()=>{atlas.clear();terrainDirty=true});
bootWorld(String(Math.floor(Math.random()*1e9)),240,150,40);
requestAnimationFrame(frame);
</script>

  const iv=booting?10:sp100>=100?12:sp100>=25?5:sp100>=10?2:1;
  const isSel=sel&&sel.type==='animal'&&sel.id===a.id;
  if(!(threat>0||isSel||(sim.day+a.id)%iv===0))return;
  if(!a.brain)a.brain=wormNewBrain();
  if(a.genes&&!(a.genes instanceof Float32Array))a.genes=Float32Array.from(a.genes);
  wormStep(a.brain,{threat,rear:0,food:food*(0.4+a.hun*0.6),hunger:a.hun},a.genes);
  const loco=wormLocomotion(a,a.brain,tdx,tdy,fdx,fdy);
  if(!loco){if(a.act!=='grazing')a.act='resting';return}
  a.act=loco.mode==='escape'?'fleeing'+(a._tnm?' the '+a._tnm:''):
        loco.mode==='seek'?(sp.pred?'stalking prey':'moving toward food'):
        'roaming';
  for(let s=0;s<loco.burst;s++){
    const nx=a.x+loco.dx,ny=a.y+loco.dy;
    if(!inb(nx,ny))break;
    const i=idx(nx,ny);
    if(!passable(i))break;
    if(world.settleId[i]>=0&&!threat)break; // beasts skirt the towns unless fleeing
    a.x=nx;a.y=ny;
  }
}
function nearestAnimal(x,y,r,landOnly){
  return nearAnimal(x,y,r,o=>!(landOnly&&SPECIES[o.sp].water));
}
function removeAnimal(a){const i=sim.animals.indexOf(a);if(i>=0)sim.animals.splice(i,1)}

/* ---------- armies ---------- */
function updateArmies(){
  for(const a of sim.armies){
    if(a.dead)continue;
    if(a.str<=0){disbandArmy(a,true);continue}
    // logistics: an army eats from its wagons; empty wagons and empty purses bleed men
    if(a.sup!==undefined){
      a.sup-=a.members.length;
      const f0=sim.factions[a.fac];
      if(a.sup<=0||(f0&&f0.unpaid)){
        if(a.sup<0)a.sup=0;
        const n=Math.max(1,Math.round(a.members.length*0.03));
        for(let i=0;i<n&&a.members.length;i++){
          const pid=a.members.pop();
          const p=sim.people.get(pid);
          if(p){p.inArmy=0;p.prof='soldier'}
        }
        a.str=a.members.length;
        if(a.members.length<4){disbandArmy(a,false);continue}
      }
    }
    // enemy army adjacent? battle
    const foe=sim.armies.find(o=>!o.dead&&o.fac!==a.fac&&areAtWar(a.fac,o.fac)&&Math.abs(o.x-a.x)<=1&&Math.abs(o.y-a.y)<=1);
    if(foe){fieldBattle(a,foe);continue}
    if(a.state==='march'){
      const t=sim.settlements[a.target];
      if(!t||t.razed||t.fac===a.fac||!areAtWar(a.fac,t.fac)){retreatArmy(a);continue}
      if(Math.abs(a.x-t.x)<=1&&Math.abs(a.y-t.y)<=1){a.state='siege';a.siegeT=0;
        const w0=warOf(a.fac,t.fac);
        logEvent('battle','The host of the '+facTitle(sim.factions[a.fac])+' lays siege to '+t.nm+'.',t.x,t.y,{fac:a.fac,sett:t.id},{cause:w0&&w0.ev,actor:a.gen||undefined});
        continue}
      marchStep(a,t.x,t.y);
    }else if(a.state==='siege'){
      siegeTick(a);
    }else if(a.state==='return'){
      const h=sim.settlements[a.home];
      if(!h||h.razed){disbandArmy(a,false);continue}
      if(Math.abs(a.x-h.x)<=1&&Math.abs(a.y-h.y)<=1){disbandArmy(a,false);continue}
      marchStep(a,h.x,h.y);
    }
  }
  sim.armies=sim.armies.filter(a=>!a.dead);
}
function marchStep(a,tx,ty){
  if(!a.path||a.pi>=a.path.length){
    a.path=findPath(a.x,a.y,tx,ty,4000)||greedyPath(a.x,a.y,tx,ty,60);a.pi=0;
    if(!a.path){
      if(a.state==='march'&&armyToSea(a,tx,ty))return; // no road there: take ship
      retreatArmy(a);return;
    }
  }
  let steps=world.road[idx(a.x,a.y)]>=ROAD_T?2:1;
  const hm=sim.settlements[a.home];
  if(hm&&hm.hasHorse&&steps<2)steps=2; // a mounted host rides
  for(let s=0;s<steps;s++){
    if(!a.path||a.pi>=a.path.length){a.path=null;break}
    const i=a.path[a.pi++];
    a.x=i%world.W;a.y=(i/world.W)|0;
    if(world.road[i]<250)world.road[i]+=1;
    if(world.road[i]===ROAD_T)terrainDirty=true;
  }
}
function fieldBattle(a,b){
  const fa=sim.factions[a.fac],fb=sim.factions[b.fac];
  const ta=1+(facKnows(fa,'ironwork')?0.4:facKnows(fa,'smelting')?0.2:0);
  const tb=1+(facKnows(fb,'ironwork')?0.4:facKnows(fb,'smelting')?0.2:0);
  const la=Math.max(1,Math.round(b.str*tb*rf(0.06,0.14)));
  const lb=Math.max(1,Math.round(a.str*ta*rf(0.06,0.14)));
  armyCasualties(a,la,b.fac);armyCasualties(b,lb,a.fac);
  a.fought=b.fought=true;
  if(a.str<=0||b.str<=0||chance(0.25)){
    const winner=a.str>b.str?a:b,loser=winner===a?b:a;
    const wf=sim.factions[winner.fac],lf=sim.factions[loser.fac];
    const wr=warOf(winner.fac,loser.fac);
    logEvent('battle','Battle near '+nearestSettName(a.x,a.y)+': the '+facTitle(wf)+' routs the host of the '+facTitle(lf)+
      ' ('+la+' and '+lb+' slain).',a.x,a.y,{fac:winner.fac},{cause:wr.ev,actor:winner.gen||undefined});
    wr.score+=8;
    if(winner.gen){const g=sim.people.get(winner.gen);if(g)addDist(g,3,'Won a field battle against the '+facTitle(lf))}
    if(loser.str>0)retreatArmy(loser);
  }
}
function siegeTick(a){
  const t=sim.settlements[a.target];
  if(!t||t.razed||!areAtWar(a.fac,t.fac)){retreatArmy(a);return}
  a.siegeT++;
  const f=sim.factions[a.fac],df=sim.factions[t.fac];
  const wallMul=1+t.walls*0.35+(t.keep?0.4:0);
  const defenders=Math.max(3,Math.round(t.popC*0.25*wallMul));
  const atkT=1+(facKnows(f,'ironwork')?0.4:facKnows(f,'smelting')?0.2:0);
  // daily skirmish
  armyCasualties(a,Math.max(0,Math.round(defenders*rf(0.02,0.05))),t.fac);
  const defLoss=Math.round(a.str*atkT*rf(0.02,0.05));
  for(let i=0;i<Math.min(defLoss,4);i++){const v=randomResident(t);if(v){
    if(typeof onViolentDeath==='function')onViolentDeath(v,a.fac);
    killPerson(v,'fell defending '+t.nm)}}
  if(a.str<=0){disbandArmy(a,true);return}
  if(a.siegeT>ri(10,20)&&a.str*atkT>defenders*rf(0.8,1.3)){
    // the town falls
    const w=warOf(a.fac,t.fac);w.score+=20;
    const gen=a.gen?sim.people.get(a.gen):null;
    if(t.popC<14&&chance(0.5)){
      razeSettlement(t,f);
    }else{
      conquerSettlement(t,f);
      if(gen)addDist(gen,4,'Took '+t.nm+' for the '+facTitle(f));
    }
    a.state='return';a.path=null;
    maybePeace(a.fac,t.fac);
  }else if(a.siegeT>40){retreatArmy(a)}
}
function armyCasualties(a,n,killerFac){
  for(let i=0;i<n&&a.members.length;i++){
    const pid=a.members.pop();
    const p=sim.people.get(pid);
    if(p){p.inArmy=0;
      if(killerFac!==undefined&&typeof onViolentDeath==='function')onViolentDeath(p,killerFac);
      killPerson(p,'fell in battle')}
  }
  a.str=a.members.length;
}
function retreatArmy(a){a.state='return';a.path=null;a.pi=0}
function disbandArmy(a,destroyed){
  a.dead=true;
  const h=sim.settlements[a.home];
  for(const pid of a.members){
    const p=sim.people.get(pid);
    if(p){p.inArmy=0;p.prof='soldier';
      if(h&&!h.razed){p.home=a.home;p.x=h.x;p.y=h.y;p.rx=h.x;p.ry=h.y}
      if(a.fought)addDist(p,1);
    }
  }
  if(a.gen){const g=sim.people.get(a.gen);if(g&&a.fought)bio(g,'Led a host through the war')}
}
function conquerSettlement(t,f){
  const old=sim.factions[t.fac];
  const wcause=f.wars[old.id]?f.wars[old.id].ev:undefined;
  if(typeof witnessSettlement==='function')witnessSettlement(t,'conquest',0.6,f.id);
  t.fac=f.id;t.conqDay=sim.day;t.religion=t.religion; // keep local faith
  lootRelics(t,f.id);
  for(const p of sim.people.values())if(p.home===t.id&&!p.inArmy){p.fac=f.id;
    if(chance(0.6))p.grudge=f.id} // the conquered remember
  // pop loss + loot
  const loss=Math.round(t.popC*0.12);
  for(let i=0;i<loss;i++){const v=randomResident(t);if(v)killPerson(v,'was put to the sword at '+t.nm)}
  t.wealth=(t.wealth||0)*0.4;
  if(t.inv)for(let g=0;g<9;g++)t.inv[g]*=0.6;
  const fT=sim.factions[f.id];if(fT)fT.treasury=(fT.treasury||0)+t.wealth*0.3; // the victor takes plunder
  if(old.capital===t.id){
    const alt=sim.settlements.find(s=>s.fac===old.id&&!s.razed);
    if(alt)old.capital=alt.id;
  }
  logEvent('war',t.nm+' falls to the '+facTitle(f)+'.',t.x,t.y,{fac:f.id,sett:t.id},{cause:wcause});
  toast('⚑ '+t.nm+' has fallen to the '+facTitle(f)+'.',t.x,t.y);
  checkFactionDeath(old);
  recomputeTerritory();
}
function razeSettlement(t,f){
  if(typeof witnessSettlement==='function')witnessSettlement(t,'razing',0.9,f.id);
  t.razed=true;
  const olds=sim.factions[t.fac];
  const survivors=[];
  for(const p of sim.people.values())if(p.home===t.id&&!p.inArmy)survivors.push(p);
  const other=sim.settlements.find(s=>s.fac===t.fac&&!s.razed&&s.id!==t.id);
  for(const p of survivors){
    if(other&&chance(0.7)){p.home=other.id;p.x=other.x;p.y=other.y;p.rx=other.x;p.ry=other.y;
      p.grudge=f.id} // survivors of the fire never forget
    else killPerson(p,'perished in the burning of '+t.nm);
  }
  for(const i of t.tiles){
    if(world.building[i]){world.building[i]=0;world.cut[i]=4;world.variant[i]=Math.floor(rnd()*4)}
    world.settleId[i]=-1;
  }
  logEvent('war',t.nm+' is burned to the ground by the '+facTitle(f)+'.',t.x,t.y,{fac:f.id,sett:t.id},
    {cause:f.wars[olds.id]?f.wars[olds.id].ev:undefined});
  toast('🔥 '+t.nm+' has been razed.',t.x,t.y);
  terrainDirty=true;checkFactionDeath(olds);recomputeTerritory();
}
function nearestSettName(x,y){
  let best=null,bd=1e9;
  for(const s of sim.settlements){if(s.razed)continue;
    const d=Math.abs(s.x-x)+Math.abs(s.y-y);if(d<bd){bd=d;best=s}}
  return best?best.nm:'the wilds';
}

/* ---------- wars ---------- */
function areAtWar(a,b){return !!(sim.factions[a]&&sim.factions[a].wars[b])}
function warOf(a,b){return sim.factions[a].wars[b]}
function declareWar(fa,fb,label){
  if(fa.wars[fb.id])return;
  const w={since:sim.day,score:0};
  fa.wars[fb.id]=w;fb.wars[fa.id]=w;
  setRel(fa.id,fb.id,-85);
  if(!label){
    w.ev=logEvent('war','The '+facTitle(fa)+' declares war upon the '+facTitle(fb)+'.',-1,-1,{fac:fa.id},{actor:fa.leader});
    toast('⚔ The '+facTitle(fa)+' declares war on the '+facTitle(fb)+'.');
  }
  musterArmies(fa,fb);musterArmies(fb,fa);
}
function musterArmies(f,enemy){
  for(const st of sim.settlements){
    if(st.fac!==f.id||st.razed||st.popC<16)continue;
    const target=nearestEnemySett(st,enemy.id);
    if(!target)continue;
    // pick soldiers first, then brave laborers
    const members=[];
    const cands=[];
    for(const p of sim.people.values()){
      if(p.home!==st.id||p.inArmy||p.dead)continue;
      const age=(sim.day-p.born)/DAYS_Y;
      if(age<16||age>55||p.prof==='leader')continue;
      cands.push(p);
    }
    cands.sort((a,b)=>(b.prof==='soldier'?1:0)-(a.prof==='soldier'?1:0)||b.brav-a.brav);
    const n=Math.min(cands.length,Math.max(5,Math.round(st.popC*0.22)));
    for(let i=0;i<n;i++){const p=cands[i];p.inArmy=1;members.push(p.id)}
    if(members.length<4){for(const pid of members){const p=sim.people.get(pid);if(p)p.inArmy=0}continue}
    // logistics gate: no grain, no march; wars can fail in the granary
    const need=members.length*30;
    const grainHave=st.inv?st.inv[GX.grain]:9999;
    if(grainHave<need*0.4){
      if(!f._noMarch||sim.day-f._noMarch>DAYS_Y){f._noMarch=sim.day;
        logEvent('war','The host of '+st.nm+' would not march: the granaries cannot fill the wagons.',st.x,st.y,{fac:f.id},
          {why:{grain:Math.round(grainHave),need}})}
      for(const pid of members){const p=sim.people.get(pid);if(p)p.inArmy=0}
      continue;
    }
    const sup=Math.min(need,grainHave);
    if(st.inv)st.inv[GX.grain]-=sup;
    // general: most distinguished member
    let gen=null,gd=-1;
    for(const pid of members){const p=sim.people.get(pid);if(p&&p.dist+p.brav*3>gd){gd=p.dist+p.brav*3;gen=p}}
    if(gen){addDist(gen,1,'Marched to war as captain of the host of '+st.nm)}
    sim.armies.push({id:sim.nextId++,fac:f.id,x:st.x,y:st.y,rx:st.x,ry:st.y,members,str:members.length,
      target:target.id,home:st.id,path:null,pi:0,state:'march',gen:gen?gen.id:0,fought:false,siegeT:0,sup});
  }
}
function nearestEnemySett(st,facId){
  let best=null,bd=1e9;
  for(const s of sim.settlements){
    if(s.razed||s.fac!==facId)continue;
    const d=Math.max(Math.abs(s.x-st.x),Math.abs(s.y-st.y));
    if(d<bd){bd=d;best=s}
  }
  return best;
}
function maybePeace(aId,bId){
  const fa=sim.factions[aId],fb=sim.factions[bId];
  const w=fa.wars[bId];if(!w)return;
  const dur=(sim.day-w.since)/DAYS_Y;
  if(w.score>=24||dur>4||chance(0.15)){
    delete fa.wars[bId];delete fb.wars[aId];
    setRel(aId,bId,-25);
    for(const a of sim.armies)if(!a.dead&&((a.fac===aId&&sim.settlements[a.target]&&sim.settlements[a.target].fac===bId)||(a.fac===bId&&sim.settlements[a.target]&&sim.settlements[a.target].fac===aId)))retreatArmy(a);
    logEvent('war','Peace is sworn between the '+facTitle(fa)+' and the '+facTitle(fb)+'.',-1,-1,{fac:aId},{cause:w.ev});
    toast('🕊 Peace between the '+facTitle(fa)+' and the '+facTitle(fb)+'.');
    if(world.pro){ // a war ended is a saga begun, where anyone can write
      for(const fx of[fa,fb])if(facKnows(fx,'writing')){makeBook(fx,'the War of '+fa.nm+' and '+fb.nm);break}
    }
  }
}

/* ---------- caravans & migration ---------- */
function updateCaravans(){
  for(const c of sim.caravans){
    if(c.dead)continue;
    if(!c.path||c.pi>=c.path.length){
      // arrived: exchange at the destination's prices, and news rides with the cargo
      const dest=sim.settlements[c.to];
      const src=sim.settlements[c.from];
      if(dest&&!dest.razed){
        econArrive(c,dest,src);
        if(src&&!src.razed&&typeof hearNews==='function'){hearNews(dest,src);hearNews(src,dest)}
        if(src&&dest.fac!==src.fac)setRel(dest.fac,src.fac,getRel(dest.fac,src.fac)+1.5);
        // faith & plague travel with trade
        if(c.relig>=0&&dest.religion<0&&chance(0.3)){dest.religion=c.relig;
          logEvent('faith',sim.religions[c.relig].nm+' reaches '+dest.nm+'.',dest.x,dest.y,{sett:dest.id})}
        if(c.plague&&!dest.plague&&chance(0.35)){startPlague(dest,'carried by a caravan out of '+(src?src.nm:'afar'))}
      }
      if(src)launchTradeFlagClear(src.id);
      c.dead=true;continue;
    }
    let steps=world.road[idx(c.x,c.y)]>=ROAD_T?2:1;
    const hm2=sim.settlements[c.from];
    if(hm2&&hm2.hasHorse&&steps<2)steps=2; // horse-drawn
    for(let s=0;s<steps;s++){
      if(!c.path||c.pi>=c.path.length)break;
      const i=c.path[c.pi++];
      c.x=i%world.W;c.y=(i/world.W)|0;
      if(world.road[i]<250)world.road[i]+=1;
      if(world.road[i]===ROAD_T)terrainDirty=true;
    }
  }
  sim.caravans=sim.caravans.filter(c=>!c.dead);
}
function updateMigrants(){
  for(const m of sim.migrants){
    if(m.dead)continue;
    if(!m.path||m.pi>=m.path.length){
      // arrived → found the settlement
      const sc=siteScore(m.dx,m.dy);
      let st=null;
      if(sc>0){
        st=foundSettlement(m.dx,m.dy,m.fac,m.members,undefined,m.why);
        const f=sim.factions[m.fac];
        const founder=sim.people.get(m.members[0]);
        if(founder){addDist(founder,2,'Led settlers to found '+st.nm)}
        logEvent('found','Settlers from '+ (sim.settlements[m.from]?sim.settlements[m.from].nm:'afar')+' found '+st.nm+' for the '+facTitle(f)+'.',st.x,st.y,{sett:st.id,fac:m.fac},
          {cause:m.causeEvId!==undefined?getEv(m.causeEvId):undefined,actor:founder?founder.id:undefined});
        toast('⌂ '+st.nm+' has been founded.',st.x,st.y);
      }else{
        // site taken meanwhile → walk home / merge into nearest friendly settlement
        const home=sim.settlements.find(s=>s.fac===m.fac&&!s.razed);
        if(home)for(const pid of m.members){const p=sim.people.get(pid);if(p){p.home=home.id;p.x=home.x;p.y=home.y}}
      }
      m.dead=true;continue;
    }
    const i=m.path[m.pi++];
    m.x=i%world.W;m.y=(i/world.W)|0;
    for(const pid of m.members){const p=sim.people.get(pid);if(p){p.x=m.x;p.y=m.y}}
  }
  sim.migrants=sim.migrants.filter(m=>!m.dead);
}
function startPlague(st,causeTxt){
  if(st.plague||st.razed)return;
  st.plague=1;st.plagueT=ri(120,240);st.plagueDead=0;
  st.plagueEv=logEvent('calamity','Plague breaks out in '+st.nm+'.',st.x,st.y,{sett:st.id},{cause:causeTxt});
  toast('☠ Plague breaks out in '+st.nm+'.',st.x,st.y);
}

/* ---------- monthly / quarterly / yearly ---------- */
function monthly(){
  for(const st of sim.settlements){
    if(st.razed||!st.popC)continue;
    const f=sim.factions[st.fac];
    expandSettlement(st);
    // construction
    if(st.popC>st.houses*5&&st.stock.wood>=25){st.stock.wood-=25;buildStruct(st,BUILD.HOUSE)}
    else if(st.farms<Math.ceil(st.popC/4.5)&&st.stock.wood>=12){st.stock.wood-=12;buildStruct(st,BUILD.FARM)}
    else if(!st.market&&st.popC>=25&&st.stock.wood>=30){st.stock.wood-=30;buildStruct(st,BUILD.MARKET)}
    else if(!st.temple&&st.religion>=0&&st.popC>=30&&st.stock.stone>=20){st.stock.stone-=20;buildStruct(st,BUILD.TEMPLE)}
    else if(!st.keep&&f.capital===st.id&&facKnows(f,'masonry')&&st.stock.stone>=45){st.stock.stone-=45;buildStruct(st,BUILD.KEEP)}
    else if(facKnows(f,'masonry')&&st.walls<Math.min(8,Math.floor(st.popC/12))&&st.stock.stone>=15){st.stock.stone-=15;buildStruct(st,BUILD.WALL)}
    // prices settle monthly; debts are called or repaid
    econMonthly(st);
    if(typeof householdMonthly==='function')householdMonthly(st);
    // sanitation: dense towns breed sickness in proportion to their size and crowding — cities are sinks, not fountains
    if(st.popC>120){
      const crowd2=st.popC/(st.houses*6+6);
      const rate=0.0028*(st.popC/400)*Math.max(1,crowd2);
      const roll=Math.min(12,Math.round(st.popC*rate));
      for(let k=0;k<roll;k++){
        const v=randomResident(st);
        if(!v)break;
        const ageV=(sim.day-v.born)/DAYS_Y;
        // fevers take the very young and the old first
        if(ageV<6||ageV>50||rnd()<0.55)killPerson(v,'died of a fever in the crowded lanes of '+st.nm);
      }
    }
    // migration: overcrowding or famine
    const cap=st.houses*6+8;
    if((st.popC>cap||st.famine>50)&&st.popC>20&&chance(0.35)){
      tryMigration(st);
    }
    // births: gated ONLY by local grain-days and local roofs; the world has no hidden hand
    if(foodTotal(st)>st.popC*1.4&&st.popC<st.houses*6+6){
      for(const p of sim.people.values()){
        if(p.home!==st.id||p.sex!=='f'||!p.spouse||p.inArmy)continue;
        const age=(sim.day-p.born)/DAYS_Y;
        if(age<16||age>45)continue;
        if(rnd()<0.024){
          const fa=sim.people.get(p.spouse);
          const kid=newPerson({cul:typeof cultureOf==='function'?cultureOf(st):sim.factions[p.fac].culture,
            born:sim.day,fac:p.fac,home:st.id,x:st.x,y:st.y,prof:'child',
            fa:fa?fa.id:0,mo:p.id,sur:fa?fa.sur:p.sur});
          p.kids.push(kid.id);if(fa)fa.kids.push(kid.id);
        }
      }
    }
  }
  // trade launches only where a real profit clears the road cost
  tradeMonthly();
  if(typeof knowledgeMonthly==='function')knowledgeMonthly();
  for(const f of sim.factions){
    if(f.dead)continue;
    fiscalMonthly(f);
    maybeDebase(f);
  }
  monthlySea();
  monthlyDomestic();
  if(world.pro){proMonthlyPlots();proMonthlyStress()}
}
function monthlyDomestic(){
  // taming is proximity, not dice-history: herds that graze beside the fields are folded in
  for(const st of sim.settlements){
    if(st.razed||st.popC<15)continue;
    const w=nearAnimal(st.x,st.y,8,o=>SPECIES[o.sp].dom&&o.dom===undefined);
    if(w&&chance(0.5)){
      w.dom=st.id;
      const spn=SPECIES[w.sp].name.toLowerCase();
      const key='tame'+w.sp;
      if(!st[key]){st[key]=1;
        logEvent('life','The folk of '+st.nm+' have tamed their first '+spn+'s.',st.x,st.y,{sett:st.id},
          {cause:'wild '+spn+'s grazed close beside the fields'});
      }
    }
  }
}
function tryMigration(st){
  // find a site 18..55 away
  let best=null,bs=8;
  for(let t=0;t<40;t++){
    const ang=rnd()*Math.PI*2,dist=rf(18,55);
    const x=Math.round(st.x+Math.cos(ang)*dist),y=Math.round(st.y+Math.sin(ang)*dist*0.7);
    if(!inb(x,y))continue;
    const s=siteScore(x,y);
    if(s>bs){bs=s;best={x,y}}
  }
  if(!best){trySeaMigration(st);return}
  const path=findPath(st.x,st.y,best.x,best.y,6000);
  if(!path){trySeaMigration(st);return}
  // gather families
  const members=[];
  const fams=[];
  for(const p of sim.people.values()){
    if(p.home!==st.id||p.inArmy)continue;
    const age=(sim.day-p.born)/DAYS_Y;
    if(age>=16&&age<50&&p.prof!=='leader')fams.push(p);
  }
  shuffle(fams);
  for(const p of fams){
    if(members.length>=12)break;
    members.push(p.id);
    if(p.spouse){const sp=sim.people.get(p.spouse);if(sp&&sp.home===st.id&&!members.includes(sp.id))members.push(sp.id)}
    for(const kid of p.kids){const k=sim.people.get(kid);if(k&&!k.dead&&k.home===st.id&&k.prof==='child'&&!members.includes(kid))members.push(kid)}
  }
  if(members.length<6)return;
  for(const pid of members){const p=sim.people.get(pid);if(p){p.home=-1;p.path=null;p.mission=null}}
  const why=st.famine>50?'founded fleeing the famine in '+st.nm:'founded to ease the crowding of '+st.nm;
  const dep=logEvent('misc','A band of settlers departs '+st.nm+(st.famine>50?', driven out by famine.':' seeking new land.'),st.x,st.y,{sett:st.id},
    {cause:st.famine>50?st.famEv:'there were more mouths than roofs in '+st.nm});
  sim.migrants.push({id:sim.nextId++,fac:st.fac,from:st.id,members,x:st.x,y:st.y,rx:st.x,ry:st.y,path,pi:0,dx:best.x,dy:best.y,dead:false,why,causeEvId:dep.id});
}
function assignProfessions(){
  for(const st of sim.settlements){
    if(st.razed)continue;
    const adults=[];
    for(const p of sim.people.values()){
      if(p.home!==st.id||p.inArmy)continue;
      const age=(sim.day-p.born)/DAYS_Y;
      if(p.prof==='leader')continue;
      if(age<16){p.prof='child';continue}
      if(age>=66){p.prof='elder';continue}
      adults.push(p);
    }
    const n=adults.length;if(!n)continue;
    // water / mountain access
    let hasWater=false,hasMount=false,hasForest=false;
    for(const i of st.tiles){
      const b=world.biome[i];
      if(world.river[i]||b===B.LAKE)hasWater=true;
      if(b===B.FOREST||b===B.TAIGA)hasForest=true;
    }
    for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){
      const qx=st.x+dx,qy=st.y+dy;if(!inb(qx,qy))continue;
      const b=world.biome[idx(qx,qy)];
      if(b===B.MOUNT)hasMount=true;
      if(b===B.OCEAN||b===B.LAKE)hasWater=true;
      if(b===B.FOREST||b===B.TAIGA)hasForest=true;
    }
    const f=sim.factions[st.fac];
    const atWar=Object.keys(f.wars).length>0;
    const quota=[
      ['farmer',0.40],['hunter',hasForest?0.09:0.05],['fisher',hasWater?0.09:0],
      ['woodcutter',hasForest?0.11:0.05],['miner',(hasMount||st._hasOre)?0.07:0],
      ['smith',(st._hasOre&&typeof settHasSkill==='function'&&settHasSkill(st,'smelting'))?0.05:0],
      ['soldier',atWar?0.16:0.07],['trader',st.market?0.05:0],['priest',st.temple?0.03:0]];
    shuffle(adults);
    let k=0;
    for(const[prof,share]of quota){
      const want=Math.round(n*share);
      for(let i=0;i<want&&k<n;i++,k++){
        const p=adults[k];
        if(p.prof!==prof){
          if(prof==='soldier'&&p.prof!=='soldier'&&p.prof!=='laborer'&&p.prof!=='child')bio(p,'Took up arms as a soldier of '+st.nm);
          p.prof=prof;
        }
      }
    }
    for(;k<n;k++)adults[k].prof='laborer';
  }
}
function quarterly(){
  assignProfessions();
  if(world.pro)proQuarterlySocial();
  if(typeof stewardsQuarterly==='function')stewardsQuarterly();
  // geography flags feed the economy: ore in reach, hot salt coasts
  if(typeof settGeo==='function')for(const st of sim.settlements){
    if(st.razed)continue;
    const gg=settGeo(st);
    st._hasOre=gg.ore;st._salty=gg.hot&&gg.coast;
  }
  // local scarcity: how much forest and game is actually left near each settlement
  for(const st of sim.settlements){
    if(st.razed)continue;
    let forest=0;
    for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){
      const qx=st.x+dx,qy=st.y+dy;
      if(!inb(qx,qy))continue;
      const b=world.biome[qy*world.W+qx];
      if(b===B.FOREST||b===B.TAIGA)forest++;
    }
    st._forestMod=clamp(0.15+forest/40,0.15,1);
    let game=0;
    for(const a of sim.animals){
      if(SPECIES[a.sp].water||SPECIES[a.sp].pred)continue;
      if(Math.abs(a.x-st.x)<=14&&Math.abs(a.y-st.y)<=14)game++;
    }
    st._gameMod=clamp(0.2+game/9,0.2,1);
  }
  // marriages
  for(const st of sim.settlements){
    if(st.razed)continue;
    const m=[],w=[];
    for(const p of sim.people.values()){
      if(p.home!==st.id||p.spouse||p.inArmy)continue;
      const age=(sim.day-p.born)/DAYS_Y;
      if(age<16||age>60)continue;
      (p.sex==='m'?m:w).push(p);
    }
    shuffle(m);shuffle(w);
    const nPair=Math.min(m.length,w.length);
    for(let i=0;i<nPair;i++){
      if(chance(0.4)){
        m[i].spouse=w[i].id;w[i].spouse=m[i].id;w[i].sur=m[i].sur;
        bio(m[i],'Wed '+fullName(w[i]));bio(w[i],'Wed '+fullName(m[i]));
      }
    }
  }
}
function yearly(){
  const y=curYear();
  // the forest slowly takes back what was cut, spreading in from standing trees
  {
    const W=world.W;
    for(let i=0;i<W*world.H;i++){
      const scar=world.cut[i];
      if(!scar||world.building[i])continue;
      if(scar===4){ // ruins crumble back into the land
        if(world.settleId[i]<0&&rnd()<0.03){world.cut[i]=0;terrainDirty=true}
        continue;
      }
      if(scar===2)continue; // dry lakebeds refill below, not regrow
      if(scar===5){ // grazed bare: regrowth paced by the land's own moisture
        const m=world.moist[i]||0.5;
        if(rnd()<0.25+m*0.55){world.cut[i]=0;terrainDirty=true}
        continue;
      }
      if(world.settleId[i]>=0)continue;
      const x=i%W,yy=(i/W)|0;
      let adjF=0,adjT=0;
      for(let k=0;k<4;k++){
        const qx=x+DX8[k],qy=yy+DY8[k];
        if(!inb(qx,qy))continue;
        const b=world.biome[qy*W+qx];
        if(b===B.FOREST)adjF++;else if(b===B.TAIGA)adjT++;
      }
      const pGrow=(adjF+adjT)?0.10:0.015;
      if(rnd()<pGrow){
        world.biome[i]=adjT>adjF?B.TAIGA:B.FOREST;
        world.cut[i]=0;world.variant[i]=Math.floor(rnd()*4);
        terrainDirty=true;
      }
    }
  }
  // lakes recede under heavy use and refill in kind years
  for(const st of sim.settlements){
    if(st.razed||(st.popC||0)<35)continue;
    const pDry=Math.min(0.5,st.popC/150)*(sim.drought?1.8:1)*(st.hasCanal?1.3:1);
    if(!chance(pDry))continue;
    let found=-1;
    outer:
    for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){
      const qx=st.x+dx,qy=st.y+dy;
      if(!inb(qx,qy))continue;
      const qi=qy*world.W+qx;
      if(world.biome[qi]!==B.LAKE)continue;
      for(let k=0;k<4;k++){const tx=qx+DX8[k],ty=qy+DY8[k];
        if(inb(tx,ty)&&!isWater(world.biome[ty*world.W+tx])){found=qi;break outer}}
    }
    if(found>=0){
      world.biome[found]=B.SWAMP;world.cut[found]=2;world.river[found]=0;
      terrainDirty=true;minimapDirty=true;
      if(sim.day-(st.lastLakeLog||-99999)>DAYS_Y*8){st.lastLakeLog=sim.day;
        logEvent('misc','The lake by '+st.nm+' is receding, drained by fields and thirsty crowds.',st.x,st.y,{sett:st.id})}
    }
  }
  if(!sim.drought){
    const W3=world.W;
    for(let i=0;i<W3*world.H;i++){
      if(world.cut[i]!==2)continue;
      const x=i%W3,yy=(i/W3)|0;
      let adjLake=false;
      for(let k=0;k<4;k++){const qx=x+DX8[k],qy=yy+DY8[k];
        if(inb(qx,qy)&&world.biome[qy*W3+qx]===B.LAKE){adjLake=true;break}}
      if(adjLake&&rnd()<0.12){world.biome[i]=B.LAKE;world.cut[i]=0;terrainDirty=true;minimapDirty=true}
    }
  }
  // canals: irrigated realms bring the water to the fields
  for(const st of sim.settlements){
    if(st.razed||st.hasCanal||(st.popC||0)<35)continue;
    const f2=sim.factions[st.fac];
    if(!f2||f2.dead||!facKnows(f2,'irrigation'))continue;
    let close=false;
    for(let dy=-3;dy<=3&&!close;dy++)for(let dx=-3;dx<=3;dx++){
      const qx=st.x+dx,qy=st.y+dy;
      if(!inb(qx,qy))continue;
      const qi=qy*world.W+qx;
      if(world.river[qi]===1||world.biome[qi]===B.LAKE){close=true;break}
    }
    if(close){st.hasCanal=true;continue} // riverside towns are already watered
    let src=null,bd2=1e9;
    for(let dy=-14;dy<=14;dy++)for(let dx=-14;dx<=14;dx++){
      const qx=st.x+dx,qy=st.y+dy;
      if(!inb(qx,qy))continue;
      const qi=qy*world.W+qx;
      if(world.river[qi]===1||world.biome[qi]===B.LAKE){
        const d=Math.max(Math.abs(dx),Math.abs(dy));
        if(d<bd2){bd2=d;src={x:qx,y:qy}}
      }
    }
    if(!src)continue;
    let cx=src.x,cy=src.y;const dug=[];
    let blocked=false;
    for(let s2=0;s2<20;s2++){
      if(Math.max(Math.abs(cx-st.x),Math.abs(cy-st.y))<=2)break;
      cx+=Math.sign(st.x-cx);cy+=Math.sign(st.y-cy);
      const ci=cy*world.W+cx;
      const cb=world.biome[ci];
      if(isWater(cb)||world.river[ci])continue;
      if(world.building[ci]||cb===B.MOUNT||cb===B.PEAK){blocked=true;break}
      world.river[ci]=2;if(world.cut[ci]&&world.cut[ci]!==4)world.cut[ci]=0;
      dug.push(ci);
    }
    if(!blocked&&dug.length>=2){
      st.hasCanal=true;st.canals=dug;st.stock.wood=Math.max(0,st.stock.wood-10);
      terrainDirty=true;
      logEvent('tech',st.nm+' digs a canal to bring water to its fields.',st.x,st.y,{sett:st.id});
    }else{
      for(const ci of dug)world.river[ci]=0;
    }
  }
  // canals of dead towns silt up
  for(const st of sim.settlements){
    if(!st.razed||!st.canals||!st.canals.length)continue;
    for(let j=st.canals.length-1;j>=0;j--){
      if(chance(0.25)){
        const ci=st.canals[j];
        if(world.river[ci]===2)world.river[ci]=0;
        st.canals.splice(j,1);terrainDirty=true;
      }
    }
  }
  // ---- diplomacy drift ----
  const live=sim.factions.filter(f=>!f.dead);
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.wars[b.id]){
      // long wars trend to peace
      maybePeace(a.id,b.id);
      continue;
    }
    let r=getRel(a.id,b.id);
    // border tension: closest settlements of each realm
    let dMin=1e9;
    for(const sa of sim.settlements){if(sa.razed||sa.fac!==a.id)continue;
      for(const sb of sim.settlements){if(sb.razed||sb.fac!==b.id)continue;
        const d=Math.max(Math.abs(sa.x-sb.x),Math.abs(sa.y-sb.y));if(d<dMin)dMin=d}}
    if(dMin<26)r-=6;else if(dMin<42)r-=3;
    if(a.relig>=0&&a.relig===b.relig)r+=3;else if(a.relig>=0&&b.relig>=0&&a.relig!==b.relig)r-=3;
    r+=ri(-6,5);
    const la=sim.people.get(a.leader),lb=sim.people.get(b.leader);
    if(la&&la.amb>0.75)r-=2;if(lb&&lb.amb>0.75)r-=2;
    // border raids sour things further
    if(r<-20&&dMin<40&&chance(0.22)){
      r-=8;
      const side=chance(0.5)?a.id:b.id;
      const vs=sim.settlements.filter(s=>!s.razed&&s.fac===side);
      const victim=vs.length?pick(vs):null;
      if(victim){const raider=victim.fac===a.id?b:a;
        if(victim.inv)victim.inv[GX.grain]=Math.max(0,victim.inv[GX.grain]-40);
        logEvent('war','Raiders out of the '+facTitle(raider)+' burn farms near '+victim.nm+'.',victim.x,victim.y,{sett:victim.id})}
    }
    setRel(a.id,b.id,r);
  }
  proYearlyWars(live); // every war, in every mode, needs a real casus belli
  // ongoing wars: fresh hosts take the field each year
  for(const f of live){
    for(const eidS of Object.keys(f.wars)){
      const enemy=sim.factions[+eidS];
      if(!enemy||enemy.dead)continue;
      const hasArmy=sim.armies.some(ar=>!ar.dead&&ar.fac===f.id);
      if(!hasArmy&&chance(0.7))musterArmies(f,enemy);
    }
  }
  // rebellion by dice is gone in every mode: provinces break away through
  // stewards whose loyalty was ground down (stewardsQuarterly) and, in pro
  // worlds, through plots recruited person by person (proMonthlyPlots).
  // faith
  if(!world.pro&&chance(Math.min(0.12,sim.people.size/6000))){
    let prophet=null,bp=-1;
    for(const p of sim.people.values()){
      const age=(sim.day-p.born)/DAYS_Y;
      if(age<20||age>60||p.inArmy||p.home<0)continue;
      if(p.pie>bp){bp=p.pie;prophet=p}
    }
    if(prophet&&bp>0.8){
      const rel={id:sim.religions.length,nm:religionName(sim.factions[prophet.fac].culture),color:'#b9a2d6',founder:prophet.id,founded:sim.day};
      sim.religions.push(rel);
      const st=sim.settlements[prophet.home];
      if(st){st.religion=rel.id}
      prophet.prof='priest';prophet.notable=true;addDist(prophet,6,'Received a vision and founded '+rel.nm);
      logEvent('faith',fullName(prophet)+' proclaims '+rel.nm+(st?' in '+st.nm:'')+'.',st?st.x:-1,st?st.y:-1,{p:prophet.id,sett:st?st.id:undefined},{actor:prophet.id});
      toast('☨ '+rel.nm+' has been founded.');
    }
  }
  // religion spread between neighbouring settlements + faction adoption
  for(const st of sim.settlements){
    if(st.razed||st.religion<0)continue;
    for(const o of sim.settlements){
      if(o.razed||o.religion>=0)continue;
      const d=Math.max(Math.abs(st.x-o.x),Math.abs(st.y-o.y));
      if(d<30&&chance(0.15)){o.religion=st.religion;
        logEvent('faith',sim.religions[st.religion].nm+' takes root in '+o.nm+'.',o.x,o.y,{sett:o.id})}
    }
  }
  for(const f of live){
    if(f.relig>=0)continue;
    const cap=sim.settlements[f.capital];
    if(cap&&cap.religion>=0){f.relig=cap.religion;
      logEvent('faith','The '+facTitle(f)+' embraces '+sim.religions[cap.religion].nm+'.',cap.x,cap.y,{fac:f.id})}
  }
  // knowledge lives in people: rebuilt, taught, and sometimes buried with its last master
  for(const f of live)f._pop=facPop(f);
  if(typeof knowledgeYearly==='function')knowledgeYearly();
  if(typeof memoryYearly==='function')memoryYearly();
  if(typeof contactYearly==='function')contactYearly();
  moneyYearly();
  // locally extinct species wander back in from beyond the map
  {
    const count={};
    for(const a of sim.animals)count[a.sp]=(count[a.sp]||0)+1;
    for(let s=0;s<SPECIES.length;s++){
      const sp=SPECIES[s];
      if(sp.beast)continue; // legends do not migrate in from the map edge
      if((count[s]||0)>0||!chance(0.3))continue;
      let placed=0;
      for(let t=0;t<200&&placed<ri(2,4);t++){
        const edge=ri(0,3);
        const x=edge<2?(edge?world.W-ri(2,12):ri(2,12)):ri(2,world.W-3);
        const y=edge<2?ri(2,world.H-3):(edge===2?ri(2,12):world.H-ri(2,12));
        const b=world.biome[idx(x,y)];
        if(sp.biomes.includes(b)){
          sim.animals.push({id:sim.nextId++,sp:s,x,y,rx:x,ry:y,age:ri(0,600),path:null,pi:0,hp:1});
          placed++;
        }
      }
      if(placed)logEvent('misc',sp.name+'s have wandered back into '+world.name+' from beyond the known world.');
    }
  }
  // drought
  sim.drought=chance(0.07);
  if(sim.drought)logEvent('calamity','A dry year: crops wither across '+world.name+'.');
  // pestilence breeds where crowding and trade links are real, never from a world-count
  for(const st of sim.settlements){
    if(st.razed||st.plague||st.popC<50)continue;
    const crowd=st.popC/(st.houses*6+6);
    const links=st.trade?Object.keys(st.trade.partners).length:0;
    if(crowd>1.15&&links>=2&&chance(0.02*crowd)){
      startPlague(st,'filth and crowding in its packed lanes, with '+links+' roads bringing strangers');
      break;
    }
  }
  // stats sample
  const s=sim.stats;
  s.yr.push(y);s.pop.push(sim.people.size);s.wild.push(sim.animals.length);
  s.setts.push(sim.settlements.filter(x=>!x.razed).length);
  for(const f of sim.factions){
    if(!s.fac[f.id])s.fac[f.id]=[];
    // pad series to align
    while(s.fac[f.id].length<s.yr.length-1)s.fac[f.id].push(0);
    s.fac[f.id].push(f.dead?0:(f._pop||0));
  }
  if(s.yr.length>1200){s.yr.shift();s.pop.shift();s.wild.shift();s.setts.shift();
    for(const k in s.fac)s.fac[k].shift()}
  yearlyExtras();
  minimapDirty=true;
}
function facPopCached(f){return f._pop!==undefined?f._pop:facPop(f)}
</script>
<script>
'use strict';
/* ============ RENDERER ============ */
const cv=$('#map'),ctx=cv.getContext('2d');
let DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  terrainDirty=true;
}
addEventListener('resize',resize);

/* glyph atlas */
let atlas=new Map(),atlasCell=0;
function glyphTile(ch,color){
  const key=ch+'|'+color;
  let t=atlas.get(key);
  if(!t){
    const c=document.createElement('canvas');
    const px=Math.ceil(atlasCell*DPR);
    c.width=px;c.height=px;
    const g=c.getContext('2d');
    g.font=Math.round(atlasCell*0.92*DPR)+'px "IBM Plex Mono",Menlo,Consolas,monospace';
    g.textAlign='center';g.textBaseline='middle';
    g.fillStyle=color;
    g.fillText(ch,px/2,px/2+px*0.04);
    t=c;atlas.set(key,t);
  }
  return t;
}
function ensureAtlas(cell){if(atlasCell!==cell){atlasCell=cell;atlas.clear()}}

/* terrain layer cache */
const terrCv=document.createElement('canvas'),terrCtx=terrCv.getContext('2d');
let terrAnchor={x:-9999,y:-9999,cell:0,season:-1,phase:-1};
function hexA(hex,a){ // hex → rgba string
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function viewRange(){
  const cell=cam.cell;
  const cols=Math.ceil(cv.width/DPR/cell)+2,rows=Math.ceil(cv.height/DPR/cell)+2;
  const tx0=Math.floor(cam.x-cols/2),ty0=Math.floor(cam.y-rows/2);
  return{tx0,ty0,cols,rows,cell};
}
function renderTerrain(vr,season,phase){
  const{tx0,ty0,cols,rows,cell}=vr;
  if(!terrainDirty&&terrAnchor.x===tx0&&terrAnchor.y===ty0&&terrAnchor.cell===cell&&terrAnchor.season===season&&terrAnchor.phase===phase)return;
  terrAnchor={x:tx0,y:ty0,cell,season,phase};terrainDirty=false;
  const px=Math.ceil(cell*DPR);
  const needW=cols*px,needH=rows*px;
  if(terrCv.width!==needW||terrCv.height!==needH){terrCv.width=needW;terrCv.height=needH}
  const g=terrCtx;
  g.fillStyle='#131009';g.fillRect(0,0,needW,needH);
  const drawGlyphs=cell>=5;
  ensureAtlas(cell);
  for(let ry=0;ry<rows;ry++){
    const y=ty0+ry;
    for(let rx=0;rx<cols;rx++){
      const x=tx0+rx;
      const gx=rx*px,gy=ry*px;
      if(!inb(x,y)){g.fillStyle='#0e0b09';g.fillRect(gx,gy,px,px);continue}
      const i=y*world.W+x;
      const b=world.biome[i],def=BIOME_DEF[b];
      // background
      let bg=def.bg;
      if(world.river[i])bg=RIVER_BG;
      g.fillStyle=bg;g.fillRect(gx,gy,px,px);
      // territory tint
      const t=world.terrId[i];
      if(t>=0){
        const st=sim.settlements[t];
        if(st&&!st.razed){
          const f=sim.factions[st.fac];
          g.fillStyle=hexA(f.color,cell<=7?0.13:0.07);
          g.fillRect(gx,gy,px,px);
        }
      }
      if(!drawGlyphs){ // far zoom: colored blocks
        g.fillStyle=def.mini;
        if(world.river[i])g.fillStyle=world.river[i]===2?'#3f6a60':'#2a4356';
        g.fillRect(gx,gy,px,px);
        if(ui.showRoads&&world.road[i]>=ROAD_T){g.fillStyle=world.river[i]?'#a89a7d':'#8a8178';g.fillRect(gx,gy,px,px)}
        if(world.building[i]){g.fillStyle='#c2b6a3';g.fillRect(gx,gy,px,px)}
        continue;
      }
      // glyph
      let ch,fg;
      const bld=world.building[i];
      const v=world.variant[i];
      if(bld){
        const bdf=BUILD_DEF[bld];
        if(bld===BUILD.FARM){
          // fields follow the farming year, and sway a little in the growing season
          ch=((season===0||season===1)&&(v+phase)%2===0)?'=':FARM_G[season];
          fg=FARM_FG[season];
        }else{ch=bdf.g;fg=bdf.fg}
      }else if(world.road[i]>=ROAD_T&&(ui.showRoads||world.river[i])){
        ch=world.river[i]?'=':'∙';fg=world.river[i]?BRIDGE_FG:ROAD_FG;
      }else if(world.river[i]){
        ch=(v+phase)%2?'≈':'~';fg=world.river[i]===2?CANAL_FG:RIVER_FG[season];
      }else if(world.resource[i]&&(b===B.GRASS||b===B.SHRUB||b===B.MOUNT||b===B.OCEAN)&&!world.cut[i]){
        const rd=RES_DEF[world.resource[i]];ch=rd.g;fg=rd.fg;
      }else if(world.cut[i]){
        const sc=world.cut[i];
        if(sc===5){ch='.';fg='#7a6f52'}                          // grazed bare
        else if(sc===2){ch='~';fg=SCAR_MUD_FG}                   // dry lakebed
        else if(sc===3){ch=BURN_G[v%3];fg=SCAR_BURN_FG}         // burn scar
        else if(sc===4){ch=RUIN_G[v%4];fg=SCAR_RUIN_FG}         // ruins
        else{ch=[',','τ','.','τ'][v%4];fg=season===3?'#8b8e93':'#8a7a4e'} // stumps
      }else{
        ch=def.glyphs[(isWater(b)?v+phase:v)%def.glyphs.length];
        fg=def.fg[season];
        // winter: snow-dust cold-belt land
        if(season===3&&(b===B.GRASS||b===B.SHRUB||b===B.FOREST||b===B.TAIGA||b===B.TUNDRA)){
          const lat=Math.abs(y-world.H/2)/(world.H/2);
          if(lat>0.45&&v!==1)fg='#aab4be';
        }
        if(b===B.MOUNT)ch=world.elev[i]>0.56?'▲':'▒';
      }
      g.drawImage(glyphTile(ch,fg),gx,gy);
    }
  }
}

/* entity drawing helpers */
function drawGlyphAt(g,ch,color,wx,wy,vr,bg){
  const px=Math.ceil(vr.cell*DPR);
  const gx=Math.round((wx-vr.tx0)*px),gy=Math.round((wy-vr.ty0)*px);
  if(gx<-px||gy<-px||gx>cv.width||gy>cv.height)return;
  if(bg){ctx.fillStyle=bg;ctx.fillRect(gx,gy,px,px)}
  ctx.drawImage(glyphTile(ch,color),gx,gy);
}
function smooth(e,dt){
  const k=Math.min(1,dt*10);
  e.rx+=(e.x-e.rx)*k;e.ry+=(e.y-e.ry)*k;
  if(Math.abs(e.x-e.rx)>3)e.rx=e.x;
  if(Math.abs(e.y-e.ry)>3)e.ry=e.y;
}
let wxParticles=[];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(dt){
  if(!world)return;
  const season=curSeason();
  // follow camera
  if(cam.follow){
    const e=followEntity();
    if(e){cam.x=lerp(cam.x,e.rx+0.5,Math.min(1,dt*6));cam.y=lerp(cam.y,e.ry+0.5,Math.min(1,dt*6))}
    else cam.follow=null;
  }
  if(avatarMode&&avatar){smooth(avatar,dt);cam.x=lerp(cam.x,avatar.rx+0.5,Math.min(1,dt*6));cam.y=lerp(cam.y,avatar.ry+0.5,Math.min(1,dt*6))}
  const vr=viewRange();
  // slow ambient phase: water shimmers, fields sway; free below shimmer zoom and under reduced motion
  const phase=(reduceMotion||vr.cell<8)?0:Math.floor(performance.now()/700)%4;
  renderTerrain(vr,season,phase);
  // blit terrain
  const px=Math.ceil(vr.cell*DPR);
  const offX=Math.round((vr.tx0-(cam.x-vr.cols/2))* -px - (vr.cols/2*px - cv.width/2)+ (vr.tx0-(cam.x-vr.cols/2))*0);
  // simpler: compute screen pos of tile tx0
  const sx0=Math.round((vr.tx0-cam.x)*px+cv.width/2);
  const sy0=Math.round((vr.ty0-cam.y)*px+cv.height/2);
  ctx.fillStyle='#0e0b09';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(terrCv,sx0,sy0);
  // world→screen for entities: reuse vr but with screen offset
  const evr={tx0:vr.tx0-sx0/px,ty0:vr.ty0-sy0/px,cell:vr.cell};
  ensureAtlas(vr.cell);
  const showEnt=vr.cell>=5;
  // animals
  if(showEnt)for(const a of sim.animals){
    smooth(a,dt);
    const sp=SPECIES[a.sp];
    if(sp.beast||a.legend)drawGlyphAt(ctx,a.legend?sp.g.toUpperCase():sp.g,'#ffb0a0',a.rx,a.ry,evr,'#4a1410');
    else drawGlyphAt(ctx,sp.g,sp.c,a.rx,a.ry,evr);
  }
  // the dead lie where they fell: struck-through, dimming as they rot
  if(showEnt)for(const c of sim.corpses){
    if(c.x<vr.tx0-1||c.y<vr.ty0-1||c.x>vr.tx0+vr.cols||c.y>vr.ty0+vr.rows)continue;
    const stg=corpseStage(c);
    const col=stg==='fresh'?'#a99f8a':stg==='ripe'?'#8f8776':stg==='rotten'?'#6f6a5f':'#55504a';
    drawGlyphAt(ctx,SPECIES[c.sp].g,col,c.x,c.y,evr);
    const gx=Math.round((c.x-evr.tx0)*px),gy=Math.round((c.y-evr.ty0)*px);
    ctx.strokeStyle='rgba(176,80,60,0.85)';ctx.lineWidth=Math.max(1,px*0.07);
    ctx.beginPath();ctx.moveTo(gx+px*0.15,gy+px*0.58);ctx.lineTo(gx+px*0.85,gy+px*0.42);ctx.stroke();
  }
  // ships sail at every zoom
  for(const s of sim.ships){
    smooth(s,dt);
    const c=s.kind==='fisher'?'#6e9ca8':s.kind==='trade'?'#c2a05a':s.kind==='war'?sim.factions[s.fac].color:'#a9c08a';
    drawGlyphAt(ctx,'⊳',c,s.rx,s.ry,evr,s.kind==='war'?'#38160e':undefined);
  }
  // people
  if(showEnt)for(const p of sim.people.values()){
    if(p.inArmy||p.home<0&&!p.path&&false)continue;
    if(p.inArmy)continue;
    smooth(p,dt);
    if(p.rx<vr.tx0-1||p.ry<vr.ty0-1||p.rx>vr.tx0+vr.cols||p.ry>vr.ty0+vr.rows)continue;
    const isSel=(sel&&sel.type==='person'&&sel.id===p.id);
    const isFollow=cam.follow&&cam.follow.type==='person'&&cam.follow.id===p.id;
    let ch,c;
    if(p.prof==='leader'){ch='@';c=PROF_DEF.leader.c}
    else if(p.prof==='child'){ch='•';c=PROF_DEF.child.c}
    else{ch='☺';c=(PROF_DEF[p.prof]||PROF_DEF.laborer).c}
    if(isFollow||isSel){drawGlyphAt(ctx,ch,'#fff',p.rx,p.ry,evr,'#e0455a')}
    else drawGlyphAt(ctx,ch,c,p.rx,p.ry,evr);
  }
  // migrants & caravans & armies (always shown, even far zoom)
  for(const m of sim.migrants){smooth(m,dt);drawGlyphAt(ctx,'☺',sim.factions[m.fac].color,m.rx,m.ry,evr,'#241d16')}
  for(const c of sim.caravans){smooth(c,dt);drawGlyphAt(ctx,'¤','#c2a05a',c.rx,c.ry,evr)}
  for(const a of sim.armies){
    smooth(a,dt);
    const f=sim.factions[a.fac];
    const isSel=sel&&sel.type==='army'&&sel.id===a.id;
    drawGlyphAt(ctx,'☻',isSel?'#fff':f.color,a.rx,a.ry,evr,isSel?'#e0455a':'#241d16');
  }
  // burning tiles flicker fast, with smoke rising
  {
    const fkeys=Object.keys(sim.fires);
    if(fkeys.length){
      const fph=Math.floor(performance.now()/150);
      for(const kS of fkeys){
        const i=+kS,fx=i%world.W,fy=(i/world.W)|0;
        if(fx<vr.tx0-1||fy<vr.ty0-1||fx>vr.tx0+vr.cols||fy>vr.ty0+vr.rows)continue;
        drawGlyphAt(ctx,FIRE_G[(i+fph)%4],(i+fph)%2?'#e0763a':'#e0455a',fx,fy,evr,'#38160e');
        if(vr.cell>=10&&!reduceMotion)drawGlyphAt(ctx,'~','#6e675c',fx+((fph+i)%3-1)*0.2,fy-1,evr);
      }
    }
  }
  // chimney smoke drifting over lived-in houses
  if(vr.cell>=12&&!reduceMotion){
    const sph=Math.floor(performance.now()/900);
    for(const st of sim.settlements){
      if(st.razed||!st.popC)continue;
      if(st.x<vr.tx0-12||st.x>vr.tx0+vr.cols+12||st.y<vr.ty0-12||st.y>vr.ty0+vr.rows+12)continue;
      for(const i of st.tiles){
        if(world.building[i]!==BUILD.HOUSE||(i+sph)%4!==0)continue;
        const hx=i%world.W,hy=(i/world.W)|0;
        drawGlyphAt(ctx,'~','#5f5950',hx+((sph+i)%3-1)*0.15,hy-0.8,evr);
      }
    }
  }
  // avatar
  if(avatar)drawGlyphAt(ctx,'@','#fff',avatar.rx,avatar.ry,evr,'#e0455a');
  // settlement markers + labels
  if(vr.cell>=8&&ui.labels){
    ctx.font=Math.round(10*DPR)+'px "IBM Plex Mono",monospace';
    ctx.textAlign='center';
    for(const st of sim.settlements){
      if(st.razed)continue;
      if(st.x<vr.tx0-4||st.x>vr.tx0+vr.cols+4||st.y<vr.ty0-3||st.y>vr.ty0+vr.rows+3)continue;
      const gx=(st.x+0.5-evr.tx0)*px,gy=(st.y-evr.ty0)*px;
      const f=sim.factions[st.fac];
      ctx.fillStyle='rgba(14,11,9,0.72)';
      const label=st.nm+(sim.factions[st.fac].capital===st.id?' ✶':'');
      const tw=ctx.measureText(label).width;
      ctx.fillRect(gx-tw/2-4,gy-16*DPR,tw+8,13*DPR);
      ctx.fillStyle=f.color;
      ctx.fillText(label,gx,gy-6*DPR);
    }
  }
  // selection marker on tile
  if(sel&&sel.type==='tile'){
    const gx=(sel.x-evr.tx0)*px,gy=(sel.y-evr.ty0)*px;
    ctx.strokeStyle='#e0455a';ctx.lineWidth=2*DPR;
    ctx.strokeRect(gx+1,gy+1,px-2,px-2);
  }
  if(sel&&sel.type==='sett'){
    const st=sim.settlements[sel.id];
    if(st){const gx=(st.x-evr.tx0)*px,gy=(st.y-evr.ty0)*px;
      ctx.strokeStyle='#e0455a';ctx.lineWidth=2*DPR;
      ctx.strokeRect(gx-px*2,gy-px*2,px*5,px*5)}
  }
  // season tint + weather
  if(season===3){ctx.fillStyle='rgba(185,205,235,0.05)';ctx.fillRect(0,0,cv.width,cv.height)}
  else if(season===2){ctx.fillStyle='rgba(200,130,50,0.035)';ctx.fillRect(0,0,cv.width,cv.height)}
  if(sim.drought){ctx.fillStyle='rgba(220,170,80,0.04)';ctx.fillRect(0,0,cv.width,cv.height)}
  if(!reduceMotion&&SPEEDS[speedIx]>0)renderWeather(dt);
  renderMinimap();
}
function renderWeather(dt){
  const t=sim.weather.type;
  if(t==='clear'||t==='overcast'){wxParticles.length=0;
    if(t==='overcast'){ctx.fillStyle='rgba(30,30,40,0.08)';ctx.fillRect(0,0,cv.width,cv.height)}
    return}
  const want=t==='storm'?110:70;
  while(wxParticles.length<want)wxParticles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,v:0.5+Math.random()});
  if(wxParticles.length>want)wxParticles.length=want;
  ctx.strokeStyle=t==='snow'?'rgba(220,228,238,0.5)':'rgba(140,170,200,0.4)';
  ctx.fillStyle='rgba(220,228,238,0.6)';
  ctx.lineWidth=1*DPR;
  ctx.beginPath();
  for(const p of wxParticles){
    if(t==='snow'){
      p.y+=p.v*40*dt*DPR;p.x+=Math.sin(p.y*0.01)*0.5;
      ctx.moveTo(p.x,p.y);ctx.arc(p.x,p.y,1.2*DPR,0,7);
    }else{
      const sp=(t==='storm'?900:520)*dt*DPR*p.v;
      p.x-=sp*0.25;p.y+=sp;
      ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+3*DPR,p.y-12*DPR);
    }
    if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width}
    if(p.x<0)p.x=cv.width;
  }
  ctx.stroke();
  if(t==='snow')ctx.fill();
  if(t==='storm'&&Math.random()<0.008){ctx.fillStyle='rgba(255,255,240,0.12)';ctx.fillRect(0,0,cv.width,cv.height)}
}
function followEntity(){
  const f=cam.follow;
  if(!f)return null;
  if(f.type==='person')return sim.people.get(f.id)||null;
  if(f.type==='army')return sim.armies.find(a=>a.id===f.id&&!a.dead)||null;
  if(f.type==='caravan')return sim.caravans.find(c=>c.id===f.id&&!c.dead)||null;
  if(f.type==='animal')return sim.animals.find(a=>a.id===f.id)||null;
  return null;
}

/* ---------- minimap ---------- */
const mmCv=$('#minimap'),mmCtx=mmCv.getContext('2d');
const mmBase=document.createElement('canvas'),mmBaseCtx=mmBase.getContext('2d');
let mmLast=0;
function renderMinimap(){
  if(!world)return;
  const now=performance.now();
  if(mmCv.width!==world.W){mmCv.width=world.W;mmCv.height=world.H;
    mmBase.width=world.W;mmBase.height=world.H;
    const scale=Math.min(216/world.W,150/world.H);
    mmCv.style.width=Math.round(world.W*scale)+'px';mmCv.style.height=Math.round(world.H*scale)+'px';
    minimapDirty=true}
  if(minimapDirty||now-mmLast>2500){
    minimapDirty=false;mmLast=now;
    const img=mmBaseCtx.createImageData(world.W,world.H);
    const d=img.data;
    for(let i=0;i<world.W*world.H;i++){
      let hex=BIOME_DEF[world.biome[i]].mini;
      if(world.river[i])hex='#2a4356';
      if(ui.showRoads&&world.road[i]>=ROAD_T)hex='#7a7268';
      let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      const t=world.terrId[i];
      if(t>=0){const st=sim.settlements[t];
        if(st&&!st.razed){const fc=sim.factions[st.fac].color;
          const fr=parseInt(fc.slice(1,3),16),fg=parseInt(fc.slice(3,5),16),fb=parseInt(fc.slice(5,7),16);
          r=(r*0.55+fr*0.45)|0;g=(g*0.55+fg*0.45)|0;b=(b*0.55+fb*0.45)|0}}
      d[i*4]=r;d[i*4+1]=g;d[i*4+2]=b;d[i*4+3]=255;
    }
    mmBaseCtx.putImageData(img,0,0);
    for(const st of sim.settlements){
      if(st.razed)continue;
      mmBaseCtx.fillStyle='#f2e8cf';
      mmBaseCtx.fillRect(st.x-(st.popC>=60?1:0),st.y-(st.popC>=60?1:0),st.popC>=60?3:2,st.popC>=60?3:2);
    }
  }
  mmCtx.drawImage(mmBase,0,0);
  // viewport rect
  const vr=viewRange();
  mmCtx.strokeStyle='#e0455a';mmCtx.lineWidth=1;
  mmCtx.strokeRect(cam.x-vr.cols/2,cam.y-vr.rows/2,vr.cols,vr.rows);
  // armies as red dots, wildfires as embers
  for(const a of sim.armies){mmCtx.fillStyle='#ff6a6a';mmCtx.fillRect(a.x,a.y,2,2)}
  mmCtx.fillStyle='#e0763a';
  for(const kS of Object.keys(sim.fires)){const i=+kS;mmCtx.fillRect(i%world.W,(i/world.W)|0,1,1)}
  for(const s of sim.ships){mmCtx.fillStyle='#e8ddbd';mmCtx.fillRect(s.x,s.y,1,1)}
  const bst=sim.beast&&!sim.beast.slain?sim.animals.find(a=>a.id===sim.beast.id):null;
  if(bst){mmCtx.fillStyle='#ff5040';mmCtx.fillRect(bst.x-1,bst.y-1,3,3)}
}
</script>
<script>
'use strict';
/* ============ UI ============ */
let booting=true;
const ui={
  tab:'inspect',labels:true,showRoads:true,histFilter:'all',histSearch:'',
  _refresh:0,_lastEvCount:0,
  tick(ev){
    if(booting)return;
    const tk=$('#ticker');
    const div=document.createElement('div');
    div.className='tl';
    div.innerHTML='<span class="y">Y'+Math.floor(ev.d/DAYS_Y)+'</span>'+esc(ev.text);
    if(ev.x>=0){div.addEventListener('click',()=>{jumpTo(ev.x,ev.y)})}
    tk.appendChild(div);
    while(tk.children.length>6)tk.removeChild(tk.firstChild);
  },
  toast(text,x,y){
    if(booting)return;
    const tc=$('#toasts');
    if(tc.children.length>3)tc.removeChild(tc.firstChild);
    const t=document.createElement('div');
    t.className='toast';t.textContent=text;
    if(x!==undefined&&x>=0)t.addEventListener('click',()=>jumpTo(x,y));
    tc.appendChild(t);
    setTimeout(()=>{t.classList.add('fade');setTimeout(()=>t.remove(),900)},5200);
  },
  refreshSoon(){this._refresh=0},
  setTab(name){
    this.tab=name;
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
    this.renderPanel(true);
  },
  renderPanel(force){
    const pb=$('#panelbody');
    if($('#side').classList.contains('hidden'))return;
    const st=pb.scrollTop;
    if(this.tab==='inspect')pb.innerHTML=renderInspect();
    else if(this.tab==='realms')pb.innerHTML=renderRealms();
    else if(this.tab==='chronicle'){
      if(force||sim.events.length!==this._lastEvCount){pb.innerHTML=renderChronicle();this._lastEvCount=sim.events.length}
      else return;
    }
    else if(this.tab==='stats'){pb.innerHTML=renderStats();drawCharts()}
    pb.scrollTop=st;
  }
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function jumpTo(x,y){cam.follow=null;avatarMode=false;cam.x=x+0.5;cam.y=y+0.5;if(cam.cell<10)cam.cell=14;terrainDirty=true}
function L(type,id,label){return '<span class="lnk" data-go="'+type+':'+id+'">'+esc(label)+'</span>'}

/* ---------- inspect renderers ---------- */
function renderInspect(){
  if(!sel)return '<div class="sub" style="margin-top:8px">Click anything in the world — a villager, a beast, a town, a marching army — to inspect it.<br><br>Drag to pan · scroll to zoom · <b>space</b> pause · <b>?</b> help.</div>';
  switch(sel.type){
    case 'person':return renderPerson(sel.id);
    case 'sett':return renderSett(sel.id);
    case 'fac':return renderFac(sel.id);
    case 'army':return renderArmy(sel.id);
    case 'animal':return renderAnimal(sel.id);
    case 'religion':return renderReligion(sel.id);
    case 'relic':return renderRelic(sel.id);
    case 'corpse':return renderCorpse(sel.id);
    case 'tile':default:return renderTile(sel.x,sel.y);
  }
}
function renderTile(x,y){
  if(!inb(x,y))return '<div class="sub">Beyond the edge of the world.</div>';
  const i=idx(x,y);
  const b=world.biome[i],def=BIOME_DEF[b];
  let h='<h2>'+def.name+'</h2><div class="sub">'+x+', '+y+(world.river[i]?' · river':'')+(world.road[i]>=ROAD_T?(world.river[i]?' · bridge':' · road'):'')+'</div>';
  const bld=world.building[i];
  if(bld)h+='<div class="kv"><div class="k">Structure</div><div class="v">'+BUILD_DEF[bld].name+'</div></div>';
  if(world.resource[i])h+='<div class="kv"><div class="k">Resource</div><div class="v">'+RES_DEF[world.resource[i]].name+'</div></div>';
  const sid=world.settleId[i],tid=world.terrId[i];
  if(sid>=0&&sim.settlements[sid]&&!sim.settlements[sid].razed)h+='<h3>Settlement</h3>'+L('sett',sid,sim.settlements[sid].nm);
  else if(tid>=0&&sim.settlements[tid]&&!sim.settlements[tid].razed){
    const stt=sim.settlements[tid];

function renderChronicle(){
  let h='<h2>The Chronicle</h2>';
  h+='<div class="btnrow"><button data-act2="timelapse">⏳ Timelapse of the realms</button></div>';
  const named=sim.eras.filter(e=>e.nm);
  if(named.length){
    h+='<h3>Eras</h3>';
    for(const e of named)h+='<div class="evline"><span class="y">Y'+e.from+'–'+(e.to!==undefined?e.to:'now')+'</span><b>'+esc(e.nm)+'</b></div>';
  }
  h+='<input id="histsearch" placeholder="search the chronicle…" value="'+esc(ui.histSearch)+'">';
  h+='<div class="filters"><button data-f="all" class="'+(ui.histFilter==='all'?'on':'')+'">All</button>';
  for(const k in EV_TYPES)h+='<button data-f="'+k+'" class="'+(ui.histFilter===k?'on':'')+'">'+EV_TYPES[k]+'</button>';
  h+='</div>';
  const q=ui.histSearch.toLowerCase();
  let shown=0;
  const rows=[];
  for(let i=sim.events.length-1;i>=0&&shown<250;i--){
    const e=sim.events[i];
    if(ui.histFilter!=='all'&&e.type!==ui.histFilter)continue;
    if(q&&!e.text.toLowerCase().includes(q))continue;
    rows.push('<div class="evline ev-'+e.type+' jump" data-ev="'+e.id+'"><span class="y">Y'+Math.floor(e.d/DAYS_Y)+'</span>'+esc(e.text)+'</div>');
    shown++;
  }
  h+=rows.join('')||'<div class="sub">Nothing yet — history is still being written.</div>';
  h+='<div class="sub" style="margin-top:8px">'+sim.events.length+' recorded events</div>';
  return h;
}
function renderStats(){
  const y=curYear();
  let animals=sim.animals.length;
  let h='<h2>The World in Year '+y+'</h2>';
  h+='<div class="statgrid">';
  h+='<div><div class="statnum">'+sim.people.size+'</div><div class="statlab">People</div></div>';
  h+='<div><div class="statnum">'+sim.settlements.filter(s=>!s.razed).length+'</div><div class="statlab">Settlements</div></div>';
  h+='<div><div class="statnum">'+sim.factions.filter(f=>!f.dead).length+'</div><div class="statlab">Living realms</div></div>';
  h+='<div><div class="statnum">'+animals+'</div><div class="statlab">Wild beasts</div></div>';
  h+='<div><div class="statnum">'+sim.souls.size+'</div><div class="statlab">Remembered dead</div></div>';
  h+='<div><div class="statnum">'+sim.events.length+'</div><div class="statlab">Chronicle entries</div></div>';
  h+='</div>';
  h+='<h3>Population over time</h3><canvas class="chart" id="chartPop" width="640" height="220"></canvas>';
  h+='<h3>Realms over time</h3><canvas class="chart" id="chartFac" width="640" height="220"></canvas>';
  if(world.brains)h+='<h3>Neural evolution: circuit gain by lineage</h3>'+
    '<canvas class="chart" id="chartEvo" width="640" height="180"></canvas>'+
    '<div class="sub" style="font-size:11px">green: escape gain in prey · red: pursuit gain in predators · drift = natural selection on real connectome parameters</div>';
  h+='<div class="sub">seed <b>'+esc(world.seedStr)+'</b> · '+world.W+'×'+world.H+' tiles</div>';
  return h;
}
function drawCharts(){
  const s=sim.stats;
  drawLine($('#chartPop'),[{data:s.pop,color:'#cfc4a6'},{data:s.wild,color:'#7f9150'}],s.yr);
  const series=[];
  for(const f of sim.factions){const d=s.fac[f.id];if(d&&d.some(v=>v>0))series.push({data:d,color:f.color})}
  drawLine($('#chartFac'),series,s.yr);
  const ce=$('#chartEvo');
  if(ce)drawLine(ce,[{data:s.evoPrey||[],color:'#7f9150'},{data:s.evoPred||[],color:'#e0455a'}],s.yr);
}
function drawLine(cnv,series,xs){
  if(!cnv)return;
  const g=cnv.getContext('2d');
  const W=cnv.width,H=cnv.height;
  g.fillStyle='#12100c';g.fillRect(0,0,W,H);
  let max=10;
  for(const s of series)for(const v of s.data)if(v>max)max=v;
  g.strokeStyle='#2a241d';g.lineWidth=1;g.beginPath();
  for(let i=1;i<4;i++){g.moveTo(0,H*i/4);g.lineTo(W,H*i/4)}
  g.stroke();
  g.font='10px "IBM Plex Mono"';g.fillStyle='#5c5546';
  g.fillText(String(max),4,10);
  if(xs&&xs.length>1){g.fillText('Y'+xs[0],4,H-4);g.fillText('Y'+xs[xs.length-1],W-40,H-4)}
  for(const s of series){
    const d=s.data;if(!d||d.length<2)continue;
    g.strokeStyle=s.color;g.lineWidth=1.5;g.beginPath();
    for(let i=0;i<d.length;i++){
      const x=i/(d.length-1)*(W-8)+4,y=H-6-(d[i]/max)*(H-16);
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
}

/* ---------- panel interactions ---------- */
$('#panelbody').addEventListener('click',e=>{
  // lesion tool: click a neuron on the anatomy view to silence or restore it
  if(e.target.id==='wormAnat'&&world&&world.brains&&sel&&sel.type==='animal'){
    const a=sim.animals.find(x=>x.id===sel.id);
    if(a&&a.brain){
      const rect=e.target.getBoundingClientRect();
      const mx=(e.clientX-rect.left)/rect.width*330,my=(e.clientY-rect.top)/rect.height*130;
      let bi=-1,bd2=70;
      for(let i=0;i<WORM.n;i++){
        const x=8+WORM.ax[i]*314,y=14+WORM.ay[i]*102;
        const d2=(x-mx)*(x-mx)+(y-my)*(y-my);
        if(d2<bd2){bd2=d2;bi=i}
      }
      if(bi>=0){
        if(!a.brain.les)a.brain.les=new Uint8Array(WORM.n);
        a.brain.les[bi]^=1;
        toast((a.brain.les[bi]?'⚡ Lesioned ':'✚ Restored ')+WORM.names[bi]+'.');
      }
    }
    return;
  }
  const act2=e.target.closest('[data-act2]');
  if(act2&&act2.dataset.act2==='timelapse'){openTimelapse();return}
  const go=e.target.closest('[data-go]');
  if(go){
    const[type,idS]=go.dataset.go.split(':');const id=+idS;
    if(type==='book'){showBook(id);return}
    sel={type,id};
    if(type==='sett'){const st=sim.settlements[id];if(st)jumpTo(st.x,st.y)}
    if(type==='fac'){const f=sim.factions[id];const cap=sim.settlements[f.capital];if(cap&&!f.dead)jumpTo(cap.x,cap.y)}
    if(type==='person'){const p=sim.people.get(id);if(p)jumpTo(p.x,p.y)}
    ui.setTab('inspect');return;
  }
  const act=e.target.closest('[data-act]');
  if(act&&sel){
    const a=act.dataset.act;
    if(a==='follow'){cam.follow={type:'person',id:sel.id};avatarMode=false;const p=sim.people.get(sel.id);if(p)toast('Following '+fullName(p)+'. Click the map to stop.')}
    if(a==='followArmy')cam.follow={type:'army',id:sel.id};
    if(a==='followAnimal')cam.follow={type:'animal',id:sel.id};
    if(a==='goto'){
      if(sel.type==='sett'){const st=sim.settlements[sel.id];if(st)jumpTo(st.x,st.y)}
      else if(sel.type==='person'){const p=sim.people.get(sel.id);if(p)jumpTo(p.x,p.y)}
    }
    if(a==='tree'&&sel.type==='person')showFamilyTree(sel.id);
    return;
  }
  const f=e.target.closest('[data-f]');
  if(f){ui.histFilter=f.dataset.f;ui.renderPanel(true);return}
  const evb=e.target.closest('[data-ev]');
  if(evb){showEventCard(+evb.dataset.ev);return}
  const j=e.target.closest('[data-j]');
  if(j){const[x,y]=j.dataset.j.split(',').map(Number);jumpTo(x,y)}
});
/* ---------- the event card: history as data, cause chained to consequence ---------- */
function showEventCard(id){
  const e=getEv(id);
  if(!e){alertBox('That record has crumbled to dust — the chronicle prunes its oldest minor pages.');return}
  const pl=pid=>{const p=getP(pid);return p?L('person',pid,p.nm+' '+p.sur+(p.dead?' ☠':'')):'a name lost'};
  const evline=c=>'<div class="evline jump" data-evc="'+c.id+'" style="cursor:pointer"><span class="y">Y'+Math.floor(c.d/DAYS_Y)+'</span>'+esc(c.text)+'</div>';
  let h='<h2>Event #'+e.id+'</h2>';
  h+='<div class="kv" style="font-size:12px;margin-bottom:6px">';
  h+='<div class="k">Year</div><div class="v">'+Math.floor(e.d/DAYS_Y)+' · '+SEASONS[Math.floor((e.d%DAYS_Y)/DAYS_S)]+'</div>';
  h+='<div class="k">Type</div><div class="v">'+(EV_TYPES[e.type]||e.type)+'</div>';
  if(e.actor)h+='<div class="k">Actor</div><div class="v">'+pl(e.actor)+'</div>';
  if(e.victim)h+='<div class="k">Victim</div><div class="v">'+pl(e.victim)+'</div>';
  if(e.x>=0)h+='<div class="k">Location</div><div class="v"><span class="lnk" data-evjump="'+e.x+','+e.y+'">'+e.x+', '+e.y+' · go there</span></div>';
  h+='</div>';
  h+='<div style="margin:8px 0 12px;color:#d8cdb3;line-height:1.6">'+esc(e.text)+'</div>';
  if(e.why){
    h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:4px">Decision weights</div>';
    h+='<div class="kv" style="font-size:11px">';
    for(const[k,v]of Object.entries(e.why))h+='<div class="k">'+esc(k)+'</div><div class="v">'+esc(typeof v==='number'?String(Math.round(v*100)/100):String(v))+'</div>';
    h+='</div><div class="sub" style="font-size:10px;margin:4px 0 8px">the measured factors that produced this act — nothing here was scripted</div>';
  }
  if(e.causeId!==undefined||e.causeTxt){
    h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:4px">Cause</div>';
    if(e.causeId!==undefined){
      const c=getEv(e.causeId);
      h+=c?evline(c):'<div class="sub">a record lost to time</div>';
    }else h+='<div class="sub">'+esc(e.causeTxt)+'</div>';
  }
  if(e.cons&&e.cons.length){
    h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:2px;margin:10px 0 4px">Consequences</div>';
    for(const cid of e.cons){const c=getEv(cid);if(c)h+=evline(c)}
  }
  showModal(h);
}

/* ---------- input: mouse ---------- */
let dragging=false,dragMoved=false,lastMx=0,lastMy=0;
cv.addEventListener('mousedown',e=>{dragging=true;dragMoved=false;lastMx=e.clientX;lastMy=e.clientY;cv.classList.add('drag')});
addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastMx,dy=e.clientY-lastMy;
  if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
  if(dragMoved){cam.follow=null;
    cam.x-=dx*DPR/Math.ceil(cam.cell*DPR);cam.y-=dy*DPR/Math.ceil(cam.cell*DPR);
    clampCam();
    lastMx=e.clientX;lastMy=e.clientY;}
});
addEventListener('mouseup',e=>{
  cv.classList.remove('drag');
  if(!dragging)return;
  dragging=false;
  if(!dragMoved&&e.target===cv)pickAt(e.clientX,e.clientY);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const px=Math.ceil(cam.cell*DPR);
  const wx=cam.x+(e.clientX*DPR-cv.width/2)/px;
  const wy=cam.y+(e.clientY*DPR-cv.height/2)/px;
  const dir=e.deltaY<0?1:-1;
  let c=cam.cell+dir*Math.max(1,Math.round(cam.cell*0.18));
  c=clamp(c,3,40);
  if(c!==cam.cell){
    cam.cell=c;
    const px2=Math.ceil(cam.cell*DPR);
    cam.x=wx-(e.clientX*DPR-cv.width/2)/px2;
    cam.y=wy-(e.clientY*DPR-cv.height/2)/px2;
    clampCam();terrainDirty=true;
  }
},{passive:false});
function clampCam(){cam.x=clamp(cam.x,-10,world.W+10);cam.y=clamp(cam.y,-10,world.H+10)}
function pickAt(cx,cy){
  const px=Math.ceil(cam.cell*DPR);
  const wx=Math.floor(cam.x+(cx*DPR-cv.width/2)/px);
  const wy=Math.floor(cam.y+(cy*DPR-cv.height/2)/px);
  if(!inb(wx,wy)){sel=null;ui.renderPanel(true);return}
  cam.follow=null;
  // priority: person > army > caravan > animal > settlement center-ish > tile
  for(const p of sim.people.values())if(!p.inArmy&&p.x===wx&&p.y===wy){sel={type:'person',id:p.id};done();return}
  for(const a of sim.armies)if(!a.dead&&Math.abs(a.x-wx)<=0&&Math.abs(a.y-wy)<=0){sel={type:'army',id:a.id};done();return}
  for(const a of sim.animals)if(a.x===wx&&a.y===wy){sel={type:'animal',id:a.id};done();return}
  for(const c of sim.corpses)if(c.x===wx&&c.y===wy){sel={type:'corpse',id:c.id};done();return}
  const sid=world.settleId[idx(wx,wy)];
  if(sid>=0&&sim.settlements[sid]&&!sim.settlements[sid].razed&&world.building[idx(wx,wy)]){sel={type:'sett',id:sid};done();return}
  sel={type:'tile',x:wx,y:wy};done();
  function done(){$('#side').classList.remove('hidden');mmPos();ui.setTab('inspect')}
}

/* ---------- input: keys ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  keys[e.key]=true;
  const k=e.key;
  if(k===' '){e.preventDefault();togglePause()}
  else if(k>='1'&&k<='7'){setSpeed(+k-1)}
  else if(k==='+'||k==='='){zoomKey(1)}
  else if(k==='-'||k==='_'){zoomKey(-1)}
  else if(k==='Tab'){e.preventDefault();togglePanel()}
  else if(k==='?'){showHelp()}
  else if(k==='e'||k==='E'){toggleAvatar()}
  else if(k==='t'||k==='T'){ui.labels=!ui.labels}
  else if(k==='r'||k==='R'){toggleRoads(!ui.showRoads)}
  else if(k==='h'||k==='H'){$('#side').classList.remove('hidden');mmPos();ui.setTab('chronicle')}
  else if(k==='f'||k==='F'){
    if(sel&&sel.type==='person')cam.follow={type:'person',id:sel.id};
    else if(sel&&sel.type==='army')cam.follow={type:'army',id:sel.id};
    else if(sel&&sel.type==='animal')cam.follow={type:'animal',id:sel.id};
  }
  else if(k==='Escape'){$('#modal').classList.add('hidden');tlSetPlay(false);$('#tl').classList.add('hidden');cam.follow=null}
});
addEventListener('keyup',e=>{keys[e.key]=false});
function zoomKey(dir){let c=clamp(cam.cell+dir*Math.max(1,Math.round(cam.cell*0.18)),3,40);cam.cell=c;terrainDirty=true}
function handleHeldKeys(dt){
  const panSpeed=26/Math.sqrt(cam.cell)*dt*10;
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a'])dx-=1;
  if(keys['ArrowRight']||keys['d'])dx+=1;
  if(keys['ArrowUp']||keys['w'])dy-=1;
  if(keys['ArrowDown']||keys['s'])dy+=1;
  if(!dx&&!dy)return;
  if(avatarMode&&avatar){
    avatar._mt=(avatar._mt||0)+dt;
    if(avatar._mt>0.09){avatar._mt=0;
      const nx=avatar.x+dx,ny=avatar.y+dy;
      if(inb(nx,ny)&&passable(idx(nx,ny))){avatar.x=nx;avatar.y=ny}}
  }else{
    cam.follow=null;
    cam.x+=dx*panSpeed;cam.y+=dy*panSpeed;clampCam();
  }
}
function toggleAvatar(){
  if(avatarMode){avatarMode=false;avatar=null;$('#btnAvatar').classList.remove('on');toast('You drift back into the sky.');return}
  // find passable tile near camera center
  let sx=Math.round(cam.x),sy=Math.round(cam.y),spot=null;
  outer:for(let r=0;r<30;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const x=sx+dx,y=sy+dy;
    if(inb(x,y)&&passable(idx(x,y))){spot={x,y};break outer}
  }
  if(!spot)return;
  avatar={x:spot.x,y:spot.y,rx:spot.x,ry:spot.y};
  avatarMode=true;cam.follow=null;
  $('#btnAvatar').classList.add('on');
  toast('You walk the earth as a wanderer — arrow keys / WASD to move. E to release.');
}

/* ---------- speed ---------- */
function hwMaxSpeedIx(){
  // ladder adapts to the processor; pro worlds trade top speed for depth
  const c=navigator.hardwareConcurrency||4;
  if(world&&world.pro)return c>=12?6:c>=8?5:4;   // 100x / 25x / 10x
  return c>=6?6:c>=4?5:4;
}
function buildSpeedButtons(){
  const maxIx=world?hwMaxSpeedIx():SPEEDS.length-1;
  const sp=$('#speeds');
  sp.innerHTML='';
  SPEEDS.forEach((s,i)=>{
    if(i>maxIx)return;
    const b=document.createElement('button');
    b.textContent=s===0?'⏸':s+'×';
    b.title=s===0?'Pause (space)':'Speed '+s+'× (key '+(i+1)+')';
    b.addEventListener('click',()=>setSpeed(i));
    sp.appendChild(b);
  });
  if(speedIx>maxIx)speedIx=maxIx;
  syncSpeedUI();
}
function setSpeed(i){const mx=world?hwMaxSpeedIx():SPEEDS.length-1;if(i>=0&&i<=mx){speedIx=i;syncSpeedUI()}}
function syncSpeedUI(){[...$('#speeds').children].forEach((b,i)=>b.classList.toggle('on',i===speedIx))}
let prePauseIx=1;
function togglePause(){
  if(SPEEDS[speedIx]===0)setSpeed(prePauseIx||1);
  else{prePauseIx=speedIx;setSpeed(0)}
}

/* ---------- timelapse ---------- */
let tlTimer=null,tlBg=null;
function openTimelapse(){
  if(!sim.snaps.length){toast('History is too young for a timelapse — come back in a decade.');return}
  const hw=world.W>>1,hh=world.H>>1;
  const cv2=$('#tlCv');cv2.width=hw;cv2.height=hh;
  const scale=Math.max(2,Math.floor(Math.min(innerWidth*0.88/hw,innerHeight*0.72/hh)));
  cv2.style.width=(hw*scale)+'px';cv2.style.height=(hh*scale)+'px';
  if(!tlBg||tlBg.width!==hw){
    tlBg=document.createElement('canvas');tlBg.width=hw;tlBg.height=hh;
    const g=tlBg.getContext('2d');const img=g.createImageData(hw,hh);
    for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){
      const hex=BIOME_DEF[world.biome[(y*2)*world.W+x*2]].mini;
      const o=(y*hw+x)*4;
      img.data[o]=parseInt(hex.slice(1,3),16);img.data[o+1]=parseInt(hex.slice(3,5),16);
      img.data[o+2]=parseInt(hex.slice(5,7),16);img.data[o+3]=255;
    }
    g.putImageData(img,0,0);
  }
  const r=$('#tlR');r.max=sim.snaps.length-1;r.value=0;
  $('#tl').classList.remove('hidden');
  drawTL(0);
  tlSetPlay(true);
}
function drawTL(ix){
  const snap=sim.snaps[ix];if(!snap)return;
  const hw=world.W>>1,hh=world.H>>1;
  const g=$('#tlCv').getContext('2d');
  g.drawImage(tlBg,0,0);
  const data=decodeSnap(snap,hw,hh);
  g.globalAlpha=0.8;
  let last=-1;
  for(let i=0;i<data.length;i++){
    const v=data[i];
    if(v===255)continue;
    if(v!==last){g.fillStyle=FAC_COLORS[v%FAC_COLORS.length];last=v}
    g.fillRect(i%hw,(i/hw)|0,1,1);
  }
  g.globalAlpha=1;
  $('#tlY').textContent='Y'+snap.y;
}
function tlSetPlay(on){
  if(tlTimer){clearInterval(tlTimer);tlTimer=null}
  $('#tlPlay').textContent=on?'⏸':'▶';
  if(on)tlTimer=setInterval(()=>{
    const r=$('#tlR');
    let v=+r.value+1;
    if(v>+r.max){tlSetPlay(false);return}
    r.value=v;drawTL(v);
  },110);
}
$('#tlR').addEventListener('input',e=>{tlSetPlay(false);drawTL(+e.target.value)});
$('#tlPlay').addEventListener('click',()=>tlSetPlay(!tlTimer));
$('#tlClose').addEventListener('click',()=>{tlSetPlay(false);$('#tl').classList.add('hidden')});

/* ---------- save / load ---------- */
function saveString(){
  const soulsArr=[];
  let kept=0;
  const arr=[...sim.souls.values()];
  for(let i=arr.length-1;i>=0;i--){
    const s=arr[i];
    if(s.notable||kept<4000){soulsArr.push(s);kept++}
  }
  const data={v:2,seedStr:world.seedStr,W:world.W,H:world.H,name:world.name,
    biome:b64FromBuf(world.biome.buffer),river:b64FromBuf(world.river.buffer),road:b64FromBuf(world.road.buffer),
    building:b64FromBuf(world.building.buffer),resource:b64FromBuf(world.resource.buffer),variant:b64FromBuf(world.variant.buffer),
    cut:b64FromBuf(world.cut.buffer),
    settleId:b64FromBuf(world.settleId.buffer),
    elevQ:b64FromBuf(new Uint8Array([...world.elev].map(v=>clamp(Math.round((v+1)*127),0,255))).buffer),
    brains:world.brains?1:0,pro:world.pro?1:0,
    cultures:CULTURES,
    sim:{day:sim.day,nextId:sim.nextId,people:[...sim.people.values()],souls:soulsArr,
      animals:sim.animals.map(a=>{const{brain,genes,...rest}=a;if(genes)rest.genes=Array.from(genes);return rest}),
      ships:sim.ships,relics:sim.relics,eras:sim.eras,books:sim.books,beast:sim.beast,corpses:sim.corpses,
      snaps:sim.snaps.map(o=>({y:o.y,d:b64FromBuf(o.d.buffer)})),
      armies:sim.armies,caravans:sim.caravans,migrants:sim.migrants,
      evSeq:sim.evSeq,
      mon:sim.mon||{},currencies:sim.currencies||[],
      settlements:sim.settlements.map(s=>{
        const r={};
        for(const k in s){if(k[0]==='_'||k==='famEv'||k==='plagueEv'||k==='inv'||k==='price'||k==='trade')continue;r[k]=s[k]}
        const eco=(typeof econSerSt==='function')?econSerSt(s):null;
        if(eco)r.eco=eco;
        return r;
      }),
      factions:sim.factions.map(f=>{
        const r={};
        for(const k in f){if(k[0]==='_'||k==='wars')continue;r[k]=f[k]}
        r.wars=Object.fromEntries(Object.entries(f.wars||{}).map(([k,w])=>{const{ev,...wr}=w;return[k,wr]}));
        return r;
      }),
      religions:sim.religions,
      relations:sim.relations,events:sim.events.slice(-3000),weather:sim.weather,drought:sim.drought,stats:sim.stats,fires:sim.fires},
    cam:{x:cam.x,y:cam.y,cell:cam.cell}};
  return JSON.stringify(data);
}
function loadString(str){
  const d=JSON.parse(str);
  if(d.v!==1&&d.v!==2)throw new Error('unknown save version');
  R=mulberry32(hashStr(d.seedStr)^0x9e37);
  makeCultures(hashStr(d.seedStr)); // same seed, same languages
  if(d.cultures&&d.cultures.length)CULTURES=d.cultures; // forked tongues live in the save, not the seed
  world={seedStr:d.seedStr,seed:hashStr(d.seedStr),W:d.W,H:d.H,name:d.name,
    biome:new Uint8Array(bufFromB64(d.biome)),river:new Uint8Array(bufFromB64(d.river)),road:new Uint8Array(bufFromB64(d.road)),
    building:new Uint8Array(bufFromB64(d.building)),resource:new Uint8Array(bufFromB64(d.resource)),variant:new Uint8Array(bufFromB64(d.variant)),
    cut:d.cut?new Uint8Array(bufFromB64(d.cut)):new Uint8Array(d.W*d.H),
    settleId:new Int16Array(bufFromB64(d.settleId)),terrId:new Int16Array(d.W*d.H).fill(-1),
    elev:new Float32Array([...new Uint8Array(bufFromB64(d.elevQ))].map(v=>v/127-1)),
    moist:new Float32Array(d.W*d.H)};
  const s=d.sim;
  sim={day:s.day,nextId:s.nextId,people:new Map(s.people.map(p=>[p.id,p])),souls:new Map(s.souls.map(p=>[p.id,p])),
    animals:s.animals,armies:s.armies,caravans:s.caravans,migrants:s.migrants,settlements:s.settlements,
    factions:s.factions,religions:s.religions,relations:s.relations,events:s.events,weather:s.weather,
    drought:s.drought,stats:s.stats,pathQueue:[]};
  sim.fires=s.fires||{};
  sim.evSeq=s.evSeq||((sim.events&&sim.events.length)?Math.max(...sim.events.map(e=>e.id||0))+1:1);
  rebuildEvMap();
  sim.ships=s.ships||[];sim.relics=s.relics||[];sim.eras=s.eras||[];sim.books=s.books||[];
  sim.beast=s.beast||null;
  sim.corpses=s.corpses||[];
  sim.snaps=(s.snaps||[]).map(o=>({y:o.y,d:new Uint8Array(bufFromB64(o.d))}));
  tlBg=null;
  world.brains=!!d.brains;
  world.pro=!!d.pro;
  if(world.brains)wormInit();
  for(const f of sim.factions)if(!f.wars)f.wars={};
  for(const st of sim.settlements){if(st.rad===undefined)st.rad=5;if(!st.canals)st.canals=[];if(st.hasCanal===undefined)st.hasCanal=false;
    if(typeof econDeserSt==='function'){econDeserSt(st,st.eco||null);delete st.eco}}
  sim.mon=s.mon||{};sim.currencies=s.currencies||[];
  if(typeof initEconFac==='function')for(const f of sim.factions)initEconFac(f);
  cam.x=d.cam.x;cam.y=d.cam.y;cam.cell=d.cam.cell;cam.follow=null;
  sel=null;avatar=null;avatarMode=false;
  recomputeTerritory();
  terrainDirty=true;minimapDirty=true;
  $('#worldname').textContent='· '+world.name+(world.brains?' · worm minds':'')+(world.pro?' · pro':'');
  buildSpeedButtons();
}
